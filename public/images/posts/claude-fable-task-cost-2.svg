<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Fable 5.2 推理档位与任务配置省钱指南</text><g transform="translate(30, 70)"><rect x="0" y="0" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="32" rx="8" fill="#2563EB" /><text x="90" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">日常/简单任务</text><text x="90" y="55" text-anchor="middle" fill="#2563EB" font-size="14" font-weight="bold">Low / Medium</text><text x="90" y="80" text-anchor="middle" fill="#64748B" font-size="11">改文案、日常问答</text><text x="90" y="100" text-anchor="middle" fill="#16A34A" font-size="11" font-weight="bold">避免旗舰溢出浪费</text></g><g transform="translate(240, 70)"><rect x="0" y="0" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="32" rx="8" fill="#16A34A" /><text x="90" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">复杂编码/架构</text><text x="90" y="55" text-anchor="middle" fill="#16A34A" font-size="14" font-weight="bold">High 档</text><text x="90" y="80" text-anchor="middle" fill="#64748B" font-size="11">上代旗舰效果，成本减半</text><text x="90" y="100" text-anchor="middle" fill="#16A34A" font-size="11" font-weight="bold">性价比最高黄金档</text></g><g transform="translate(450, 70)"><rect x="0" y="0" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="32" rx="8" fill="#EA580C" /><text x="90" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">高风险/一次性</text><text x="90" y="55" text-anchor="middle" fill="#EA580C" font-size="14" font-weight="bold">XHigh 档</text><text x="90" y="80" text-anchor="middle" fill="#64748B" font-size="11">算错损失极大的场景</text><text x="90" y="100" text-anchor="middle" fill="#EA580C" font-size="11" font-weight="bold">按需购买过度检查</text></g><g transform="translate(135, 215)"><rect x="0" y="0" width="390" height="80" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" /><text x="195" y="25" text-anchor="middle" fill="#DC2626" font-size="14" font-weight="bold">⚠️ 避坑指南：切勿开启 Max 档</text><text x="195" y="50" text-anchor="middle" fill="#64748B" font-size="12">Token 消耗无上限，模型无限自我验证</text><text x="195" y="68" text-anchor="middle" fill="#DC2626" font-size="11">如同用跑车的油钱买菜，账单爆炸！</text></g><g transform="translate(30, 315)"><rect x="0" y="0" width="600" height="600" rx="8" fill="#F8FAFC" /><text x="300" y="30" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">省钱核心策略：别问哪个模型最强，问活需要多大配置</text></g></g></svg>