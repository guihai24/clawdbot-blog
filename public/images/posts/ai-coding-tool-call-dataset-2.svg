<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif" text-anchor="middle"><text x="330" y="45" font-size="20" font-weight="bold" fill="#1E293B">为什么私有用量比公开语料更稀缺？</text><rect x="40" y="80" width="260" height="270" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="170" y="115" font-size="16" font-weight="bold" fill="#2563EB">公开语料 (GitHub)</text><text x="170" y="150" font-size="13" fill="#64748B">• 干净、正确、结构漂亮</text><text x="170" y="185" font-size="13" fill="#64748B">• 只有“最终合并的代码”</text><text x="170" y="220" font-size="13" fill="#64748B">• 缺少试错过程与上下文</text><text x="170" y="285" font-size="13" font-weight="bold" fill="#EA580C">价值：只能学会“做对”</text><rect x="360" y="80" width="260" height="270" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="490" y="115" font-size="16" font-weight="bold" fill="#16A34A">私有会话数据</text><text x="490" y="150" font-size="13" fill="#64748B">• 包含你的判断标准</text><text x="490" y="185" font-size="13" fill="#64748B">• 强特化的项目上下文</text><text x="490" y="220" font-size="13" fill="#64748B">• 宝贵的“纠错路径”</text><text x="490" y="285" font-size="13" font-weight="bold" fill="#16A34A">价值：知道“错在哪、怎么改”</text></g></svg>