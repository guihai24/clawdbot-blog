<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08" /></filter></defs><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="28" y="26" font-size="13" font-weight="700" fill="#374151">从签约到收款：上架四步</text><rect x="20" y="40" width="140" height="152" rx="10" fill="#FFFFFF" filter="url(#sh)" /><circle cx="90" cy="72" r="15" fill="#2563EB" /><text x="90" y="77" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="90" y="108" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">签约</text><text x="90" y="134" font-size="11" fill="#6B7280" text-anchor="middle">开通商家/开发者能力</text><text x="90" y="152" font-size="11" fill="#6B7280" text-anchor="middle">拿到可上架的应用身份</text><text x="90" y="170" font-size="11" fill="#6B7280" text-anchor="middle">看清结算与抽成</text><rect x="180" y="40" width="140" height="152" rx="10" fill="#FFFFFF" filter="url(#sh)" /><circle cx="250" cy="72" r="15" fill="#9333EA" /><text x="250" y="77" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="250" y="108" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">封装 Skill</text><text x="250" y="134" font-size="11" fill="#6B7280" text-anchor="middle">写清触发与输入输出</text><text x="250" y="152" font-size="11" fill="#6B7280" text-anchor="middle">补上失败处理</text><text x="250" y="170" font-size="11" fill="#6B7280" text-anchor="middle">陌生需求能试跑通过</text><rect x="340" y="40" width="140" height="152" rx="10" fill="#FFFFFF" filter="url(#sh)" /><circle cx="410" cy="72" r="15" fill="#EA580C" /><text x="410" y="77" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="410" y="108" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">定价</text><text x="410" y="134" font-size="11" fill="#6B7280" text-anchor="middle">买断或订阅</text><text x="410" y="152" font-size="11" fill="#6B7280" text-anchor="middle">设置免费试用次数</text><text x="410" y="170" font-size="11" fill="#6B7280" text-anchor="middle">一句话说清价值</text><rect x="500" y="40" width="140" height="152" rx="10" fill="#FFFFFF" filter="url(#sh)" /><circle cx="570" cy="72" r="15" fill="#16A34A" /><text x="570" y="77" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="570" y="108" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上线收款</text><text x="570" y="134" font-size="11" fill="#6B7280" text-anchor="middle">提交审核后挂出</text><text x="570" y="152" font-size="11" fill="#6B7280" text-anchor="middle">订单与结算周期</text><text x="570" y="170" font-size="11" fill="#6B7280" text-anchor="middle">退款规则后台可查</text><line x1="164" y1="112" x2="176" y2="112" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="324" y1="112" x2="336" y2="112" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="484" y1="112" x2="496" y2="112" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" /><rect x="20" y="212" width="620" height="160" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="20" y="212" width="4" height="160" rx="2" fill="#D97706" /><text x="44" y="244" font-size="14" font-weight="700" fill="#111827">签约环节：最该花时间读清的三件事</text><text x="44" y="264" font-size="11" fill="#6B7280">不是点同意，而是确认收入链条上的风险边界</text><rect x="44" y="278" width="180" height="72" rx="8" fill="#FEF3C7" /><text x="134" y="306" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">结算周期</text><text x="134" y="328" font-size="11" fill="#92400E" text-anchor="middle">钱多久到账、怎么结</text><rect x="240" y="278" width="180" height="72" rx="8" fill="#DBEAFE" /><text x="330" y="306" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">退款责任</text><text x="330" y="328" font-size="11" fill="#1E40AF" text-anchor="middle">买卖双方怎么分摊</text><rect x="436" y="278" width="180" height="72" rx="8" fill="#FEE2E2" /><text x="526" y="306" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">单方下架</text><text x="526" y="328" font-size="11" fill="#991B1B" text-anchor="middle">平台能否单方面停售</text></g></svg>