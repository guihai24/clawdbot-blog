<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" style="background: #FAFAFA; font-family: -apple-system, 'Segoe UI', sans-serif;"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">16 帧低帧率：风格化应用的双向选择</text><g transform="translate(40, 80)"><rect width="265" height="270" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="45" cy="45" r="20" fill="#EF4444" opacity="0.1"/><text x="45" y="52" text-anchor="middle" font-size="16" fill="#EF4444">✕</text><text x="80" y="50" font-size="16" font-weight="700" fill="#1E293B">错误方向：追求丝滑</text><text x="30" y="90" font-size="14" font-weight="600" fill="#64748B">特征与结果：</text><text x="30" y="125" font-size="13" fill="#475569">• 试图实现丝滑的液体流动</text><text x="30" y="155" font-size="13" fill="#475569">• 强行推进平滑镜头移动</text><text x="30" y="185" font-size="13" fill="#EF4444" font-weight="600">结果：画面崩解，产生碎片感</text><rect x="30" y="215" width="205" height="28" rx="6" fill="#F1F5F9"/><text x="132" y="233" text-anchor="middle" font-size="12" fill="#64748B">应使用专业视频模型</text></g><g transform="translate(355, 80)"><rect width="265" height="270" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="45" cy="45" r="20" fill="#2563EB" opacity="0.1"/><text x="45" y="52" text-anchor="middle" font-size="16" fill="#2563EB">✓</text><text x="80" y="50" font-size="16" font-weight="700" fill="#1E293B">正确方向：故意不流畅</text><text x="30" y="90" font-size="14" font-weight="600" fill="#2563EB">推荐风格样式：</text><text x="30" y="125" font-size="13" fill="#475569">• 黏土定格（抽帧停顿感）</text><text x="30" y="155" font-size="13" fill="#475569">• 蜡笔涂鸦（逐帧手抖效果）</text><text x="30" y="185" font-size="13" fill="#475569">• 剪纸拼贴 / 老胶片跳帧</text><rect x="30" y="215" width="205" height="28" rx="6" fill="#EFF6FF"/><text x="132" y="233" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">拥抱“笨拙感”独特美学</text></g></svg>