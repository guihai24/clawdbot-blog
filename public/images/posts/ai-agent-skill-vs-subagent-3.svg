<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" style="background:#FAFAFA;">
  <rect width="660" height="400" rx="12" fill="#FAFAFA"/>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000010"/>
    </filter>
  </defs>
  <text x="330" y="30" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#1F2937">Anthropic 电商 Agent 架构</text>
  <text x="330" y="50" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#6B7280">一个主 Agent loop · 无意图路由器 · 无多角色 Agent</text>
  <!-- 主Agent 中心圆 -->
  <circle cx="330" cy="200" r="72" fill="#2563EB" filter="url(#sh)"/>
  <text x="330" y="190" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">主 Agent</text>
  <text x="330" y="208" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#DBEAFE">理解需求 · 拆解步骤</text>
  <text x="330" y="224" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#DBEAFE">决策工具 · 对话控制</text>
  <!-- Skills 层 -->
  <rect x="60" y="100" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#9333EA" stroke-width="2" filter="url(#sh)"/>
  <text x="135" y="120" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#9333EA">📋 Skills</text>
  <text x="135" y="136" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">领域知识 &amp; 流程规则</text>
  <text x="135" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">按需加载进上下文</text>
  <rect x="450" y="100" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="url(#sh)"/>
  <text x="525" y="120" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#EA580C">🛠 工具接口</text>
  <text x="525" y="136" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">API · 内部服务 · UI组件</text>
  <text x="525" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">统一暴露给主 Agent</text>
  <!-- 连线虚线 -->
  <line x1="195" y1="126" x2="252" y2="165" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="465" y1="126" x2="398" y2="165" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- 底部示例卡片 -->
  <rect x="100" y="290" width="130" height="72" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="165" y="310" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#16A34A">推荐套餐 Skill</text>
  <text x="165" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">用户画像 → 习惯</text>
  <text x="165" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">→ 法规 → 推荐策略</text>
  <rect x="265" y="290" width="130" height="72" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="310" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#16A34A">退货规则 Skill</text>
  <text x="330" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">品类退货期 · 运费</text>
  <text x="330" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">拒绝条件</text>
  <rect x="430" y="290" width="130" height="72" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="310" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#16A34A">促销叠加 Skill</text>
  <text x="495" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">券能否叠加</text>
  <text x="495" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6B7280">满减 vs 折扣优先</text>
  <!-- 连线到主Agent -->
  <line x1="165" y1="290" x2="270" y2="250" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="330" y1="290" x2="330" y2="272" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="495" y1="290" x2="390" y2="250" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- 核心收益 -->
  <rect x="210" y="376" width="240" height="0" fill="none"/>
  <text x="330" y="380" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#9CA3AF">核心收益：连续 + 便宜</text>
</svg>