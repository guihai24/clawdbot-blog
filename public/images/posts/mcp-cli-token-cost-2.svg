<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="45" font-size="20" font-weight="bold" text-anchor="middle" fill="#1E293B">Agent 账单中的双重 Token 隐藏成本</text><rect x="40" y="85" width="270" height="250" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="350" y="85" width="270" height="250" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><text x="175" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563EB">1. 工具说明税</text><text x="175" y="150" font-size="13" text-anchor="middle" fill="#64748B">每轮携带工具名称与参数</text><rect x="65" y="180" width="220" height="55" rx="6" fill="#EFF6FF"/><text x="175" y="213" font-size="14" font-weight="600" text-anchor="middle" fill="#2563EB">固定且必要的开销</text><text x="175" y="285" font-size="12" text-anchor="middle" fill="#94A3B8">随工具数量线性增长</text><text x="485" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#EA580C">2. 工具结果税</text><text x="485" y="150" font-size="13" text-anchor="middle" fill="#64748B">未截断的大型 JSON 响应</text><rect x="375" y="180" width="220" height="55" rx="6" fill="#FFF7ED"/><text x="485" y="213" font-size="14" font-weight="600" text-anchor="middle" fill="#EA580C">单次巨大且持续累加</text><text x="485" y="285" font-size="12" text-anchor="middle" fill="#94A3B8">随对话轮次每轮重复消耗</text></g></svg>