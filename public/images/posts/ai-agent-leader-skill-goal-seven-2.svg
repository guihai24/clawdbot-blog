<svg viewBox='0 0 660 400' xmlns='http://www.w3.org/2000/svg'> <rect width='660' height='400' fill='#FAFAFA' rx='12'/> <g font-family='-apple-system, "Segoe UI", sans-serif' font-size='14'> <text x='50' y='30' fill='#1F2937' font-size='18' font-weight='bold'>AI Agent 长程执行流程对比</text> <!-- 左侧：传统模式 --> <rect x='40' y='60' width='270' height='280' fill='white' stroke='#2563EB' stroke-width='2' rx='12' /> <text x='55' y='85' fill='#2563EB' font-weight='bold'>传统开发模式（人在回路）</text> <g transform='translate(60,110)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#EA580C' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#EA580C' /> <text x='15' y='20' fill='#374151'>用户即时反馈</text> </g> <g transform='translate(60,160)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#EA580C' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#EA580C' /> <text x='15' y='20' fill='#374151'>快速修正需求</text> </g> <g transform='translate(60,210)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#EA580C' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#EA580C' /> <text x='15' y='20' fill='#374151'>现场调整优化</text> </g> <!-- 右侧：Agent 模式 --> <rect x='350' y='60' width='270' height='280' fill='white' stroke='#EA580C' stroke-width='2' rx='12' /> <text x='365' y='85' fill='#EA580C' font-weight='bold'>Agent 自主执行（无人干预）</text> <g transform='translate(370,110)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#DC2626' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#DC2626' /> <text x='15' y='20' fill='#374151'>目标模糊输入</text> </g> <g transform='translate(370,160)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#DC2626' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#DC2626' /> <text x='15' y='20' fill='#374151'>自主规划路径</text> </g> <g transform='translate(370,210)'> <line x1='0' y1='0' x2='0' y2='15' stroke='#DC2626' stroke-width='2' stroke-dasharray='4,4' /> <circle cx='0' cy='15' r='4' fill='#DC2626' /> <text x='15' y='20' fill='#374151'>偏离方向无察觉</text> </g> <!-- 底部解决方案 --> <rect x='195' y='310' width='270' height='60' fill='white' stroke='#16A34A' stroke-width='2' rx='12' /> <text x='330' y='345' fill='#16A34A' font-weight='bold' text-anchor='middle'>Goal Engineering: 目标定义 + 约束机制</text> </g></svg>