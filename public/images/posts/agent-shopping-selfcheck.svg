<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10" /></filter></defs><rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="34" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1E293B">Agent 不是「逛」页面，而是逐层「筛」</text><text x="330" y="54" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">七道过滤，任何一道掉队就出局</text><g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle"><rect x="60" y="68" width="540" height="26" rx="13" fill="#2563EB" /><text x="330" y="86">1 · 理解需求</text><rect x="90" y="102" width="480" height="26" rx="13" fill="#3B6FE0" /><text x="330" y="120">2 · 拉候选</text><rect x="120" y="136" width="420" height="26" rx="13" fill="#6D5BD0" /><text x="330" y="154">3 · 抽字段</text><rect x="150" y="170" width="360" height="26" rx="13" fill="#9333EA" /><text x="330" y="188">4 · 过滤</text><rect x="180" y="204" width="300" height="26" rx="13" fill="#B45309" /><text x="330" y="222">5 · 排序</text><rect x="210" y="238" width="240" height="26" rx="13" fill="#EA580C" /><text x="330" y="256">6 · 执行</text><rect x="237.5" y="272" width="185" height="26" rx="13" fill="#DC2626" /><text x="330" y="290">7 · 回报</text></g><rect x="60" y="312" width="540" height="54" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="60" y="312" width="5" height="54" rx="2.5" fill="#DC2626" /><text x="82" y="335" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#DC2626">你不是输在不够好，是输在没进候选集。</text><text x="82" y="354" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">Agent 交给用户的只有三五行的总结——没被写进去，就等于不存在。</text></svg>