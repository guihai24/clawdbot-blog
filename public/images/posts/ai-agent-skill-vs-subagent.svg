<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"><rect width="660" height="400" fill="#FAFAFA" rx="12"/><text x="330" y="32" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#1F2937">拆子智能体架构 vs 真实问题</text><!-- 左侧：典型架构 --><text x="165" y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#374151">典型拆分架构</text><!-- 总控Agent --> <rect x="105" y="88" width="120" height="48" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="165" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2563EB">总控 Agent</text><text x="165" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6B7280">意图识别 + 转发</text><!-- 子智能体 --> <rect x="30" y="160" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/><text x="77" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#16A34A">商品推荐</text><text x="77" y="197" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6B7280">子智能体</text><rect x="135" y="160" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5"/><text x="182" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#EA580C">订单查询</text><text x="182" y="197" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6B7280">子智能体</text><rect x="240" y="160" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/><text x="287" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#9333EA">退换货</text><text x="287" y="197" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6B7280">子智能体</text><rect x="345" y="160" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/><text x="392" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#D97706">促销优惠</text><text x="392" y="197" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6B7280">子智能体</text><!-- 连线 --> <line x1="140" y1="136" x2="77" y2="160" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="165" y1="136" x2="182" y2="160" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="185" y1="136" x2="287" y2="160" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="200" y1="136" x2="392" y2="160" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/><!-- 右侧：问题示意 --><text x="500" y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#374151">真实对话场景</text><!-- 用户对话气泡 --> <rect x="430" y="88" width="140" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="500" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#92400E">「新品有啥？」</text><text x="500" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#92400E">「查下订单」</text><text x="500" y="140" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#92400E">「物流太慢了」</text><text x="500" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#92400E">「下月有啥优惠？」</text><!-- 问题标注 --> <rect x="425" y="178" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/><text x="500" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EF4444">问题一：意图乱炖</text><text x="500" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6B7280">单意图路由难处理</text><!-- 状态同步问题 --> <rect x="425" y="242" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/><text x="500" y="262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EF4444">问题二：状态有损</text><text x="500" y="278" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6B7280">上下文丢失 + Token 浪费</text><!-- 箭头连接 --> <path d="M 280 182 Q 350 182 425 124" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowhead)"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF4444"/></marker></defs><!-- 底部结论 --> <rect x="140" y="330" width="380" height="48" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="330" y="352" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#DC2626">结论：架构图好看，体验与账单都难看</text><text x="330" y="370" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#991B1B">Anthropic 电商场景实测反馈</text></svg>