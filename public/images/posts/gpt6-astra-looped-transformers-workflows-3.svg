<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Astra 时代 AI 工作流重构策略</text><g transform="translate(30, 70)"><rect width="280" height="300" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><path d="M 30 70 L 30 370" stroke="#E2E8F0" stroke-width="1"/><text x="140" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">直迁场景：换模型即起飞</text><text x="140" y="58" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">问题清晰 · 干净环境 · 强反馈</text><rect x="20" y="80" width="240" height="55" rx="6" fill="#EFF6FF"/><text x="35" y="102" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">单文件编码</text><text x="35" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">写脚本、改单模块、生成小工具</text><rect x="20" y="150" width="240" height="55" rx="6" fill="#EFF6FF"/><text x="35" y="172" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">纯文本分析</text><text x="35" y="191" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">情感分析、分类、摘要提取</text><rect x="20" y="220" width="240" height="55" rx="6" fill="#EFF6FF"/><text x="35" y="242" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">数据清洗</text><text x="35" y="261" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">正则抽取、格式转换、拼 JSON</text></g><g transform="translate(350, 70)"><rect width="280" height="300" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5"/><text x="140" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#EA580C" text-anchor="middle">重构场景：少提示 + 多反馈</text><text x="140" y="58" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">长说明剧本 ➔ 结果约束与外部反馈</text><rect x="20" y="80" width="240" height="55" rx="6" fill="#FFF7ED"/><text x="35" y="102" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9A3412">终端自动化脚本</text><text x="35" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">靠终端输出/日志形成循环反馈</text><rect x="20" y="150" width="240" height="55" rx="6" fill="#FFF7ED"/><text x="35" y="172" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9A3412">代码 Agent</text><text x="35" y="191" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">从“教过程”改为“单测/Lint盯结果”</text><rect x="20" y="220" width="240" height="55" rx="6" fill="#FFF7ED"/><text x="35" y="242" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9A3412">桌面/UI 自动化</text><text x="35" y="261" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">GUI接管，用截图+DOM验证结果</text></g><path d="M 318 220 L 342 220" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/></svg>