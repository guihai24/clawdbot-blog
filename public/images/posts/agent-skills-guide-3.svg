<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">项目配置与团队规则分离与校验流程</text><rect x="40" y="60" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="55" y="85" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB">项目配置 (Manifest)</text><text x="55" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">回答“这次操作哪个项目”</text><text x="55" y="130" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">随项目变化，存入 manifest</text><rect x="350" y="60" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="365" y="85" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#9333EA">团队规则 (Rules)</text><text x="365" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">回答“无论哪个项目都要怎么做”</text><text x="365" y="130" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">共享技能，规范统一</text><text x="40" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">稳妥的校验流程：</text><rect x="40" y="200" width="130" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="105" cy="230" r="16" fill="#2563EB" /><text x="105" y="235" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text><text x="105" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">forge-init</text><text x="105" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">读取仓库现状</text><text x="105" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">生成 manifest</text><rect x="190" y="200" width="130" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="255" cy="230" r="16" fill="#D97706" /><text x="255" y="235" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">2</text><text x="255" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">人工检查</text><text x="255" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">检查名称、表结构</text><text x="255" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">与平台配置</text><rect x="340" y="200" width="130" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="405" cy="230" r="16" fill="#EA580C" /><text x="405" y="235" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">3</text><text x="405" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">forge-lint</text><text x="405" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">应用团队规则</text><text x="405" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">标出不一致项</text><rect x="490" y="200" width="130" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="555" cy="230" r="16" fill="#16A34A" /><text x="555" y="235" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">4</text><text x="555" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">确认构建</text><text x="555" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">确认后 manifest</text><text x="555" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">进入后续构建</text></svg>