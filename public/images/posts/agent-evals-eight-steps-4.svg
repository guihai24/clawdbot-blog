<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1F2937">用失败类型做决策：故障地图</text><text x="30" y="72" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#EA580C">观察到的失败</text><text x="630" y="72" text-anchor="end" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2563EB">下一步动作</text><g font-family="-apple-system, 'Segoe UI', sans-serif"><rect x="24" y="84" width="256" height="50" rx="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" /><text x="42" y="109" dominant-baseline="middle" font-size="13.5" fill="#C2410C">简单题也错</text><rect x="380" y="84" width="256" height="50" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" /><text x="398" y="109" dominant-baseline="middle" font-size="12.5" fill="#1D4ED8">检查基础 prompt 与工具描述</text><line x1="288" y1="109" x2="372" y2="109" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 4" /><path d="M372 109 l-7 -4 v8 z" fill="#9CA3AF" /><rect x="24" y="144" width="256" height="50" rx="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" /><text x="42" y="169" dominant-baseline="middle" font-size="13.5" fill="#C2410C">只在多轮后出错</text><rect x="380" y="144" width="256" height="50" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" /><text x="398" y="169" dominant-baseline="middle" font-size="12.5" fill="#1D4ED8">检查上下文压缩与状态更新</text><line x1="288" y1="169" x2="372" y2="169" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 4" /><path d="M372 169 l-7 -4 v8 z" fill="#9CA3AF" /><rect x="24" y="204" width="256" height="50" rx="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" /><text x="42" y="229" dominant-baseline="middle" font-size="13.5" fill="#C2410C">换模型后波动大</text><rect x="380" y="204" width="256" height="50" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" /><text x="398" y="229" dominant-baseline="middle" font-size="12.5" fill="#1D4ED8">固化关键规则，降低模型依赖</text><line x1="288" y1="229" x2="372" y2="229" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 4" /><path d="M372 229 l-7 -4 v8 z" fill="#9CA3AF" /><rect x="24" y="264" width="256" height="50" rx="9" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" /><text x="42" y="289" dominant-baseline="middle" font-size="13.5" fill="#B91C1C">一票否决项出现</text><rect x="380" y="264" width="256" height="50" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" /><text x="398" y="289" dominant-baseline="middle" font-size="12.5" fill="#1D4ED8">暂停发布，先加硬约束或确认</text><line x1="288" y1="289" x2="372" y2="289" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 4" /><path d="M372 289 l-7 -4 v8 z" fill="#9CA3AF" /><rect x="24" y="324" width="256" height="50" rx="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" /><text x="42" y="349" dominant-baseline="middle" font-size="13.5" fill="#C2410C">某类题反复出错</text><rect x="380" y="324" width="256" height="50" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" /><text x="398" y="349" dominant-baseline="middle" font-size="12.5" fill="#1D4ED8">补题归类，改提示词或流程</text><line x1="288" y1="349" x2="372" y2="349" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 4" /><path d="M372 349 l-7 -4 v8 z" fill="#9CA3AF" /></g></svg>