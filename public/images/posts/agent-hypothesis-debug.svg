<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" /></filter><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF" /></marker><marker id="arG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16A34A" /></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Agent 为什么绕圈子：成因与刹车</text><rect x="24" y="58" width="252" height="86" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="24" y="58" width="5" height="86" rx="2.5" fill="#EA580C" /><text x="44" y="86" font-size="14" font-weight="600" fill="#EA580C">① 上下文被冲淡</text><text x="44" y="110" font-size="12" fill="#4B5563">排查越长，前面的关键线索</text><text x="44" y="128" font-size="12" fill="#4B5563">越容易被压缩、被新内容挤掉</text><rect x="24" y="160" width="252" height="86" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="24" y="160" width="5" height="86" rx="2.5" fill="#D97706" /><text x="44" y="188" font-size="14" font-weight="600" fill="#D97706">② 说得通 ≠ 验证过</text><text x="44" y="212" font-size="12" fill="#4B5563">模型擅长生成听起来合理的解释</text><text x="44" y="230" font-size="12" fill="#4B5563">而不是能被证伪的判断</text><path d="M282,100 Q342,100 398,138" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)" /><path d="M282,203 Q342,203 398,166" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)" /><circle cx="478" cy="150" r="74" fill="#F5F3FF" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="6 5" /><text x="478" y="136" text-anchor="middle" font-size="16" font-weight="600" fill="#9333EA">绕圈子</text><text x="478" y="160" text-anchor="middle" font-size="11" fill="#7C3AED">忘了上一轮排除了什么</text><text x="478" y="180" text-anchor="middle" font-size="11" fill="#7C3AED">于是把老路再走一遍</text><path d="M478,228 L478,254" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arG)" /><rect x="24" y="262" width="612" height="114" rx="12" fill="#FFFFFF" filter="url(#sh)" /><rect x="24" y="262" width="5" height="114" rx="2.5" fill="#16A34A" /><text x="48" y="292" font-size="14" font-weight="600" fill="#16A34A">解法：把每条发现写进 MD 文件</text><text x="48" y="316" font-size="12" fill="#4B5563">笔记不在聊天上下文里，不会被冲掉</text><text x="48" y="336" font-size="12" fill="#4B5563">下一轮推理重新读取 → 成为锚点</text><rect x="466" y="284" width="112" height="38" rx="8" fill="#F0FDF4" stroke="#86EFAC" /><text x="522" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">锚点 · 刹车</text><text x="48" y="358" font-size="11" fill="#6B7280">笔记不是产出，是刹车</text></svg>