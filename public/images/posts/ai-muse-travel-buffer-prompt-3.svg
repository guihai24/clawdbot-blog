<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1F2937">Muse 跨地会议智能处理流程</text><g transform="translate(40, 75)"><rect x="0" y="50" width="160" height="210" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><circle cx="80" cy="90" r="24" fill="#EFF6FF"/><text x="80" y="97" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB">1</text><text x="80" y="145" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1F2937">自动判断通勤</text><text x="80" y="175" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">检测真实地址</text><text x="80" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">识别跨地会议</text></g><g transform="translate(250, 75)"><rect x="0" y="50" width="160" height="210" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><circle cx="80" cy="90" r="24" fill="#FFF7ED"/><text x="80" y="97" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#EA580C">2</text><text x="80" y="145" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1F2937">计算 ETA 缓冲</text><text x="80" y="175" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">调用地图 API</text><text x="80" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">自动添加缓冲块</text></g><g transform="translate(460, 75)"><rect x="0" y="50" width="160" height="210" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><circle cx="80" cy="90" r="24" fill="#F0FDF4"/><text x="80" y="97" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#16A34A">3</text><text x="80" y="145" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1F2937">生成日历事件</text><text x="80" y="175" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">统一标题 Travel</text><text x="80" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">写入预计时间</text></g><line x1="200" y1="180" x2="250" y2="180" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4"/><line x1="410" y1="180" x2="460" y2="180" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4"/><text x="330" y="335" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#9CA3AF">整个过程在几秒内自动完成</text></svg>