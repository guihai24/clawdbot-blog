<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">编码 Agent 经验积累与成本变化趋势</text><rect x="60" y="80" width="540" height="260" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><g transform="translate(80, 100)"><line x1="0" y1="200" x2="500" y2="200" stroke="#CBD5E1" stroke-width="2" /><line x1="0" y1="0" x2="0" y2="200" stroke="#CBD5E1" stroke-width="2" /><text x="250" y="230" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B" text-anchor="middle">任务执行次数 (随时间推移)</text><text x="-30" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B" text-anchor="middle" transform="rotate(-90, -30, 100)">任务成本</text><path d="M 0,40 Q 120,70 250,130 T 500,160" fill="none" stroke="#2563EB" stroke-width="4" /><path d="M 0,30 L 500,180" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" /><circle cx="0" cy="40" r="6" fill="#EA580C" /><circle cx="250" cy="130" r="6" fill="#EA580C" /><circle cx="500" cy="160" r="6" fill="#16A34A" /><text x="20" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#EA580C" font-weight="bold">早期：需学习与验证，成本较高</text><text x="320" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9.72" fill="#16A34A" font-weight="bold">后期：经验积累，成本显著下降 (-18%~31%)</text><text x="380" y="195" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">默认基准水平</text></g></svg>