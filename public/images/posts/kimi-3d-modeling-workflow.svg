<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');text { font-family: 'Noto Sans SC', -apple-system, sans-serif; }</style><filter id='shadow' x='-5%' y='-5%' width='110%' height='110%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000000' flood-opacity='0.06'/></filter></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-size='20' font-weight='700' fill='#1F2937' text-anchor='middle'>3D 创作的两条路线：参数化 vs 网格化</text><g transform='translate(40, 80)'><rect width='270' height='275' rx='10' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='270' height='8' rx='4' fill='#2563EB'/><text x='135' y='40' font-size='18' font-weight='700' fill='#2563EB' text-anchor='middle'>参数化建模</text><text x='135' y='65' font-size='12' fill='#6B7280' text-anchor='middle'>AI 交付配方（代码/参数）</text><line x1='20' y1='85' x2='250' y2='85' stroke='#F3F4F6' stroke-width='2'/><g transform='translate(25, 105)'><circle cx='12' cy='10' r='6' fill='#DBEAFE'/><text x='12' y='14' font-size='10' font-weight='700' fill='#2563EB' text-anchor='middle'>✓</text><text x='30' y='14' font-size='13' fill='#374151'><tspan font-weight='500'>改尺寸：</tspan>改数值，整体联动</text><circle cx='12' cy='50' r='6' fill='#DBEAFE'/><text x='12' y='54' font-size='10' font-weight='700' fill='#2563EB' text-anchor='middle'>✓</text><text x='30' y='54' font-size='13' fill='#374151'><tspan font-weight='500'>尺寸精度：</tspan>毫米级可控</text><circle cx='12' cy='90' r='6' fill='#DBEAFE'/><text x='12' y='94' font-size='10' font-weight='700' fill='#2563EB' text-anchor='middle'>✓</text><text x='30' y='94' font-size='13' fill='#374151'><tspan font-weight='500'>下游应用：</tspan>3D 打印、建筑构件</text><rect x='10' y='125' width='230' height='28' rx='6' fill='#EFF6FF'/><text x='125' y='143' font-size='11' font-weight='500' fill='#2563EB' text-anchor='middle'>核心优势：可改性强，适应变体</text></g></g><g transform='translate(350, 80)'><rect width='270' height='275' rx='10' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='270' height='8' rx='4' fill='#EA580C'/><text x='135' y='40' font-size='18' font-weight='700' fill='#EA580C' text-anchor='middle'>网格化建模</text><text x='135' y='65' font-size='12' fill='#6B7280' text-anchor='middle'>AI 交付固定网格（面片）</text><line x1='20' y1='85' x2='250' y2='85' stroke='#F3F4F6' stroke-width='2'/><g transform='translate(25, 105)'><circle cx='12' cy='10' r='6' fill='#FFEDD5'/><text x='12' y='14' font-size='10' font-weight='700' fill='#EA580C' text-anchor='middle'>✕</text><text x='30' y='14' font-size='13' fill='#374151'><tspan font-weight='500'>改尺寸：</tspan>需重生成或手动推</text><circle cx='12' cy='50' r='6' fill='#FFEDD5'/><text x='12' y='54' font-size='10' font-weight='700' fill='#EA580C' text-anchor='middle'>~</text><text x='30' y='54' font-size='13' fill='#374151'><tspan font-weight='500'>尺寸精度：</tspan>大致像，靠眼估</text><circle cx='12' cy='90' r='6' fill='#FFEDD5'/><text x='12' y='94' font-size='10' font-weight='700' fill='#EA580C' text-anchor='middle'>✓</text><text x='30' y='94' font-size='13' fill='#374151'><tspan font-weight='500'>下游应用：</tspan>场景摆件、游戏道具</text><rect x='10' y='125' width='230' height='28' rx='6' fill='#FFF7ED'/><text x='125' y='143' font-size='11' font-weight='500' fill='#EA580C' text-anchor='middle'>核心劣势：定型难改，需手动修</text></g></g></svg>