<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="40" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1E293B">轻量验证产品需求的五步法</text><g transform="translate(40, 70)"><rect x="0" y="0" width="104" height="220" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="104" height="6" rx="3" fill="#2563EB"/><text x="12" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2563EB">步骤 1</text><text x="12" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">用现成工具</text><text x="12" y="73" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">生成首批</text><text x="12" y="91" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">成品壁纸</text><line x1="116" y1="110" x2="130" y2="110" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/></g><g transform="translate(170, 70)"><rect x="0" y="0" width="104" height="220" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="104" height="6" rx="3" fill="#EA580C"/><text x="12" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#EA580C">步骤 2</text><text x="12" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">发布到小红</text><text x="12" y="73" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">书、抖音等</text><text x="12" y="91" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">目标平台</text><line x1="116" y1="110" x2="130" y2="110" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/></g><g transform="translate(300, 70)"><rect x="0" y="0" width="104" height="220" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="104" height="6" rx="3" fill="#16A34A"/><text x="12" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#16A34A">步骤 3</text><text x="12" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">加上话题标</text><text x="12" y="73" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">签，形成可</text><text x="12" y="91" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">浏览内容列</text><line x1="116" y1="110" x2="130" y2="110" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/></g><g transform="translate(430, 70)"><rect x="0" y="0" width="104" height="220" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="104" height="6" rx="3" fill="#9333EA"/><text x="12" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#9333EA">步骤 4</text><text x="12" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">在评论区中</text><text x="12" y="73" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">收集用户主</text><text x="12" y="91" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">动提出需求</text><line x1="116" y1="110" x2="130" y2="110" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/></g><g transform="translate(560, 70)"><rect x="0" y="0" width="60" height="220" rx="8" fill="#F59E0B" filter="url(#shadow)"/><text x="12" y="55" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">步骤</text><text x="12" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">5</text><text x="12" y="110" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" writing-mode="vertical-lr">筛选重复需求</text></g><g transform="translate(40, 315)"><rect x="0" y="0" width="580" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="20" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#D97706">核心判断标准：</text><text x="120" y="30" font-family="-apple-system, sans-serif" font-size="13" fill="#78350F">高频出现的真实痛点（如 6/10 次询问）才进入开发队列，避免盲目堆砌功能。</text></g></svg>