<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-family='-apple-system, Segoe UI, sans-serif' font-size='20' font-weight='bold' fill='#1F2937' text-anchor='middle'>为什么“零外部依赖”是小工具开发的王牌？</text><rect x='40' y='75' width='270' height='290' rx='8' fill='#FFFFFF' stroke='#E5E7EB' stroke-width='1'/><rect x='40' y='75' width='270' height='45' rx='8' fill='#FEE2E2'/><text x='175' y='103' font-family='-apple-system, Segoe UI, sans-serif' font-size='14' font-weight='bold' fill='#DC2626' text-anchor='middle'>传统重度依赖开发</text><text x='65' y='145' font-size='13' fill='#4B5563'>• 引入 React / Tailwind 等</text><text x='65' y='175' font-size='13' fill='#4B5563'>• 依赖冲突、版本报错</text><text x='65' y='205' font-size='13' fill='#4B5563'>• 配环境耗时、维护成本高</text><text x='65' y='235' font-size='13' fill='#4B5563'>• 框架抽象层阻碍定制</text><rect x='350' y='75' width='270' height='290' rx='8' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><rect x='350' y='75' width='270' height='45' rx='8' fill='#DBEAFE'/><text x='485' y='103' font-family='-apple-system, Segoe UI, sans-serif' font-size='14' font-weight='bold' fill='#2563EB' text-anchor='middle'>零外部依赖 (原生 Canvas)</text><text x='375' y='145' font-size='13' fill='#1F2937' font-weight='bold'>1. 秒级交付</text><text x='390' y='168' font-size='12' fill='#6B7280'>单文件HTML，开箱即用</text><text x='375' y='205' font-size='13' fill='#1F2937' font-weight='bold'>2. 零维护成本</text><text x='390' y='228' font-size='12' fill='#6B7280'>无NPM包更新与安全漏洞</text><text x='375' y='265' font-size='13' fill='#1F2937' font-weight='bold'>3. 极佳定制性</text><text x='390' y='288' font-size='12' fill='#6B7280'>压榨浏览器性能，直接改JS</text></svg>