<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="660" height="400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">Claude Fable 5.2 成本悖论与选型策略</text><g transform="translate(30, 70)"><rect width="285" height="290" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="20" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#EA580C">单价下降 vs 实际成本上升</text><rect x="20" y="55" width="245" height="90" rx="6" fill="#FFF7ED" /><text x="35" y="80" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#9A3412">单价下降 20%</text><text x="35" y="105" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#9A3412">输入 $8 / 输出 $40 每百万 Token</text><rect x="20" y="155" width="245" height="110" rx="6" fill="#FEF2F2" /><text x="35" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#991B1B">实际成本: $67.16 ➔ $88.15</text><text x="35" y="205" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#7F1D1D">原因：生成大量测试用例、</text><text x="35" y="225" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#7F1D1D">子智能体反复自查，输出激增</text></g><g transform="translate(345, 70)"><rect width="285" height="290" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="20" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB">省钱关键：按任务难度选型</text><g transform="translate(20, 55)"><rect width="245" height="65" rx="6" fill="#EFF6FF" /><text x="15" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">简单任务</text><text x="15" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1E3A8A">使用小模型或 low 推理档位</text></g><g transform="translate(20, 130)"><rect width="245" height="65" rx="6" fill="#F0FDF4" /><text x="15" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#166534">复杂编码</text><text x="15" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#14532D">使用 Fable 的 high 档（性价比高）</text></g><g transform="translate(20, 205)"><rect width="245" height="60" rx="6" fill="#FAF5FF" /><text x="15" y="23" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#6B21A8">极复杂/避免区</text><text x="15" y="42" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#581C87">避免使用成本几乎不设上限的 max 档</text></g></g></svg>