<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"><rect width="660" height="400" fill="#FAFAFA" rx="12"/><text x="330" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#1F2937">DistilBERT LoRA 微调流程</text><g transform="translate(60, 70)"><rect x="0" y="0" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="60" y="28" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2563EB">1. 加载模型</text><text x="60" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">Tokenizer + DistilBERT</text></g><g transform="translate(220, 70)"><rect x="0" y="0" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="60" y="28" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#EA580C">2. 配置 LoRA</text><text x="60" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">r=16, alpha=32</text></g><g transform="translate(380, 70)"><rect x="0" y="0" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="60" y="28" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#16A34A">3. PEFT 包装</text><text x="60" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">LoRA 适配器</text></g><g transform="translate(540, 70)"><rect x="0" y="0" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#9333EA" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="30" y="28" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#9333EA">4.</text><text x="30" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">训练</text></g><line x1="180" y1="100" x2="215" y2="100" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/><line x1="340" y1="100" x2="375" y2="100" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/><line x1="500" y1="100" x2="535" y2="100" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/><polygon points="215,95 225,100 215,105" fill="#9CA3AF"/><polygon points="375,95 385,100 375,105" fill="#9CA3AF"/><polygon points="535,95 545,100 535,105" fill="#9CA3AF"/><g transform="translate(150, 160)"><rect x="0" y="0" width="360" height="50" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="180" y="22" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#D97706">Trainer + EarlyStopping + DataCollatorWithPadding</text><text x="180" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">训练配置</text></g><line x1="330" y1="130" x2="330" y2="158" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/><polygon points="325,158 330,168 335,158" fill="#D97706"/><g transform="translate(60, 240)"><rect x="0" y="0" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="130" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1F2937">生产级部署</text><line x1="20" y1="40" x2="240" y2="40" stroke="#F3F4F6" stroke-width="1"/><text x="20" y="62" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 轻量级 LoRA 适配器</text><text x="20" y="82" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 快速推理延迟</text><text x="20" y="102" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 情感分析准确率提升</text></g><g transform="translate(340, 240)"><rect x="0" y="0" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/><text x="130" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1F2937">对比 TF-IDF 基线</text><line x1="20" y1="40" x2="240" y2="40" stroke="#F3F4F6" stroke-width="1"/><text x="20" y="62" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 上下文语义理解</text><text x="20" y="82" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 无需手动特征工程</text><text x="20" y="102" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">✓ 迁移学习高效微调</text></g><line x1="330" y1="210" x2="330" y2="238" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/><polygon points="325,238 330,248 335,238" fill="#9CA3AF"/><line x1="190" y1="300" x2="330" y2="300" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="470" y1="300" x2="610" y2="300" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4"/></svg>