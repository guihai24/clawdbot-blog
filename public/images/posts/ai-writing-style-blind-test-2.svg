<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />
  <text x="30" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A">旧文盲测法：五步流程</text>
  <text x="30" y="58" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">用旧文调出写作 skill，再用封存样本验收</text>

  <line x1="52" y1="112" x2="52" y2="126" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="52" y1="176" x2="52" y2="190" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="52" y1="240" x2="52" y2="254" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="52" y1="304" x2="52" y2="318" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />

  <g>
    <rect x="30" y="62" width="600" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
    <circle cx="52" cy="87" r="14" fill="#2563EB" />
    <text x="52" y="92" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="78" y="83" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F172A">抽样：12–25 篇旧文</text>
    <text x="78" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">同一种文体；随机留 3–5 篇做封存样本，中途不给模型看</text>
  </g>

  <g>
    <rect x="30" y="126" width="600" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
    <circle cx="52" cy="151" r="14" fill="#EA580C" />
    <text x="52" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="78" y="147" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F172A">压成事实 brief</text>
    <text x="78" y="164" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">只留观点、事实、数据，不保留原句措辞与金句，防止抄句子</text>
  </g>

  <g>
    <rect x="30" y="190" width="600" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
    <circle cx="52" cy="215" r="14" fill="#16A34A" />
    <text x="52" y="220" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="78" y="211" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F172A">两版草稿 + 盲测</text>
    <text x="78" y="228" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">同一 brief 生成 A/B，裁判选「更像原文」并交换顺序复核</text>
  </g>

  <g>
    <rect x="30" y="254" width="600" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
    <circle cx="52" cy="279" r="14" fill="#9333EA" />
    <text x="52" y="284" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
    <text x="78" y="275" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F172A">把胜负写成规则</text>
    <text x="78" y="292" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">裁判原因翻译成具体句式规则，每次只改一类问题</text>
  </g>

  <g>
    <rect x="30" y="318" width="600" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
    <circle cx="52" cy="343" r="14" fill="#D97706" />
    <text x="52" y="348" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
    <text x="78" y="339" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F172A">封存样本期末考</text>
    <text x="78" y="356" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748B">训练赢、封存输 = 背题型选手；机器做初筛，人做终审</text>
  </g>
</svg>