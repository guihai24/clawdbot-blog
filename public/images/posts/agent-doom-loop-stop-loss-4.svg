<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">不换框架：AI Agent 四层防御体系</text><g transform="translate(30, 60)"><rect x="0" y="0" width="135" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="15" y="15" width="105" height="28" rx="4" fill="#EFF6FF" /><text x="67.5" y="34" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#2563EB">第一层：工具指纹</text><text x="25" y="65" font-size="11" fill="#4B5563">• 工具层拦截</text><text x="25" y="90" font-size="11" fill="#4B5563">• 参数归一化</text><text x="25" y="115" font-size="11" fill="#4B5563">• 阶梯式阈值</text><text x="25" y="150" font-size="10" fill="#9CA3AF">(observe: 2)</text><text x="25" y="170" font-size="10" fill="#9CA3AF">(block: 3)</text><text x="25" y="190" font-size="10" fill="#9CA3AF">(stop: 6)</text><rect x="15" y="225" width="105" height="40" rx="4" fill="#FEF2F2" /><text x="67.5" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">让任务正常结束</text><text x="67.5" y="257" text-anchor="middle" font-size="9" fill="#991B1B">失败但你能知道</text></g><g transform="translate(185, 60)"><rect x="0" y="0" width="135" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="15" y="15" width="105" height="28" rx="4" fill="#F0FDF4" /><text x="67.5" y="34" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#16A34A">第二层：语义映射</text><text x="25" y="65" font-size="11" fill="#4B5563">• 防御换马甲试错</text><text x="25" y="90" font-size="11" fill="#4B5563">• 提取身份字段</text><text x="25" y="115" font-size="11" fill="#4B5563">• 清洗空格与格式</text><text x="25" y="150" font-size="10" fill="#6B7280">例：INV-2291</text><text x="25" y="170" font-size="10" fill="#6B7280">与 inv2291</text><text x="25" y="190" font-size="10" fill="#16A34A">归一化为同一样</text><rect x="15" y="225" width="105" height="40" rx="4" fill="#FEF2F2" /><text x="67.5" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">节省无效调用</text><text x="67.5" y="257" text-anchor="middle" font-size="9" fill="#991B1B">大幅降低Token开销</text></g><g transform="translate(340, 60)"><rect x="0" y="0" width="135" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="15" y="15" width="105" height="28" rx="4" fill="#FAF5FF" /><text x="67.5" y="34" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#9333EA">第三层：双重上限</text><text x="25" y="65" font-size="11" fill="#4B5563">• 循环层控制</text><text x="25" y="90" font-size="11" fill="#4B5563">• 步数卡点 (Steps)</text><text x="25" y="115" font-size="11" fill="#4B5563">• 费用卡点 (Cost)</text><text x="25" y="150" font-size="10" fill="#6B7280">MAX_STEPS: 30</text><text x="25" y="170" font-size="10" fill="#6B7280">MAX_COST: $0.5</text><rect x="15" y="225" width="105" height="40" rx="4" fill="#FEF2F2" /><text x="67.5" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">双剑合璧兜底</text><text x="67.5" y="257" text-anchor="middle" font-size="9" fill="#991B1B">避免死循环烧钱</text></g><g transform="translate(495, 60)"><rect x="0" y="0" width="135" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="15" y="15" width="105" height="28" rx="4" fill="#FFFBEB" /><text x="67.5" y="34" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#D97706">第四层：账户封顶</text><text x="25" y="65" font-size="11" fill="#4B5563">• 账户层保护</text><text x="25" y="90" font-size="11" fill="#4B5563">• API 密钥额度</text><text x="25" y="115" font-size="11" fill="#4B5563">• 供应商端 402</text><text x="25" y="150" font-size="10" fill="#D97706">代码失效时的</text><text x="25" y="170" font-size="10" fill="#D97706">最后安全网</text><rect x="15" y="225" width="105" height="40" rx="4" fill="#FEF2F2" /><text x="67.5" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">救你的信用卡</text><text x="67.5" y="257" text-anchor="middle" font-size="9" fill="#991B1B">防止深夜无限扣款</text></g><path d="M 10 355 L 650 355" stroke="#D1D5DB" stroke-dasharray="4 4" stroke-width="1.5" /><text x="330" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280">防御成本：越靠前越便宜 (左)  ──►  越靠后越保命 (右)</text></svg>