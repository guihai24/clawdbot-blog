<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" style="background: #FAFAFA; border-radius: 12px;"><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g transform="translate(30, 20)"><rect x="0" y="0" width="600" height="48" rx="8" fill="#2563EB" opacity="0.1" /><rect x="0" y="0" width="600" height="48" rx="8" fill="none" stroke="#2563EB" stroke-width="1.5" /><text x="300" y="29" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="bold">AGENTS.md 说明文件裁剪与保留决策</text></g><g transform="translate(50, 95)"><rect x="0" y="0" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5" opacity="0.9" stroke-dasharray="4 4" /><rect x="12" y="-12" width="90" height="24" rx="4" fill="#EA580C" /><text x="57" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">建议归档 / 删</text><text x="20" y="36" fill="#1F2937" font-size="13" font-weight="bold">1. 步骤代写型</text><text x="32" y="56" fill="#6B7280" font-size="11">例：先读完所有文件，再总结...</text><text x="20" y="81" fill="#1F2937" font-size="13" font-weight="bold">2. 推理模板型</text><text x="32" y="101" fill="#6B7280" font-size="11">例：必须先列出假设，再逐步...</text></g><g transform="translate(360, 95)"><rect x="0" y="0" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" opacity="0.9" /><rect x="12" y="-12" width="90" height="24" rx="4" fill="#16A34A" /><text x="57" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">必须保留</text><text x="20" y="36" fill="#1F2937" font-size="13" font-weight="bold">1. 环境约束型 (安全边界)</text><text x="32" y="56" fill="#6B7280" font-size="11">例：不要访问外网，仅用本地代码</text><text x="20" y="81" fill="#1F2937" font-size="13" font-weight="bold">2. 业务规则型 (对齐要求)</text><text x="32" y="101" fill="#6B7280" font-size="11">例：退款金额不能超过原订单</text></g><path d="M 330 155 L 330 250" stroke="#9333EA" stroke-width="2" stroke-dasharray="4 4" fill="none" /><g transform="translate(180, 250)"><rect x="0" y="0" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" /><rect x="100" y="-12" width="100" height="24" rx="4" fill="#9333EA" /><text x="150" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">极致裁剪自测</text><text x="150" y="38" text-anchor="middle" fill="#1F2937" font-size="13" font-weight="bold">仅保留：身份 + 目标 + 边界</text><text x="150" y="63" text-anchor="middle" fill="#4B5563" font-size="12">在 GPT-6 上连续运行 5 次测试</text><text x="150" y="88" text-anchor="middle" fill="#D97706" font-size="11" font-weight="bold">效果更好或持平 → 立即归档原复杂提示词</text></g></svg>