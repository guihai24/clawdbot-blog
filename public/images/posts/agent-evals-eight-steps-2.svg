<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" /></filter></defs><rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" /><text x="40" y="38" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#111827">Agent 评测的三个层级</text><rect x="40" y="62" width="580" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#sh)" /><rect x="54" y="80" width="92" height="44" rx="9" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><text x="100" y="107" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2563EB">问答</text><text x="164" y="92" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">主要评什么</text><text x="164" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#374151">答案事实是否正确、格式是否合规</text><text x="392" y="92" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">常见坑</text><text x="392" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#6B7280">只看最终文本，忽略依据</text><rect x="40" y="152" width="580" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#sh)" /><rect x="54" y="170" width="92" height="44" rx="9" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" /><text x="100" y="197" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#EA580C">单 Agent</text><text x="164" y="182" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">主要评什么</text><text x="164" y="204" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#374151">工具调用、状态管理、多轮决策</text><text x="392" y="182" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">常见坑</text><text x="392" y="204" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#6B7280">中间错一步，最后碰巧蒙对</text><rect x="40" y="242" width="580" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#sh)" /><rect x="54" y="260" width="92" height="44" rx="9" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" /><text x="100" y="287" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#9333EA">多 Agent</text><text x="164" y="272" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">主要评什么</text><text x="164" y="294" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#374151">分工、交接、汇总、冲突处理</text><text x="392" y="272" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">常见坑</text><text x="392" y="294" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#6B7280">成员各自很忙，整体没人收口</text><rect x="40" y="332" width="580" height="48" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" /><text x="330" y="361" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#C2410C">最贵的错误不一定最难：权限边界的错调要单独标出评测</text></svg>