<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="330" y="42" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1E293B">局部信号 ≠ 最终证明</text>

  <text x="28" y="72" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#16A34A">Agent 的局部信号</text>
  <text x="360" y="72" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#EA580C">用户可见的结果</text>

  <rect x="28" y="88" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="48" cy="104" r="5" fill="#16A34A" />
  <text x="66" y="109" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">测试套件全部通过</text>

  <rect x="28" y="128" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="48" cy="144" r="5" fill="#16A34A" />
  <text x="66" y="149" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">构建与 lint 无报错</text>

  <rect x="28" y="168" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="48" cy="184" r="5" fill="#16A34A" />
  <text x="66" y="189" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">命令执行完成</text>

  <rect x="28" y="208" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="48" cy="224" r="5" fill="#16A34A" />
  <text x="66" y="229" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">回复写得很完整</text>

  <rect x="360" y="88" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="380" cy="104" r="5" fill="#EA580C" />
  <text x="398" y="109" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">页面依然打不开</text>

  <rect x="360" y="128" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="380" cy="144" r="5" fill="#EA580C" />
  <text x="398" y="149" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">登录态、权限失效</text>

  <rect x="360" y="168" width="272" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <circle cx="380" cy="184" r="5" fill="#EA580C" />
  <text x="398" y="189" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#334155">第三方回调没返回</text>

  <line x1="330" y1="80" x2="330" y2="150" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="330" y1="200" x2="330" y2="252" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="330" cy="175" r="19" fill="#FAFAFA" />
  <text x="330" y="184" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#EA580C">≠</text>

  <rect x="28" y="272" width="604" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
  <rect x="28" y="290" width="5" height="64" rx="2.5" fill="#EA580C" />
  <text x="52" y="300" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">结论</text>
  <text x="52" y="325" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1E293B">别只问「它跑了哪些验证」</text>
  <text x="52" y="352" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#EA580C">要问「这些验证覆盖了用户看到的哪一段」</text>
</svg>