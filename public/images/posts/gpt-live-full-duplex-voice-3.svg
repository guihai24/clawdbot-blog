<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" style="background:#FAFAFA;font-family:-apple-system,'Segoe UI',sans-serif;border-radius:12px;">
  <!-- 标题 -->
  <text x="330" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2937">语音 AI 架构设计原则</text>
  
  <!-- 左侧：三个原则卡片 -->
  <rect x="20" y="60" width="180" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <circle cx="45" cy="88" r="14" fill="#2563EB"/>
  <text x="45" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="white">1</text>
  <text x="68" y="85" font-size="13" font-weight="600" fill="#1F2937">媒体流连续</text>
  <text x="68" y="103" font-size="11" fill="#6B7280">无停顿·自然回应</text>
  <text x="68" y="120" font-size="11" fill="#6B7280">嗯嗯/确认词/边听边说</text>
  
  <rect x="20" y="160" width="180" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <circle cx="45" cy="188" r="14" fill="#EA580C"/>
  <text x="45" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="white">2</text>
  <text x="68" y="185" font-size="13" font-weight="600" fill="#1F2937">模型判断时机</text>
  <text x="68" y="203" font-size="11" fill="#6B7280">全双工·语调语义驱动</text>
  <text x="68" y="220" font-size="11" fill="#6B7280">替代脆弱转场检测器</text>
  
  <rect x="20" y="260" width="180" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <circle cx="45" cy="288" r="14" fill="#16A34A"/>
  <text x="45" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="white">3</text>
  <text x="68" y="285" font-size="13" font-weight="600" fill="#1F2937">路径分离</text>
  <text x="68" y="303" font-size="11" fill="#6B7280">媒体流走快路径</text>
  <text x="68" y="320" font-size="11" fill="#6B7280">复杂逻辑走异步路径</text>
  
  <!-- 右侧：架构示意图 -->
  <rect x="230" y="60" width="410" height="280" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <text x="435" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">实时 / 非实时路径分离架构</text>
  
  <!-- 用户 -->
  <rect x="260" y="110" width="80" height="44" rx="8" fill="#EEF2FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">用户</text>
  <text x="300" y="146" text-anchor="middle" font-size="10" fill="#6B7280">说话/倾听</text>
  
  <!-- 快速路径 -->
  <rect x="380" y="100" width="100" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="430" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">快速路径</text>
  <text x="430" y="136" text-anchor="middle" font-size="10" fill="#6B7280">媒体流</text>
  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#6B7280">低延迟</text>
  
  <!-- 慢速路径 -->
  <rect x="510" y="100" width="100" height="60" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="560" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#9333EA">异步路径</text>
  <text x="560" y="136" text-anchor="middle" font-size="10" fill="#6B7280">复杂逻辑</text>
  <text x="560" y="150" text-anchor="middle" font-size="10" fill="#6B7280">高可用</text>
  
  <!-- 连线：用户到快速路径 -->
  <line x1="340" y1="132" x2="380" y2="132" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="380,128 388,132 380,136" fill="#16A34A"/>
  <text x="360" y="125" font-size="9" fill="#16A34A">音频流</text>
  
  <!-- 连线：用户到异步路径 -->
  <line x1="340" y1="132" x2="510" y2="130" stroke="#9333EA" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="430" y="120" font-size="9" fill="#9333EA">请求</text>
  
  <!-- 连线：快速路径到异步路径 -->
  <line x1="480" y1="130" x2="510" y2="130" stroke="#D97706" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="510,126 518,130 510,134" fill="#D97706"/>
  <text x="495" y="122" font-size="9" fill="#D97706">协调</text>
  
  <!-- 返回路径 -->
  <line x1="380" y1="145" x2="300" y2="170" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="305,166 298,174 308,172" fill="#16A34A"/>
  <text x="320" y="160" font-size="9" fill="#16A34A">回应</text>
  
  <!-- 底部说明 -->
  <rect x="260" y="200" width="350" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="435" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">关键：即使后端抖动，媒体流不中断</text>
  <text x="435" y="238" text-anchor="middle" font-size="10" fill="#A16207">用户始终听到连续音频，体验不受影响</text>
  
  <!-- 底部标注 -->
  <text x="435" y="290" text-anchor="middle" font-size="10" fill="#9CA3AF">参考 GPT-Live 架构模式</text>
</svg>