<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">AI 电脑操作：从「代码自动化」到「视觉闭环」</text><g transform="translate(40, 80)"><rect x="0" y="40" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" /><text x="50" y="75" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">观察屏幕</text><text x="50" y="95" font-size="12" fill="#64748B" text-anchor="middle">读取当前画面</text><path d="M 100 80 L 130 80" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" /><polygon points="130,76 138,80 130,84" fill="#94A3B8" /></g><g transform="translate(180, 80)"><rect x="0" y="40" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" /><text x="50" y="75" font-size="14" font-weight="bold" fill="#EA580C" text-anchor="middle">判断下一步</text><text x="50" y="95" font-size="12" fill="#64748B" text-anchor="middle">规划操作动作</text><path d="M 100 80 L 130 80" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" /><polygon points="130,76 138,80 130,84" fill="#94A3B8" /></g><g transform="translate(320, 80)"><rect x="0" y="40" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" /><text x="50" y="75" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">操作鼠标</text><text x="50" y="95" font-size="12" fill="#64748B" text-anchor="middle">模拟点击拖拽</text><path d="M 100 80 L 130 80" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" /><polygon points="130,76 138,80 130,84" fill="#94A3B8" /></g><g transform="translate(460, 80)"><rect x="0" y="40" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" /><text x="50" y="75" font-size="14" font-weight="bold" fill="#9333EA" text-anchor="middle">修正动作</text><text x="50" y="95" font-size="12" fill="#64748B" text-anchor="middle">边做边试调优</text></g><path d="M 510 160 C 510 210, 150 210, 90 160" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6" /><polygon points="90,165 82,157 93,153" fill="#D97706" /><text x="300" y="215" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">形成完整闭环：无限迭代至目标达成</text><g transform="translate(40, 260"><rect x="0" y="0" width="580" height="90" rx="8" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" /><text x="30" y="30" font-size="14" font-weight="bold" fill="#1E40AF">核心突破点：</text><text x="30" y="55" font-size="13" fill="#334155">1. 无需软件开放 API，纯靠界面模拟点击就能接管复杂流程。</text><text x="30" y="75" font-size="13" fill="#334155">2. 过程完全可视化，支持人类随时介入与随时接管。</text></g></svg>