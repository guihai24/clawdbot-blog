<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="40" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">uv.lock 删还是留？项目类型决策指南</text><rect x="40" y="70" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><path d="M 40 70 h 170 v 40 h -170 z" fill="#EFF6FF" rx="8"/><text x="125" y="95" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">应用 / 脚本服务</text><text x="55" y="140" font-size="12" fill="#64748B">• 锁文件已提交</text><text x="55" y="170" font-size="12" fill="#16A34A" font-weight="bold">→ 可以删</text><text x="55" y="200" font-size="12" fill="#64748B">重新生成即可</text><text x="55" y="240" font-size="11" fill="#94A3B8">适合本地调试、</text><text x="55" y="260" font-size="11" fill="#94A3B8">解决诡异依赖报错</text><rect x="245" y="70" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><path d="M 245 70 h 170 v 40 h -170 z" fill="#FEF2F2" rx="8"/><text x="330" y="95" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">开源库项目</text><text x="260" y="140" font-size="12" fill="#64748B">• 不该有锁文件</text><text x="260" y="170" font-size="12" fill="#DC2626" font-weight="bold">→ 别碰/直接删</text><text x="260" y="200" font-size="12" fill="#64748B">建议加进 .gitignore</text><text x="260" y="240" font-size="11" fill="#94A3B8">库不替下游锁版本，</text><text x="260" y="260" font-size="11" fill="#94A3B8">避免限制使用方环境</text><rect x="450" y="70" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><path d="M 450 70 h 170 v 40 h -170 z" fill="#FEFCE8" rx="8"/><text x="535" y="95" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">团队 / CI 项目</text><text x="465" y="140" font-size="12" fill="#64748B">• 团队环境契约</text><text x="465" y="170" font-size="12" fill="#D97706" font-weight="bold">→ 谨慎删除</text><text x="465" y="200" font-size="12" fill="#64748B">必须同步给全队</text><text x="465" y="240" font-size="11" fill="#94A3B8">防止静默更新依赖，</text><text x="465" y="260" font-size="11" fill="#94A3B8">引发队友环境 Bug</text></svg>