<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="30" y="34" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#111827">浏览器 Agent 的三层权限边界</text>
  <text x="630" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9CA3AF">风险由低到高</text>

  
  <rect x="30" y="56" width="600" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)" />
  <circle cx="62" cy="86" r="15" fill="#16A34A" />
  <text x="62" y="91" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="90" y="79" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#16A34A">只读浏览</text>
  <text x="90" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">允许：打开页面、读取文本、提取链接、记录状态</text>
  <text x="90" y="118" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#DC2626">不建议：登录真实账号、提交表单</text>

  
  <rect x="30" y="144" width="600" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)" />
  <circle cx="62" cy="174" r="15" fill="#D97706" />
  <text x="62" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="90" y="167" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#D97706">半自动</text>
  <text x="90" y="188" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">允许：填写表单、点击非危险按钮、下载文件</text>
  <text x="90" y="206" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#DC2626">不建议：支付、删除、发消息</text>

  
  <rect x="30" y="232" width="600" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)" />
  <circle cx="62" cy="262" r="15" fill="#EA580C" />
  <text x="62" y="267" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="90" y="255" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#EA580C">高风险动作</text>
  <text x="90" y="276" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">允许：人工明确二次确认后才执行</text>
  <text x="90" y="294" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#DC2626">不建议：自动输入密码、自动付款、群发内容</text>

  
  <rect x="30" y="326" width="600" height="48" rx="12" fill="#EFF6FF" stroke="#BFDBFE" />
  <rect x="30" y="326" width="6" height="48" rx="3" fill="#2563EB" />
  <text x="50" y="347" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2563EB">白名单收窄</text>
  <text x="50" y="365" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1E40AF">只读任务相关字段 · 只点流程允许的按钮 · 只访问指定域名</text>
</svg>