<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">月度复盘三句提问法</text><rect x="40" y="80" width="170" height="260" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="125" cy="115" r="16" fill="#2563EB"/><text x="125" y="120" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">1</text><text x="125" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">分类 + 举证</text><text x="125" y="180" text-anchor="middle" font-size="13" fill="#64748B">前五类花销</text><text x="125" y="200" text-anchor="middle" font-size="13" fill="#64748B">金额与占比</text><text x="125" y="220" text-anchor="middle" font-size="13" fill="#64748B">三笔最大交易</text><rect x="245" y="80" width="170" height="260" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="330" cy="115" r="16" fill="#EA580C"/><text x="330" y="120" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">2</text><text x="330" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">对比 + 拆解</text><text x="330" y="180" text-anchor="middle" font-size="13" fill="#64748B">环比涨幅最大类</text><text x="330" y="200" text-anchor="middle" font-size="13" fill="#64748B">次数变化拆解</text><text x="330" y="220" text-anchor="middle" font-size="13" fill="#64748B">单笔金额变化</text><rect x="450" y="80" width="170" height="260" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="535" cy="115" r="16" fill="#9333EA"/><text x="535" y="120" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">3</text><text x="535" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">不确定性</text><text x="535" y="180" text-anchor="middle" font-size="13" fill="#64748B">找出归类无把握</text><text x="535" y="20