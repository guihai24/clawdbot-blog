<svg viewBox='0 0 660 400' xmlns='http://www.w3.org/2000/svg'>
  <rect width='100%' height='100%' fill='#FAFAFA' rx='12'/>
  
  <!-- 标题 -->
  <text x='330' y='40' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='20' text-anchor='middle' fill='#1F2937'>目标七问架构</text>
  
  <!-- 中心节点：目标任务书 -->
  <rect x='250' y='80' width='160' height='50' fill='#FFFFFF' stroke='#2563EB' stroke-width='2' rx='12'/>
  <text x='330' y='110' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='14' text-anchor='middle' fill='#1F2937'>目标任务书</text>
  
  <!-- 七个问题节点 -->
  <!-- Why -->
  <circle cx='150' cy='180' r='40' fill='#FFFFFF' stroke='#EA580C' stroke-width='2'/>
  <text x='150' y='175' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Why</text>
  <line x1='190' y1='180' x2='250' y2='105' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Done -->
  <circle cx='330' cy='180' r='40' fill='#FFFFFF' stroke='#16A34A' stroke-width='2'/>
  <text x='330' y='175' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Done</text>
  <line x1='330' y1='140' x2='330' y2='130' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Proof -->
  <circle cx='510' cy='180' r='40' fill='#FFFFFF' stroke='#9333EA' stroke-width='2'/>
  <text x='510' y='175' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Proof</text>
  <line x1='470' y1='180' x2='410' y2='105' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Anti -->
  <circle cx='100' cy='280' r='40' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/>
  <text x='100' y='275' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Anti</text>
  <line x1='140' y1='220' x2='130' y2='240' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Bounds -->
  <circle cx='260' cy='280' r='40' fill='#FFFFFF' stroke='#EA580C' stroke-width='2'/>
  <text x='260' y='275' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Bounds</text>
  <line x1='310' y1='220' x2='270' y2='240' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Trade -->
  <circle cx='420' cy='280' r='40' fill='#FFFFFF' stroke='#16A34A' stroke-width='2'/>
  <text x='420' y='275' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Trade</text>
  <line x1='470' y1='220' x2='460' y2='240' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- Unknown -->
  <circle cx='580' cy='280' r='40' fill='#FFFFFF' stroke='#9333EA' stroke-width='2'/>
  <text x='580' y='275' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#1F2937'>Unknown</text>
  <line x1='540' y1='220' x2='550' y2='240' stroke='#D1D5DB' stroke-width='2' stroke-dasharray='5,5'/>
  
  <!-- 说明文字 -->
  <rect x='50' y='330' width='560' height='50' fill='#FFFFFF' stroke='#E5E7EB' stroke-width='1' rx='8'/>
  <text x='330' y='355' font-family='-appleSystems, "Segoe UI", sans-serif' font-size='12' text-anchor='middle' fill='#6B7280'>将模糊想法强制拉上台面，让 Agent 能消化完整指令</text>
</svg>