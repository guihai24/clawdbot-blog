<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">MoE模型与SSD分层推理架构 (Colibrì)</text><rect x="40" y="70" width="580" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="60" y="105" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB">Input Token &amp; Router</text><text x="240" y="105" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">路由器决定当前 Token 需要激活哪部分专家</text><line x1="330" y1="130" x2="330" y2="160" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4" /><polygon points="330,165 325,155 335,155" fill="#9CA3AF" /><rect x="40" y="180" width="270" height="180" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" /><rect x="60" y="195" width="230" height="30" rx="4" fill="#F0FDF4" /><text x="75" y="215" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#16A34A">常驻层 (RAM · 9.9GB)</text><text x="60" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#374151">• Attention &amp; Embedding</text><text x="60" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#374151">• 共享专家核心部分</text><text x="60" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280" font-style="italic">特点：直接常驻内存，参与所有计算</text><rect x="350" y="180" width="270" height="180" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" /><rect x="370" y="195" width="230" height="30" rx="4" fill="#FFF7ED" /><text x="385" y="215" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#EA580C">临时层 (NVMe SSD · 372GB)</text><text x="370" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#374151">• 19456个路由专家</text><text x="370" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#374151">• 按需JIT动态加载</text><text x="370" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280" font-style="italic">特点：未命中时从硬盘临时捞出</text><line x1="310" y1="270" x2="350" y2="270" stroke="#D97706" stroke-width="2" stroke-dasharray="4 4" /><circle cx="330" cy="270" r="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1" /><text x="330" y="274" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#D97706" text-anchor="middle">JIT</text></svg>