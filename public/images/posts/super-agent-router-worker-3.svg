<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Agent 心智模型转变：从「盯过程」到「管结果」</text><g transform="translate(50, 80)"><rect x="0" y="0" width="250" height="270" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect x="25" y="25" width="200" height="36" rx="6" fill="#EFF6FF"/><text x="125" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">旧模型：单会话 Agent</text><text x="125" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#EA580C" text-anchor="middle">心智模型：事必躬亲（盯过程）</text><line x1="40" y1="115" x2="210" y2="115" stroke="#F1F5F9" stroke-width="1"/><text x="55" y="145" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 每一步都要看着</text><text x="55" y="175" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 随时监控是否跑偏</text><text x="55" y="205" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 领导最累、效率受限</text></g><g transform="translate(360, 80)"><rect x="0" y="0" width="250" height="270" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect x="25" y="25" width="200" height="36" rx="6" fill="#F0FDF4"/><text x="125" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">新模型：Router 架构</text><text x="125" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9333EA" text-anchor="middle">心智模型：管结果（定义标准）</text><line x1="40" y1="115" x2="210" y2="115" stroke="#F1F5F9" stroke-width="1"/><text x="55" y="145" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 只定义任务与交付物</text><text x="55" y="175" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 中间过程交给 Router/Worker</text><text x="55" y="205" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">• 四要素任务描述（输入/标准）</text></g><line x1="315" y1="215" x2="345" y2="215" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><polygon points="345,210 355,215 345,220" fill="#94A3B8"/></svg>