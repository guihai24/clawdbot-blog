<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><style>rect { rx: 8px; } text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><rect width="660" height="400" fill="#FAFAFA" rx="12"/><text x="330" y="40" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">AI 编程时代的锁文件隐患与处理方案</text><g transform="translate(40, 70)"><rect width="170" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><path d="M 15 15 L 15 105 M 15 15 L 155 15" stroke="#F1F5F9" stroke-width="2"/><text x="85" y="45" font-size="14" font-weight="bold" fill="#EA580C" text-anchor="middle">AI 自动生成</text><text x="85" y="75" font-size="12" fill="#475569" text-anchor="middle">包含 pyproject.toml</text><text x="85" y="95" font-size="12" fill="#475569" text-anchor="middle">与盲目锁文件</text></g><path d="M 210 130 L 250 130" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(250, 70)"><rect width="160" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="80" y="45" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">隐藏风险</text><text x="80" y="75" font-size="12" fill="#475569" text-anchor="middle">对来历一无所知</text><text x="80" y="95" font-size="12" fill="#475569" text-anchor="middle">Python 版本不匹配</text></g><path d="M 410 130 L 450 130" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(450, 70)"><rect width="170" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="85" y="45" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">推荐做法</text><text x="85" y="75" font-size="12" fill="#475569" text-anchor="middle">运行前先检查目录</text><text x="85" y="95" font-size="12" fill="#475569" text-anchor="middle">核对解释器版本</text></g><g transform="translate(40, 220)"><rect width="580" height="130" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><text x="315" y="45" font-size="14" font-weight="bold" fill="#1D4ED8" text-anchor="middle">💡 核心避坑建议</text><text x="315" y="75" font-size="13" fill="#334155" text-anchor="middle">不要盲目信任 AI 生成的锁文件，排查报错前先确认锁文件与本机环境的一致性。</text><text x="315" y="100" font-size="13" fill="#334155" text-anchor="middle">必要时直接删除重建，可节省大量看似复杂的依赖排查时间。</text></g></svg>