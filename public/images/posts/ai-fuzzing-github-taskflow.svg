<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><g transform="translate(40, 50)"><rect x="0" y="40" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="50" y="75" font-size="14" fill="#1F2937" text-anchor="middle">识别入口点</text><path d="M 100 70 L 140 70" stroke="#2563EB" stroke-width="2" stroke-dasharray="4" /><rect x="140" y="40" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="190" y="75" font-size="14" fill="#1F2937" text-anchor="middle">编写 harness</text><path d="M 240 70 L 280 70" stroke="#2563EB" stroke-width="2" stroke-dasharray="4" /><rect x="280" y="40" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="330" y="75" font-size="14" fill="#1F2937" text-anchor="middle">运行 Fuzzing</text><path d="M 380 70 L 420 70" stroke="#2563EB" stroke-width="2" stroke-dasharray="4" /><rect x="420" y="40" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="480" y="65" font-size="14" fill="#1F2937" text-anchor="middle">收敛 Coverage</text><text x="480" y="85" font-size="12" fill="#6B7280" text-anchor="middle">自动迭代优化</text><path d="M 540 70 L 580 70" stroke="#16A34A" stroke-width="2" /><rect x="580" y="40" width="160" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1" /><text x="660" y="75" font-size="14" fill="#16A34A" text-anchor="middle" font-weight="bold">输出报告</text></g><text x="330" y="320" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">Fuzzing Taskflow 全自动化流程</text><text x="330" y="345" font-size="14" fill="#6B7280" text-anchor="middle">从入口识别到报告输出，全程无需人工干预</text></svg>