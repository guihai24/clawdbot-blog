<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0F172A">AI 代码审查：从逐行阅读到分层验证</text><text x="330" y="53" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#64748B">不同类型的问题，由更合适的验证方式负责</text><rect x="24" y="72" width="612" height="214" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="5 4"/><rect x="42" y="85" width="576" height="53" rx="9" fill="#FFFFFF" filter="url(#shadow)"/><rect x="42" y="85" width="6" height="53" rx="3" fill="#2563EB"/><circle cx="70" cy="111" r="13" fill="#DBEAFE"/><text x="70" y="116" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">1</text><text x="94" y="106" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">需求意图</text><text x="94" y="124" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">功能应该做什么、不应该做什么</text><rect x="405" y="96" width="197" height="31" rx="7" fill="#DBEAFE"/><text x="503" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1D4ED8">人工审查需求与验收标准</text><path d="M330 138 V147" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="42" y="151" width="576" height="53" rx="9" fill="#FFFFFF" filter="url(#shadow)"/><rect x="42" y="151" width="6" height="53" rx="3" fill="#16A34A"/><circle cx="70" cy="177" r="13" fill="#DCFCE7"/><text x="70" y="182" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#15803D">2</text><text x="94" y="172" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#166534">行为结果</text><text x="94" y="190" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">功能实际运行时是否符合预期</text><rect x="405" y="162" width="197" height="31" rx="7" fill="#DCFCE7"/><text x="503" y="181" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#166534">测试、API 请求、界面截图</text><path d="M330 204 V213" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="42" y="217" width="576" height="53" rx="9" fill="#FFFFFF" filter="url(#shadow)"/><rect x="42" y="217" width="6" height="53" rx="3" fill="#9333EA"/><circle cx="70" cy="243" r="13" fill="#F3E8FF"/><text x="70" y="248" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#7E22CE">3</text><text x="94" y="238" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#7E22CE">实现约束</text><text x="94" y="256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">项目约定、安全风险与代码质量</text><rect x="405" y="228" width="197" height="31" rx="7" fill="#F3E8FF"/><text x="503" y="247" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#7E22CE">静态检查、规则扫描、重点审查</text><path d="M330 286 V306" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="24" y="310" width="612" height="69" rx="12" fill="#FFF7ED" stroke="#FDBA74"/><circle cx="53" cy="338" r="12" fill="#FFEDD5"/><path d="M53 330 V339 M53 344 V345" stroke="#EA580C" stroke-width="2.2" stroke-linecap="round"/><text x="75" y="333" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#9A3412">人来判断，证据来验证</text><text x="75" y="353" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#7C2D12">明确验收条件 → 独立检查证据 → 聚焦高风险代码</text><text x="330" y="393" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#64748B">测试通过不等于需求正确；逐行阅读也不保证没有遗漏</text></svg>