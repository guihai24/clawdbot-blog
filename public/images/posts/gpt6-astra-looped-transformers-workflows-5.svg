<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" fill="#FAFAFA" rx="12"/><text x="330" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">AI 工作流升级实验指南</text><g transform="translate(25, 70)"><rect width="190" height="300" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1.5" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05));"/><rect width="190" height="8" fill="#2563EB" rx="4" y="0"/><circle cx="30" cy="35" r="14" fill="#EFF6FF"/><text x="30" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB">1</text><text x="54" y="39" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">终端自动化</text><rect x="15" y="65" width="160" height="60" fill="#F8FAFC" rx="6" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="25" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#64748B">传统: 步骤繁琐</text><text x="25" y="108" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">满屏 Shell 提示词</text><path d="M 95 135 L 95 155" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4" fill="none"/><polygon points="91,153 95,160 99,153" fill="#2563EB"/><rect x="15" y="165" width="160" height="115" fill="#EFF6FF" rx="6" stroke="#BFDBFE"/><text x="25" y="188" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">新范式: 结果导向</text><text x="25" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1E3A8A">• 仅限定可用命令</text><text x="25" y="230" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1E3A8A">• 明确不可触碰资源</text><text x="25" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1E3A8A">• 设定成功判定条件</text></g><g transform="translate(235, 70)"><rect width="190" height="300" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1.5" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05));"/><rect width="190" height="8" fill="#EA580C" rx="4" y="0"/><circle cx="30" cy="35" r="14" fill="#FFEDD5"/><text x="30" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#EA580C">2</text><text x="54" y="39" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">代码代理</text><rect x="15" y="65" width="160" height="60" fill="#F8FAFC" rx="6" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="25" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#64748B">传统: 代工仔</text><text x="25" y="108" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">每步手动确认与指令</text><path d="M 95 135 L 95 155" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 4" fill="none"/><polygon points="91,153 95,160 99,153" fill="#EA580C"/><rect x="15" y="165" width="160" height="115" fill="#FFF7ED" rx="6" stroke="#FED7AA"/><text x="25" y="188" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9A3412">新范式: 自主合作</text><text x="25" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#7C2D12">• 自行决定拆分任务</text><text x="25" y="230" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#7C2D12">• 依靠测试自我迭代</text><text x="25" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#7C2D12">• 后置人类审批门槛</text></g><g transform="translate(445, 70)"><rect width="190" height="300" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1.5" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05));"/><rect width="190" height="8" fill="#16A34A" rx="4" y="0"/><circle cx="30" cy="35" r="14" fill="#DCFCE7"/><text x="30" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#16A34A">3</text><text x="54" y="39" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">电脑操作</text><rect x="15" y="65" width="160" height="60" fill="#F8FAFC" rx="6" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="25" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#64748B">传统: Glue Code</text><text x="25" y="108" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">脆弱的工具链 API</text><path d="M 95 135 L 95 155" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 4" fill="none"/><polygon points="91,153 95,160 99,153" fill="#16A34A"/><rect x="15" y="165" width="160" height="115" fill="#F0FDF4" rx="6" stroke="#BBF7D0"/><text x="25" y="188" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#166534">新范式: GUI Agent</text><text x="25" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#14532D">• 真实 GUI 场景替换</text><text x="25" y="230" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#14532D">• 具备自愈能力</text><text x="25" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#14532D">• 探索更优操作路径</text></g></svg>