<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">设计上的聪明分层：决策与执行解耦</text><rect x="50" y="80" width="250" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="175" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">LLM 代理层 (决策)</text><text x="175" y="150" text-anchor="middle" font-size="13" fill="#64748B">• 决定下一个 fuzz 函数</text><text x="175" y="180" text-anchor="middle" font-size="13" fill="#64748B">• 调整测试 harness</text><text x="175" y="210" text-anchor="middle" font-size="13" fill="#64748B">• 维护输入字典</text><rect x="360" y="80" width="250" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="485" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#16A34A">MCP 工具层 (执行)</text><text x="485" y="150" text-anchor="middle" font-size="13" fill="#64748B">• 运行 AFL++ 模糊测试</text><text x="485" y="180" text-anchor="middle" font-size="13" fill="#64748B">• 编译测试 harness</text><text x="485" y="210" text-anchor="middle" font-size="13" fill="#64748B">• 读取 Code Coverage</text><path d="M 300 180 L 360 180" stroke="#9333EA" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/><circle cx="330" cy="180" r="12" fill="#9333EA"/><text x="330" y="184" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">API</text><rect x="50" y="310" width="560" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/><text x="330" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97706">SQLite 状态数据库</text><text x="330" y="355" text-anchor="middle" font-size="12" fill="#92400E">状态完全持久化，确保 Pipeline 稳定可靠</text></g></svg>