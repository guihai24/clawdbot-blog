<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">GIF 提示词的通用三段式骨架</text><g transform="translate(50, 80)"><rect x="0" y="0" width="160" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><path d="M16 16 L144 16 L144 24 L16 24 Z" fill="#2563EB" opacity="0.1" /><text x="80" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">1. 画面</text><text x="80" y="80" text-anchor="middle" font-size="13" fill="#4B5563">风格、主体、</text><text x="80" y="105" text-anchor="middle" font-size="13" fill="#4B5563">色彩、景深</text><rect x="20" y="150" width="120" height="60" rx="6" fill="#EFF6FF" /><text x="80" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">决定长什么样</text><text x="80" y="193" text-anchor="middle" font-size="11" fill="#6B7280">(视觉基础)</text></g><line x1="215" y1="200" x2="245" y2="200" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,4" /><g transform="translate(250, 80)"><rect x="0" y="0" width="160" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><path d="M16 16 L144 16 L144 24 L16 24 Z" fill="#EA580C" opacity="0.1" /><text x="80" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#EA580C">2. 动作弧</text><text x="80" y="80" text-anchor="middle" font-size="13" fill="#4B5563">初始状态、</text><text x="80" y="105" text-anchor="middle" font-size="13" fill="#4B5563">动态过程、结尾</text><rect x="20" y="150" width="120" height="60" rx="6" fill="#FFF7ED" /><text x="80" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#C2410C">决定动什么</text><text x="80" y="193" text-anchor="middle" font-size="11" fill="#6B7280">(动态轨迹)</text></g><line x1="415" y1="200" x2="445" y2="200" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,4" /><g transform="translate(450, 80)"><rect x="0" y="0" width="160" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><path d="M16 16 L144 16 L144 24 L16 24 Z" fill="#16A34A" opacity="0.1" /><text x="80" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#16A34A">3. 首尾约束</text><text x="80" y="80" text-anchor="middle" font-size="13" fill="#4B5563">帧率、循环、</text><text x="80" y="105" text-anchor="middle" font-size="13" fill="#4B5563">透明、负向词</text><rect x="20" y="150" width="120" height="60" rx="6" fill="#F0FDF4" /><text x="80" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#15803D">决定能不能用</text><text x="80" y="193" text-anchor="middle" font-size="11" fill="#6B7280">(工程规范)</text></g><text x="330" y="360" text-anchor="middle" font-size="13" fill="#6B7280">核心结论：万变不离其宗，10个提示词共用同一个骨架</text></g></svg>