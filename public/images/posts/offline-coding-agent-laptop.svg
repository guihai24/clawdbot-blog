<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000000' flood-opacity='0.06'/></filter></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-family='-apple-system, sans-serif' font-size='20' font-weight='bold' fill='#1F2937' text-anchor='middle'>谁真的需要断网写代码？</text><g transform='translate(30, 70)'><rect x='0' y='0' width='180' height='290' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='180' height='8' rx='4' fill='#2563EB'/><text x='90' y='35' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#2563EB' text-anchor='middle'>网络不稳者</text><text x='90' y='60' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280' text-anchor='middle'>高铁 / 飞机 / 山区</text><path d='M20 80 L160 80' stroke='#E5E7EB' stroke-width='1'/><text x='20' y='110' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#4B5563'>痛点：</text><text x='20' y='130' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>断流是常态，进度停滞</text><text x='20' y='180' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#2563EB'>解决方案：</text><text x='20' y='200' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>把碎片时间变成</text><text x='20' y='220' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>能推进的两小时</text><rect x='20' y='250' width='140' height='24' rx='4' fill='#EFF6FF'/><text x='90' y='266' font-family='-apple-system, sans-serif' font-size='12' fill='#2563EB' text-anchor='middle'>省时驱动</text></g><g transform='translate(240, 70)'><rect x='0' y='0' width='180' height='290' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='180' height='8' rx='4' fill='#D97706'/><text x='90' y='35' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#D97706' text-anchor='middle'>成本敏感者</text><text x='90' y='60' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280' text-anchor='middle'>按 Token 计费</text><path d='M20 80 L160 80' stroke='#E5E7EB' stroke-width='1'/><text x='20' y='110' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#4B5563'>痛点：</text><text x='20' y='130' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>写得越多账单越高</text><text x='20' y='180' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#D97706'>解决方案：</text><text x='20' y='200' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>电费换 Token，</text><text x='20' y='220' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>边际成本趋零</text><rect x='20' y='250' width='140' height='24' rx='4' fill='#FEF3C7'/><text x='90' y='266' font-family='-apple-system, sans-serif' font-size='12' fill='#D97706' text-anchor='middle'>省钱驱动</text></g><g transform='translate(450, 70)'><rect x='0' y='0' width='180' height='290' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='180' height='8' rx='4' fill='#16A34A'/><text x='90' y='35' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#16A34A' text-anchor='middle'>安全合规者</text><text x='90' y='60' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280' text-anchor='middle'>代码不出本机</text><path d='M20 80 L160 80' stroke='#E5E7EB' stroke-width='1'/><text x='20' y='110' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#4B5563'>痛点：</text><text x='20' y='130' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>内部项目合规要求严</text><text x='20' y='180' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#16A34A'>解决方案：</text><text x='20' y='200' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>请求不出网卡，</text><text x='20' y='220' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>最刚性的需求</text><rect x='20' y='250' width='140' height='24' rx='4' fill='#DCFCE7'/><text x='90' y='266' font-family='-apple-system, sans-serif' font-size='12' fill='#16A34A' text-anchor='middle'>安全驱动（最刚性）</text></g></svg>