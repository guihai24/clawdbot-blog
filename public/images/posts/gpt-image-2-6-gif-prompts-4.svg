<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">哪些素材该交给 AI，哪些别碰</text><g transform="translate(40, 70)"><rect x="0" y="0" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="25" cy="25" r="12" fill="#16A34A"/><text x="25" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">✓</text><text x="50" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#16A34A">推荐交给 AI</text><text x="20" y="65" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 小尺寸 UI 元素（Loading、图标）</text><text x="20" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 文末引导条 / 贴纸 / 表情包</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">（特点：尺寸小，画质短板被掩盖）</text></g><g transform="translate(350, 70)"><rect x="0" y="0" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="25" cy="25" r="12" fill="#D97706"/><text x="25" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">!</text><text x="50" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#D97706">谨慎 / 看情况</text><text x="20" y="65" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 产品功能演示（需局部修改）</text><text x="20" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 系列角色素材（易产生漂移）</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">（特点：细节要求高，需人工微调）</text></g><g transform="translate(195, 220)"><rect x="0" y="0" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="25" cy="25" r="12" fill="#DC2626"/><text x="25" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">×</text><text x="50" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#DC2626">千万别碰</text><text x="20" y="65" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 真人出镜 / 写实人像</text><text x="20" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 精确数据图表 / 复杂插画</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">（特点：数字易错，五官严重漂移）</text></g></svg>