tem, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">确保轨迹质量与尴尬度</text></g><g transform="translate(460, 70)"><rect width="160" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" /><rect x="15" y="15" width="32" height="32" rx="6" fill="#FFFBEB" /><text x="31" y="37" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">⚠️</text><text x="15" y="68" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">授权与TOS合规</text><text x="15" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">核对合同与服务条款限制</text></g><path d="M 160 125 L 180 125" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="2" /><path d="M 300 125 L 320 125" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="2" /><path d="M 440 125 L 460 125" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="2" /><g transform="translate(80, 215)"><rect width="500" height="145" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" /><text x="250" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">核心检验防线总结</text><text x="45" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#7F1D1D">• 避免简单任务堆砌，保持真实长尾工作分布</text><text x="45" y="95" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#7F1D1D">• 严查模型回复中的隐性密钥与敏感数据输出</text><text x="45" y="120" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#7F1D1D">• 警惕蒸馏攻击与版权争议，主动核对TOS条款</text></g></svg>