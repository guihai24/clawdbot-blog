<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="34" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1E293B">个人开发者的 AI 工程质量闭环</text><text x="330" y="55" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">从明确需求到可验证交付，再到规则沉淀</text><g filter="url(#shadow)"><rect x="30" y="83" width="278" height="106" rx="12" fill="#FFFFFF" stroke="#BFDBFE"/><rect x="30" y="83" width="6" height="106" rx="3" fill="#2563EB"/><circle cx="59" cy="108" r="13" fill="#DBEAFE"/><text x="59" y="113" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2563EB">1</text><text x="81" y="113" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1E40AF">定义验收条件</text><text x="50" y="140" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">明确正常路径、失败路径与边界</text><text x="50" y="162" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#2563EB">产出：任务说明与验收标准</text><rect x="352" y="83" width="278" height="106" rx="12" fill="#FFFFFF" stroke="#FED7AA"/><rect x="352" y="83" width="6" height="106" rx="3" fill="#EA580C"/><circle cx="381" cy="108" r="13" fill="#FFEDD5"/><text x="381" y="113" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C2410C">2</text><text x="403" y="113" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#9A3412">建立可运行检查</text><text x="372" y="140" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">将每条标准映射到测试或检查</text><text x="372" y="162" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#EA580C">产出：测试用例与 CI 检查</text><rect x="30" y="224" width="278" height="106" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/><rect x="30" y="224" width="6" height="106" rx="3" fill="#16A34A"/><circle cx="59" cy="249" r="13" fill="#DCFCE7"/><text x="59" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#15803D">3</text><text x="81" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#166534">收集验证证据</text><text x="50" y="281" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">记录真实输出、失败用例与运行结果</text><text x="50" y="303" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16A34A">产出：可核对的验证记录</text><rect x="352" y="224" width="278" height="106" rx="12" fill="#FFFFFF" stroke="#E9D5FF"/><rect x="352" y="224" width="6" height="106" rx="3" fill="#9333EA"/><circle cx="381" cy="249" r="13" fill="#F3E8FF"/><text x="381" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7E22CE">4</text><text x="403" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#6B21A8">沉淀自动化规则</text><text x="372" y="281" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">归纳重复审查意见并自动检测</text><text x="372" y="303" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9333EA">产出：静态规则与质量约束</text></g><path d="M308 136 H342" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M491 189 V214" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M352 277 H318" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M169 224 V199" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M169 199 l-4 6 M169 199 l4 6" fill="none" stroke="#94A3B8" stroke-width="1.5"/><rect x="85" y="352" width="490" height="32" rx="9" fill="#FEF3C7" stroke="#FDE68A"/><text x="330" y="372" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#92400E">核心原则：机器验证明确规则，人负责业务判断</text></svg>