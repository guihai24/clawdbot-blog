<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%" font-family="-apple-system, 'Segoe UI', sans-serif"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" font-size="18" font-weight="bold" text-anchor="middle" fill="#1E293B">Open WebUI 桌面 Agent 搭建与调试五步流程</text><g transform="translate(25, 75)"><g transform="translate(0, 0)"><rect width="112" height="275" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="56" cy="35" r="16" fill="#2563EB"/><text x="56" y="40" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="56" y="75" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">准备隔离环境</text><line x1="15" y1="95" x2="97" y2="95" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="120" font-size="11" fill="#64748B" text-anchor="middle">优先使用虚拟机</text><text x="56" y="145" font-size="11" fill="#64748B" text-anchor="middle">控制破坏范围</text><text x="56" y="170" font-size="11" fill="#64748B" text-anchor="middle">隔离日常数据</text></g><g transform="translate(129, 0)"><rect width="112" height="275" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="56" cy="35" r="16" fill="#EA580C"/><text x="56" y="40" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="56" y="75" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">连接模型桌面</text><line x1="15" y1="95" x2="97" y2="95" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="120" font-size="11" fill="#64748B" text-anchor="middle">Open WebUI</text><text x="56" y="145" font-size="11" fill="#64748B" text-anchor="middle">Open Terminal</text><text x="56" y="170" font-size="11" fill="#64748B" text-anchor="middle">支持工具调用</text></g><g transform="translate(258, 0)"><rect width="112" height="275" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="56" cy="35" r="16" fill="#16A34A"/><text x="56" y="40" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="56" y="75" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">可逆任务测试</text><line x1="15" y1="95" x2="97" y2="95" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="120" font-size="11" fill="#64748B" text-anchor="middle">画一只狗验证</text><text x="56" y="145" font-size="11" fill="#64748B" text-anchor="middle">检查鼠标键盘</text><text x="56" y="170" font-size="11" fill="#64748B" text-anchor="middle">测试可视反馈</text></g><g transform="translate(387, 0)"><rect width="112" height="275" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="56" cy="35" r="16" fill="#9333EA"/><text x="56" y="40" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="56" y="75" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">观察操作轨迹</text><line x1="15" y1="95" x2="97" y2="95" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="120" font-size="11" fill="#64748B" text-anchor="middle">浏览器中交互</text><text x="56" y="145" font-size="11" fill="#64748B" text-anchor="middle">看清当前画面</text><text x="56" y="170" font-size="11" fill="#64748B" text-anchor="middle">随时掌握状态</text></g><g transform="translate(516, 0)"><rect width="112" height="275" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="56" cy="35" r="16" fill="#D97706"/><text x="56" y="40" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="56" y="75" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">加入人工接管</text><line x1="15" y1="95" x2="97" y2="95" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="120" font-size="11" fill="#64748B" text-anchor="middle">关键步骤暂停</text><text x="56" y="145" font-size="11" fill="#64748B" text-anchor="middle">高危操作确认</text><text x="56" y="170" font-size="11" fill="#64748B" text-anchor="middle">实用保险丝</text></g></g></svg>