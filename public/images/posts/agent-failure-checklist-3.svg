<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" /></filter></defs><rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" /><text x="30" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#0F172A">什么时候可以相信「修好了」？</text><text x="30" y="62" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">验证标准因任务而异，不能都压缩成「命令没报错」</text><g filter="url(#sh)"><rect x="30" y="82" width="295" height="100" rx="10" fill="#FFFFFF" /><rect x="339" y="82" width="295" height="100" rx="10" fill="#FFFFFF" /><rect x="30" y="198" width="295" height="100" rx="10" fill="#FFFFFF" /><rect x="339" y="198" width="295" height="100" rx="10" fill="#FFFFFF" /></g><circle cx="56" cy="116" r="13" fill="#2563EB" /><text x="56" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="80" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1E293B">文档任务</text><text x="46" y="156" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">看内容是否准确、术语是否一致</text><circle cx="365" cy="116" r="13" fill="#EA580C" /><text x="365" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="389" y="121" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1E293B">数据处理任务</text><text x="355" y="156" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">看样本输入输出是否对得上</text><circle cx="56" cy="232" r="13" fill="#16A34A" /><text x="56" y="237" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="80" y="237" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1E293B">自动化任务</text><text x="46" y="272" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">看异常分支有无通知和回滚</text><circle cx="365" cy="232" r="13" fill="#9333EA" /><text x="365" y="237" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="389" y="237" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1E293B">编码任务</text><text x="355" y="272" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">看真实业务流程是否跑通</text><rect x="30" y="314" width="604" height="66" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="5 4" /><text x="46" y="338" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#334155">可信的「修好了」，必须带着边界感说清四件事</text><rect x="134" y="348" width="78" height="24" rx="12" fill="#EFF6FF" /><text x="173" y="364" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#2563EB" text-anchor="middle">改了什么</text><rect x="224" y="348" width="78" height="24" rx="12" fill="#FFF7ED" /><text x="263" y="364" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#EA580C" text-anchor="middle">验证到哪</text><rect x="314" y="348" width="92" height="24" rx="12" fill="#F0FDF4" /><text x="360" y="364" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#16A34A" text-anchor="middle">未验证范围</text><rect x="418" y="348" width="112" height="24" rx="12" fill="#FAF5FF" /><text x="474" y="364" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#9333EA" text-anchor="middle">需要人做什么</text></svg>