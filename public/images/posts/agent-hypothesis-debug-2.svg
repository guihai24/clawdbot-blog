<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="330" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">写进 MD 文件：三份「长期记忆」</text>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#6B7280">investigation/　目录下的固定结构</text>

  
  <rect x="28" y="72" width="188" height="190" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
  <rect x="28" y="72" width="188" height="6" rx="3" fill="#2563EB" />
  <text x="122" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">MAP.md</text>
  <line x1="44" y1="120" x2="200" y2="120" stroke="#F3F4F6" stroke-width="1" />
  <text x="122" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">结构认知</text>
  <text x="122" y="176" text-anchor="middle" font-size="12" fill="#6B7280">入口 / 分支 / 依赖</text>
  <text x="122" y="200" text-anchor="middle" font-size="12" fill="#6B7280">关键函数</text>
  <text x="122" y="240" text-anchor="middle" font-size="11.5" fill="#9CA3AF">它大概怎么运转</text>

  
  <rect x="236" y="72" width="188" height="190" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
  <rect x="236" y="72" width="188" height="6" rx="3" fill="#16A34A" />
  <text x="330" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#16A34A">FACTS.md</text>
  <line x1="252" y1="120" x2="408" y2="120" stroke="#F3F4F6" stroke-width="1" />
  <text x="330" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">已确认事实</text>
  <text x="330" y="176" text-anchor="middle" font-size="12" fill="#6B7280">命令输出 / 日志片段</text>
  <text x="330" y="200" text-anchor="middle" font-size="12" fill="#6B7280">实验结论</text>
  <text x="330" y="240" text-anchor="middle" font-size="11.5" fill="#9CA3AF">别把推论混进来</text>

  
  <rect x="444" y="72" width="188" height="190" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
  <rect x="444" y="72" width="188" height="6" rx="3" fill="#9333EA" />
  <text x="538" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#9333EA">HYPOTHESES.csv</text>
  <line x1="460" y1="120" x2="616" y2="120" stroke="#F3F4F6" stroke-width="1" />
  <text x="538" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">假设登记表</text>
  <text x="538" y="176" text-anchor="middle" font-size="12" fill="#6B7280">每次只测一个</text>
  <text x="538" y="200" text-anchor="middle" font-size="12" fill="#6B7280">写明证据与状态</text>
  <text x="538" y="240" text-anchor="middle" font-size="11.5" fill="#9CA3AF">核心，逐个验证</text>

  
  <line x1="122" y1="266" x2="122" y2="288" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="330" y1="266" x2="330" y2="288" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="538" y1="266" x2="538" y2="288" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  
  <rect x="28" y="290" width="604" height="76" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)" />
  <rect x="28" y="290" width="5" height="76" rx="2.5" fill="#EA580C" />
  <text x="48" y="318" font-size="13" font-weight="700" fill="#EA580C">关键：事实区与假设区必须分开</text>
  <text x="48" y="342" font-size="11.5" fill="#4B5563">事实 → FACTS.md　｜　假设 → HYPOTHESES.csv　｜　否则几轮后全是「可能、大概」，反而加固偏见</text>
</svg>