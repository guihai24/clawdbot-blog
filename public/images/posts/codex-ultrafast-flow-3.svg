<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"><defs><filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" /></filter></defs><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="36" y="46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#1F2937">你等的是模型，还是等工具？</text><text x="36" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">任务总时长 = 模型生成 + 工具执行，快速模型只压缩前者</text><text x="36" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#374151">UI 微调 · 文档改写 · 表单填写</text><rect x="36" y="122" width="322" height="42" rx="8" fill="#2563EB" /><text x="197" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">模型生成（占大头）</text><rect x="366" y="122" width="116" height="42" rx="8" fill="#CBD5E1" /><text x="424" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">工具耗时</text><rect x="498" y="124" width="124" height="38" rx="19" fill="#DCFCE7" /><text x="560" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#15803D">收益明显 ↑</text><text x="36" y="198" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#374151">大构建 · 全量测试 · 图片生成</text><rect x="36" y="210" width="106" height="42" rx="8" fill="#2563EB" /><text x="89" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">模型生成</text><rect x="150" y="210" width="332" height="42" rx="8" fill="#EA580C" /><text x="316" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">构建 / 测试 / 图片生成（固定耗时）</text><rect x="498" y="212" width="124" height="38" rx="19" fill="#FFEDD5" /><text x="560" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#C2410C">收益有限 →</text><rect x="36" y="278" width="586" height="86" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="36" y="278" width="6" height="86" rx="3" fill="#9333EA" /><text x="62" y="310" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#1F2937">Ultrafast 加速的是「生成 ↔ 反馈」这一段</text><text x="62" y="336" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">它不会让整条流水线快 4.5×，编译与图片生成的耗时照旧</text></svg>