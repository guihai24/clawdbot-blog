<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 660 400' width='100%' height='100%'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='20' font-weight='bold' fill='#1E293B' text-anchor='middle'>Claude 功能升级核心三大板块</text><g transform='translate(40, 75)'><rect width='580' height='90' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><rect x='0' y='0' width='8' height='90' rx='4' fill='#2563EB'/><text x='25' y='30' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='bold' fill='#2563EB'>1. Cowork + Chat 合并</text><text x='25' y='55' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='14' fill='#475569'>单入口智能分流，无需提前分类，旧项目与资源完整保留。</text></g><g transform='translate(40, 180)'><rect width='580' height='90' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><rect x='0' y='0' width='8' height='90' rx='4' fill='#9333EA'/><text x='25' y='30' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='bold' fill='#9333EA'>2. Docs / Slides / Design 进对话</text><text x='25' y='55' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='14' fill='#475569'>从对话直接生成结构化文档、演示文稿与可视化视觉设计。</text></g><g transform='translate(40, 285)'><rect width='580' height='90' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><rect x='0' y='0' width='8' height='90' rx='4' fill='#16A34A'/><text x='25' y='30' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='bold' fill='#16A34A'>3. 持续执行：关掉电脑它也干</text><text x='25' y='55' font-family="-apple-system, 'Segoe UI', sans-serif" font-size='14' fill='#475569'>支持复杂长任务云端独立运行，支持分步确认或关键点提醒。</text></g></svg>