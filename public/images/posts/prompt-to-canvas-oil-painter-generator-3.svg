<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-opacity='0.08'/></filter><marker id='arrow' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M 0 1 L 10 5 L 0 9 z' fill='#9333EA'/></marker></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-family='-apple-system, sans-serif' font-size='20' font-weight='bold' fill='#1E293B' text-anchor='middle'>提示词驱动工程：三步标准操作法</text><g transform='translate(40, 75)'><rect width='580' height='85' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='45' cy='42' r='20' fill='#EFF6FF'/><text x='45' y='47' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#2563EB' text-anchor='middle'>1</text><text x='85' y='38' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#1E293B'>界定边界：专注单一核心特效</text><text x='85' y='60' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B'>每次只挑一个核心功能（如素描转换、降采样器等）</text><rect x='490' y='28' width='60' height='28' rx='4' fill='#FEF3C7'/><text x='520' y='46' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#D97706' text-anchor='middle'>范围小</text></g><path d='M 330 160 L 330 185' stroke='#9333EA' stroke-width='2' stroke-dasharray='4 4' marker-end='url(#arrow)'/><g transform='translate(40, 190)'><rect width='580' height='85' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='45' cy='42' r='20' fill='#F0FDF4'/><text x='45' y='47' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#16A34A' text-anchor='middle'>2</text><text x='85' y='38' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#1E293B'>限定技术栈：单文件无依赖</text><text x='85' y='60' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B'>纯 HTML/CSS/JS，避免外部库，聚焦算法与交互</text><rect x='490' y='28' width='60' height='28' rx='4' fill='#DCFCE7'/><text x='520' y='46' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#16A34A' text-anchor='middle'>无依赖</text></g><path d='M 330 275 L 330 300' stroke='#9333EA' stroke-width='2' stroke-dasharray='4 4' marker-end='url(#arrow)'/><g transform='translate(40, 305)'><rect width='580' height='85' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='45' cy='42' r='20' fill='#FDF4FF'/><text x='45' y='47' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#9333EA' text-anchor='middle'>3</text><text x='85' y='38' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#1E293B'>迭代闭环：精准反馈与优化</text><text x='85' y='60' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B'>测试初版，针对视觉缺陷或报错向 AI 提供具体改进指令</text><rect x='490' y='28' width='60' height='28' rx='4' fill='#F3E8FF'/><text x='520' y='46' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#9333EA' text-anchor='middle'>测反馈</text></g></svg>