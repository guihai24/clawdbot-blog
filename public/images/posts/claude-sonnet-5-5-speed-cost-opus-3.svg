<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" text-anchor="middle" font-size="20" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#1E293B">Sonnet 5.5 五大核心工作流模板</text><g transform="translate(30, 70)"><rect width="180" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="6" rx="3" fill="#2563EB" /><text x="15" y="30" font-size="14" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#2563EB">1. Bug 修复工作流</text><text x="15" y="55" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">快速定位并修复 bug</text><text x="15" y="75" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">最小化回归风险</text><text x="15" y="95" font-size="11" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#2563EB">#Xhigh effort</text></g><g transform="translate(240, 70)"><rect width="180" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="6" rx="3" fill="#EA580C" /><text x="15" y="30" font-size="14" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#EA580C">2. 文档生成工作流</text><text x="15" y="55" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">从原始需求生成</text><text x="15" y="75" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">专业技术文档</text><text x="15" y="95" font-size="11" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#EA580C">#API/手册/博客</text></g><g transform="translate(450, 70)"><rect width="180" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="6" rx="3" fill="#16A34A" /><text x="15" y="30" font-size="14" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#16A34A">3. 演示文稿工作流</text><text x="15" y="55" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">从产品需求直接</text><text x="15" y="75" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">生成完整 Slide</text><text x="15" y="95" font-size="11" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#16A34A">#Markdown 格式</text></g><g transform="translate(135, 210)"><rect width="180" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="6" rx="3" fill="#9333EA" /><text x="15" y="30" font-size="14" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#9333EA">4. UI 重构工作流</text><text x="15" y="55" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">重构现有 UI 界面</text><text x="15" y="75" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">提升用户体验</text><text x="15" y="95" font-size="11" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#9333EA">#原型设计建议</text></g><g transform="translate(345, 210)"><rect width="180" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="180" height="6" rx="3" fill="#D97706" /><text x="15" y="30" font-size="14" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#D97706">5. 表格自动化工作流</text><text x="15" y="55" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">从原始数据生成</text><text x="15" y="75" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#64748B">交互式工作表</text><text x="15" y="95" font-size="11" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif" fill="#D97706">#Excel/Sheets</text></g></svg>