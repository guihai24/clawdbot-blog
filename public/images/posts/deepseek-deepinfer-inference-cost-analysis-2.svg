<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" style="background:#FAFAFA; font-family:-apple-system, 'Segoe UI', sans-serif;"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">独立开发者：自建推理 vs 托管 API 决策指南</text><rect x="40" y="70" width="270" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="75" cy="105" r="16" fill="#FEF2F2"/><text x="75" y="111" text-anchor="middle" font-size="16" fill="#DC2626">×</text><text x="105" y="111" font-size="16" font-weight="bold" fill="#DC2626">不适合自建（选 API）</text><text x="60" y="150" font-size="14" fill="#475569">• 每日 Token 请求量较少（低并发）</text><text x="60" y="185" font-size="14" fill="#475569">• 用户输入多变，缓存命中率极低</text><text x="60" y="220" font-size="14" fill="#475569">• GPU 利用率长期低于 70%</text><text x="60" y="255" font-size="14" fill="#475569">• 缺乏专职运维，折旧与电费高昂</text><rect x="350" y="70" width="270" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="385" cy="105" r="16" fill="#F0FDF4"/><text x="385" y="111" text-anchor="middle" font-size="16" fill="#16A34A">✓</text><text x="415" y="111" font-size="16" font-weight="bold" fill="#16A34A">适合自建开源推理</text><text x="370" y="150" font-size="14" fill="#475569">• 拥有庞大且稳定的高并发吞吐</text><text x="370" y="185" font-size="14" fill="#475569">• 高前缀缓存命中率（长 Prompt）</text><text x="370" y="220" font-size="14" fill="#475569">• 具备显存与推理引擎优化能力</text><text x="370" y="255" font-size="14" fill="#475569">• 综合算力成本低于 API 采购价</text></svg>