<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' font-family='-apple-system, Segoe UI, sans-serif'>  <rect width='660' height='400' rx='12' fill='#FAFAFA' />  <text x='40' y='45' font-size='18' font-weight='bold' fill='#1E293B'>PHP2Shell 风险与老网站安全隐患</text>  <text x='40' y='70' font-size='13' fill='#64748B'>为什么长期运行未更新的站点会面临底层环境缺陷？</text>  <rect x='40' y='110' width='170' height='230' rx='10' fill='#FFFFFF' stroke='#E2E8F0' />  <circle cx='125' cy='155' r='24' fill='#FEE2E2' />  <path d='M125 143v14m0 8v2' stroke='#DC2626' stroke-width='3' stroke-linecap='round' />  <text x='125' y='205' font-size='15' font-weight='bold' fill='#1E293B' text-anchor='middle'>长期未更新</text>  <text x='55' y='235' font-size='12' fill='#64748B' width='140'>• 后台多年无人维护<br/>• 插件保持陈旧版本<br/>• PHP环境古老未升</text>  <rect x='245' y='110' width='170' height='230' rx='10' fill='#FFFFFF' stroke='#E2E8F0' />  <circle cx='330' cy='155' r='24' fill='#FEF3C7' />  <path d='M330 143v14m0 8v2' stroke='#D97706' stroke-width='3' stroke-linecap='round' />  <text x='330' y='205' font-size='15' font-weight='bold' fill='#1E293B' text-anchor='middle'>底层缺陷</text>  <text x='260' y='235' font-size='12' fill='#64748B'>• PHP 引擎底层漏洞<br/>• 影响依赖运行环境<br/>• 隐藏极深难以察觉</text>  <rect x='450' y='110' width='170' height='230' rx='10' fill='#FFFFFF' stroke='#E2E8F0' />  <circle cx='535' cy='155' r='24' fill='#DBEAFE' />  <path d='M535 143v14m0 8v2' stroke='#2563EB' stroke-width='3' stroke-linecap='round' />  <text x='535' y='205' font-size='15' font-weight='bold' fill='#1E293B' text-anchor='middle'>AI 辅助攻击</text>  <text x='465' y='235' font-size='12' fill='#64748B'>• AI 加速漏洞发现<br/>• 攻击成本大幅下降<br/>• 错觉掩盖真实风险</text>  <line x1='210' y1='225' x2='245' y2='225' stroke='#CBD5E1' stroke-width='2' stroke-dasharray='4' />  <line x1='415' y1='225' x2='450' y2='225' stroke='#CBD5E1' stroke-width='2' stroke-dasharray='4' /></svg>