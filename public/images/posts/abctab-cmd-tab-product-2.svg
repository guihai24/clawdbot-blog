<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><g font-family='-apple-system, Segoe UI, sans-serif'><text x='330' y='45' text-anchor='middle' font-size='20' font-weight='700' fill='#1E293B'>窗口切换的隐形代价：高频摩擦的连锁反应</text><rect x='40' y='80' width='160' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><text x='120' y='115' text-anchor='middle' font-size='15' font-weight='600' fill='#2563EB'>一天切换 50 次</text><text x='120' y='145' text-anchor='middle' font-size='13' fill='#64748B'>寻找、对焦、确认</text><path d='M 215 130 L 255 130' fill='none' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4 4'/><polygon points='255,126 263,130 255,134' fill='#94A3B8'/><rect x='270' y='80' width='160' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><text x='350' y='115' text-anchor='middle' font-size='15' font-weight='600' fill='#D97706'>视觉搜索打断</text><text x='350' y='145' text-anchor='middle' font-size='13' fill='#64748B'>肌肉记忆轻微硌痛</text><path d='M 445 130 L 485 130' fill='none' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4 4'/><polygon points='485,126 493,130 485,134' fill='#94A3B8'/><rect x='500' y='80' width='120' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><text x='560' y='115' text-anchor='middle' font-size='15' font-weight='600' fill='#EA580C'>7+ 小时/年</text><text x='560' y='145' text-anchor='middle' font-size='13' fill='#64748B'>时间直接流失</text><rect x='40' y='220' width='580' height='140' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1'/><text x='70' y='260' font-size='16' font-weight='700' fill='#9333EA'>核心损耗：上下文的连续性（Flow）被破坏</text><circle cx='75' cy='305' r='5' fill='#16A34A'/><text x='95' y='310' font-size='13' fill='#334155'>思路被打断：写代码时的逻辑断层，重建成本极高</text><circle cx='75' cy='335' r='5' fill='#16A34A'/><text x='95' y='340' font-size='13' fill='#334155'>微痛点价值：高频小摩擦值得做成产品（高频、低验证成本）</text></g></svg>