<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">常驻 Agent 任务筛选与应用场景</text><rect x="40" y="70" width="260" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="60" y="105" font-size="16" font-weight="bold" fill="#2563EB">任务筛选三问</text><text x="60" y="140" font-size="13" fill="#475569">1. 是否重复发生？</text><text x="60" y="175" font-size="13" fill="#475569">2. 是否需定时/事件触发？</text><text x="60" y="210" font-size="13" fill="#475569">3. 结果可描述和验收吗？</text><rect x="335" y="70" width="285" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="355" y="105" font-size="16" font-weight="bold" fill="#16A34A">三类推荐应用场景</text><rect x="355" y="125" width="245" height="55" rx="6" fill="#F0FDF4" /><text x="370" y="147" font-size="13" font-weight="bold" fill="#16A34A">定时盯梢型</text><text x="370" y="167" font-size="12" fill="#475569">每天定点搜信息、汇总推送</text><rect x="355" y="190" width="245" height="55" rx="6" fill="#EFF6FF" /><text x="370" y="212" font-size="13" font-weight="bold" fill="#2563EB">跨平台搬运型</text><text x="370" y="232" font-size="12" fill="#475569">对话需求自动建 Issue / 同步任务</text><rect x="355" y="255" width="245" height="55" rx="6" fill="#FAF5FF" /><text x="370" y="277" font-size="13" font-weight="bold" fill="#9333EA">多线并行型</text><text x="370" y="297" font-size="12" fill="#475569">同时推进写周报、整理资料、小工具</text></g></svg>