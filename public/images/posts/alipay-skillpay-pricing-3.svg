<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" /></filter></defs><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">买断 vs 订阅：两种完全不同的生意</text><text x="330" y="56" text-anchor="middle" font-size="11" fill="#6B7280">差的不只是交付方式，而是控制权与收入结构</text><line x1="330" y1="86" x2="330" y2="278" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 5" /><rect x="28" y="70" width="292" height="218" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="28" y="70" width="292" height="36" rx="10" fill="#EA580C" /><rect x="28" y="94" width="292" height="12" fill="#EA580C" /><text x="48" y="93" font-size="13" font-weight="700" fill="#FFFFFF">买断 · 一次交付</text><circle cx="46" cy="126" r="3.5" fill="#EA580C" /><text x="58" y="130" font-size="11.5"><tspan font-weight="600" fill="#374151">交付</tspan><tspan fill="#6B7280" dx="8">完整内容落到买家本地</tspan></text><circle cx="46" cy="156" r="3.5" fill="#EA580C" /><text x="58" y="160" font-size="11.5"><tspan font-weight="600" fill="#374151">计费</tspan><tspan fill="#6B7280" dx="8">一次性，0.01–50 元</tspan></text><circle cx="46" cy="186" r="3.5" fill="#EA580C" /><text x="58" y="190" font-size="11.5"><tspan font-weight="600" fill="#374151">防盗版</tspan><tspan fill="#6B7280" dx="8">几乎为零，明文即失控</tspan></text><circle cx="46" cy="216" r="3.5" fill="#EA580C" /><text x="58" y="220" font-size="11.5"><tspan font-weight="600" fill="#374151">收入</tspan><tspan fill="#6B7280" dx="8">靠流量，卖一次算一次</tspan></text><circle cx="46" cy="246" r="3.5" fill="#EA580C" /><text x="58" y="250" font-size="11.5"><tspan font-weight="600" fill="#374151">定位</tspan><tspan fill="#EA580C" dx="8" font-weight="600">引流款</tspan></text><rect x="340" y="70" width="292" height="218" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="340" y="70" width="292" height="36" rx="10" fill="#2563EB" /><rect x="340" y="94" width="292" height="12" fill="#2563EB" /><text x="360" y="93" font-size="13" font-weight="700" fill="#FFFFFF">订阅 · 持续调用</text><circle cx="358" cy="126" r="3.5" fill="#2563EB" /><text x="370" y="130" font-size="11.5"><tspan font-weight="600" fill="#374151">交付</tspan><tspan fill="#6B7280" dx="8">仅执行结果，明文不出沙盒</tspan></text><circle cx="358" cy="156" r="3.5" fill="#2563EB" /><text x="370" y="160" font-size="11.5"><tspan font-weight="600" fill="#374151">计费</tspan><tspan fill="#6B7280" dx="8">按周/月/季，单周期 ≤50 元</tspan></text><circle cx="358" cy="186" r="3.5" fill="#2563EB" /><text x="370" y="190" font-size="11.5"><tspan font-weight="600" fill="#374151">防盗版</tspan><tspan fill="#6B7280" dx="8">强，靠不交付明文</tspan></text><circle cx="358" cy="216" r="3.5" fill="#2563EB" /><text x="370" y="220" font-size="11.5"><tspan font-weight="600" fill="#374151">收入</tspan><tspan fill="#6B7280" dx="8">靠留存，不走就有复购</tspan></text><circle cx="358" cy="246" r="3.5" fill="#2563EB" /><text x="370" y="250" font-size="11.5"><tspan font-weight="600" fill="#374151">定位</tspan><tspan fill="#2563EB" dx="8" font-weight="600">主力款</tspan></text><rect x="28" y="300" width="604" height="82" rx="10" fill="#FFFFFF" filter="url(#sh)" /><rect x="28" y="300" width="4" height="82" rx="2" fill="#16A34A" /><text x="46" y="322" font-size="13" font-weight="700" fill="#111827">算术上的结论：买断当引流款，订阅当主力款</text><text x="46" y="345" font-size="11" fill="#6B7280">一次性收入天花板 = 本月曝光量（你控制不了）</text><text x="340" y="345" font-size="11" fill="#6B7280">复购收入天花板 = 用户留存（你可以控制）</text><line x1="330" y1="332" x2="330" y2="352" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" /><text x="46" y="369" font-size="10.5" fill="#EA580C" font-weight="600">⚠ 若 Skill 用的是你自己的 API key：买断等于给买家开无上限信用卡，只能走订阅</text></svg>