<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><filter id='shadow' x='-5%' y='-5%' width='110%' height='110%'><feDropShadow dx='0' dy='3' stdDeviation='4' flood-opacity='0.08'/></filter></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='35' text-anchor='middle' font-family='-apple-system, sans-serif' font-size='18' font-weight='bold' fill='#1E293B'>自然语言端到端测试的核心设计</text><g transform='translate(30, 60)'><rect width='260' height='310' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='260' height='36' rx='8' fill='#EFF6FF'/><text x='20' y='23' font-family='-apple-system, sans-serif' font-size='13' font-weight='bold' fill='#2563EB'>YAML 流程示例 (人话配置)</text><text x='20' y='55' font-family='monospace' font-size='11' fill='#475569'>steps:</text><text x='35' y='75' font-family='monospace' font-size='11' fill='#16A34A'>- module: ./log-in.yaml</text><text x='35' y='95' font-family='monospace' font-size='11' fill='#2563EB'>- act: 加购并结算</text><text x='35' y='115' font-family='monospace' font-size='11' fill='#16A34A'>- module: ./fill-info.yaml</text><text x='35' y='135' font-family='monospace' font-size='11' fill='#D97706'>- assert: 检查小计一致</text><text x='35' y='155' font-family='monospace' font-size='11' fill='#2563EB'>- click: 提交订单</text><rect x='20' y='175' width='220' height='110' rx='6' fill='#F8FAFC' stroke='#E2E8F0'/><text x='35' y='198' font-family='-apple-system, sans-serif' font-size='12' font-weight='bold' fill='#334155'>AI 真实浏览器执行</text><text x='35' y='220' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>• 替代传统选择器脚本</text><text x='35' y='240' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>• 失败自动捕获截图/trace</text><text x='35' y='260' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>• 智能分类错误原因</text></g><g transform='translate(320, 60)'><rect width='310' height='92' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='30' cy='46' r='18' fill='#EFF6FF'/><text x='30' y='51' text-anchor='middle' font-family='-apple-system, sans-serif' font-size='14' font-weight='bold' fill='#2563EB'>1</text><text x='65' y='35' font-family='-apple-system, sans-serif' font-size='13' font-weight='bold' fill='#1E293B'>Module 复用机制</text><text x='65' y='58' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>公共流程抽离（如登录），改一处则全</text><text x='65' y='74' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>部生效，降低维护成本。</text><rect x='310' y='169' width='310' height='92' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='30' cy='46' r='18' fill='#FDF4FF'/><text x='30' y='51' text-anchor='middle' font-family='-apple-system, sans-serif' font-size='14' font-weight='bold' fill='#9333EA'>2</text><text x='65' y='35' font-family='-apple-system, sans-serif' font-size='13' font-weight='bold' fill='#1E293B'>知识库与术语对齐</text><text x='65' y='58' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>定义业务同义词和预期行为，让 AI</text><text x='65' y='74' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>准确理解页面文案与业务逻辑。</text><rect x='310' y='278' width='310' height='92' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='30' cy='46' r='18' fill='#FFF7ED'/><text x='30' y='51' text-anchor='middle' font-family='-apple-system, sans-serif' font-size='14' font-weight='bold' fill='#EA580C'>3</text><text x='65' y='35' font-family='-apple-system, sans-serif' font-size='13' font-weight='bold' fill='#1E293B'>失败证据自动分级</text><text x='65' y='58' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>精准区分应用Bug、环境问题或测试不</text><text x='65' y='74' font-family='-apple-system, sans-serif' font-size='11' fill='#64748B'>稳定，秒级输出诊断报告。</text></g></svg>