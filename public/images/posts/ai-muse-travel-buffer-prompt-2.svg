<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Muse 日历扫描规则配置步骤</text><g transform="translate(40, 70)"><rect width="580" height="55" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="30" cy="27.5" r="16" fill="#2563EB"/><text x="30" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="65" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">绑定日历账号</text><text x="65" y="44" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">打开 Muse，进入设置 → 日历集成（Google/Apple/Outlook）</text></g><g transform="translate(40, 135)"><rect width="580" height="55" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="30" cy="27.5" r="16" fill="#2563EB"/><text x="30" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="65" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">创建 Agent</text><text x="65" y="44" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">新建 Agent 并命名为「旅行时间管家」</text></g><g transform="translate(40, 200)"><rect width="580" height="55" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="30" cy="27.5" r="16" fill="#2563EB"/><text x="30" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="65" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">配置提示词与触发器</text><text x="65" y="44" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">粘贴扫描规则提示词，设置工作日 07:00 自动执行</text></g><g transform="translate(40, 265)"><rect width="580" height="55" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="30" cy="27.5" r="16" fill="#16A34A"/><text x="30" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><text x="65" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">保存并测试</text><text x="65" y="44" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">保存配置，点击「立即扫描」测试运行效果</text></g><g transform="translate(40, 335)"><rect width="580" height="45" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><text x="310" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">✨ 完成配置，自动处理会议日程，免去手动计算</text></g></svg>