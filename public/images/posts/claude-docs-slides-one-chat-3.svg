<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 660 400'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><g transform='translate(40, 40)'><rect width='580' height='320' rx='8' fill='#FFFFFF' filter='drop-shadow(0px 4px 6px rgba(0,0,0,0.05))'/><text x='30' y='40' font-family='-apple-system, "Segoe UI", sans-serif' font-size='18' font-weight='bold' fill='#1E293B'>Claude 全流程自动化周报与幻灯片</text><g transform='translate(30, 70)'><rect width='100' height='80' rx='8' fill='#EFF6FF' stroke='#2563EB' stroke-width='1.5'/><text x='50' y='35' font-family='-apple-system, "Segoe UI", sans-serif' font-size='13' font-weight='bold' fill='#2563EB' text-anchor='middle'>1. 准备素材</text><text x='50' y='55' font-family='-apple-system, "Segoe UI", sans-serif' font-size='11' fill='#64748B' text-anchor='middle'>数据与往期</text></g><line x1='130' y1='110' x2='160' y2='110' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4'/><g transform='translate(160, 70)'><rect width='100' height='80' rx='8' fill='#F0FDF4' stroke='#16A34A' stroke-width='1.5'/><text x='50' y='35' font-family='-apple-system, "Segoe UI", sans-serif' font-size='13' font-weight='bold' fill='#16A34A' text-anchor='middle'>2. 生成 Docs</text><text x='50' y='55' font-family='-apple-system, "Segoe UI", sans-serif' font-size='11' fill='#64748B' text-anchor='middle'>智能起草审阅</text></g><line x1='260' y1='110' x2='290' y2='110' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4'/><g transform='translate(290, 70)'><rect width='100' height='80' rx='8' fill='#FAF5FF' stroke='#9333EA' stroke-width='1.5'/><text x='50' y='35' font-family='-apple-system, "Segoe UI", sans-serif' font-size='13' font-weight='bold' fill='#9333EA' text-anchor='middle'>3. 转换 Slides</text><text x='50' y='55' font-family='-apple-system, "Segoe UI", sans-serif' font-size='11' fill='#64748B' text-anchor='middle'>PPT 逻辑跟随</text></g><line x1='390' y1='110' x2='420' y2='110' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4'/><g transform='translate(420, 70)'><rect width='100' height='80' rx='8' fill='#FFF7ED' stroke='#EA580C' stroke-width='1.5'/><text x='50' y='35' font-family='-apple-system, "Segoe UI", sans-serif' font-size='13' font-weight='bold' fill='#EA580C' text-anchor='middle'>4. 移动端审阅</text><text x='50' y='55' font-family='-apple-system, "Segoe UI", sans-serif' font-size='11' fill='#64748B' text-anchor='middle'>随时随地调整</text></g><g transform='translate(30, 180)'><rect width='520' height='90' rx='8' fill='#FEFCE8' stroke='#D97706' stroke-width='1.5'/><text x='20' y='30' font-family='-apple-system, "Segoe UI", sans-serif' font-size='14' font-weight='bold' fill='#D97706'>5. 设置每周自动跑（核心闭环）</text><text x='20' y='55' font-family='-apple-system, "Segoe UI", sans-serif' font-size='12' fill='#475569'>• 设定定时任务：每周一 9:00 自动拉取数据并生成草稿</text><text x='20' y='75' font-family='-apple-system, "Segoe UI", sans-serif' font-size='12' fill='#475569'>• 保持人工确认节点，一键导出 PowerPoint 或 PDF</text></g></g></svg>