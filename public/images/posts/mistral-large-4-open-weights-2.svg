<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><style> .bg { fill: #FAFAFA; rx: 12px; } .card { fill: #FFFFFF; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); rx: 8px; } .title { font-family: -apple-system, 'Segoe UI', sans-serif; font-weight: bold; font-size: 16px; } .sub { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4B5563; } .tag { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; } </style><rect width='660' height='400' class='bg'/><text x='330' y='40' text-anchor='middle' class='title' font-size='20' fill='#1F2937'>模型安全策略的分野：闭源 vs 开源</text><rect x='40' y='70' width='270' height='280' class='card'/><path d='M 40 70 h 270 v 50 h -270 z' fill='#FEF2F2' rx='8'/><text x='175' y='102' text-anchor='middle' class='tag' fill='#DC2626'>闭源 API 模型（一刀切）</text><text x='65' y='150' class='sub'>• 行为防御与攻击无法区分</text><text x='65' y='180' class='sub'>• 遇到漏洞复现：直接拒答</text><text x='65' y='210' class='sub'>• 拒绝率高，无法自主申诉</text><text x='65' y='240' class='sub'>• 风险：随时面临断供或封号</text><rect x='65' y='275' width='220' height='45' fill='#FEE2E2' rx='6'/><text x='175' y='302' text-anchor='middle' class='tag' fill='#B91C1C'>结果：半夜事故无法协助</text><rect x='350' y='70' width='270' height='280' class='card'/><path d='M 350 70 h 270 v 50 h -270 z' fill='#F0FDF4' rx='8'/><text x='485' y='102' text-anchor='middle' class='tag' fill='#16A34A'>开源权重模型（精细化）</text><text x='375' y='150' class='sub'>• 恶意提示：严格拒答</text><text x='375' y='180' class='sub'>• 漏洞修复：愿意干活 (82%)</text><text x='375' y='210' class='sub'>• 策略可自主接管、修改</text><text x='375' y='240' class='sub'>• 风险：权重在手，心里不慌</text><rect x='375' y='275' width='220' height='45' fill='#DCFCE7' rx='6'/><text x='485' y='302' text-anchor='middle' class='tag' fill='#15803D'>结果：自主掌控，安全可靠</text></svg>