<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><filter id='shadow' x='-5%' y='-5%' width='110%' height='110%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000' flood-opacity='0.06'/></filter></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='40' font-family='-apple-system, sans-serif' font-size='20' font-weight='bold' fill='#1E293B' text-anchor='middle'>断网后，编码代理能干什么？</text><g transform='translate(40, 75)'><rect width='270' height='275' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='270' height='45' rx='8' fill='#16A34A'/><text x='135' y='27' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>✔ 硬盘上有（能干）</text><g font-family='-apple-system, sans-serif' font-size='13' fill='#334155' transform='translate(20, 25)'><circle cx='10' cy='40' r='4' fill='#16A34A'/><text x='25' y='45'>解释未知函数/理清调用链</text><circle cx='10' cy='85' r='4' fill='#16A34A'/><text x='25' y='90'>定位失败测试并修复代码</text><circle cx='10' cy='130' r='4' fill='#16A34A'/><text x='25' y='135'>小范围重构（拆函数/改名）</text><circle cx='10' cy='175' r='4' fill='#16A34A'/><text x='25' y='180'>补全功能骨架并跑通</text></g></g><g transform='translate(350, 75)'><rect width='270' height='275' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><rect x='0' y='0' width='270' height='45' rx='8' fill='#EA580C'/><text x='135' y='27' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>✖ 依赖外部（不能干）</text><g font-family='-apple-system, sans-serif' font-size='13' fill='#334155' transform='translate(20, 25)'><circle cx='10' cy='40' r='4' fill='#EA580C'/><text x='25' y='45'>安装全新项目依赖</text><circle cx='10' cy='85' r='4' fill='#EA580C'/><text x='25' y='90'>查阅第三方库最新文档</text><circle cx='10' cy='130' r='4' fill='#EA580C'/><text x='25' y='135'>翻阅 GitHub issue 寻求方案</text><circle cx='10' cy='175' r='4' fill='#EA580C'/><text x='25' y='180'>调用外部网络 API/服务</text></g></g><text x='330' y='375' font-family='-apple-system, sans-serif' font-size='12' fill='#64748B' text-anchor='middle'>核心结论：离线能力的天花板，是由硬盘上的知识决定的，而不是参数量</text></svg>