<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 660 400'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='40' font-size='20' font-weight='bold' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#1E293B' text-anchor='middle'>Claude 协同生成周报与 PPT 流程</text><g transform='translate(40, 70)'><rect width='160' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0'/><path d='M20 20 h60 v12 h-60 z' fill='#2563EB' opacity='0.2'/><text x='20' y='55' font-size='14' font-weight='bold' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#2563EB'>1. 输入统一指令</text><text x='20' y='75' font-size='12' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#64748B'>背景 + 周报 + PPT</text></g><g transform='translate(250, 70)'><rect width='160' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0'/><path d='M20 20 h60 v12 h-60 z' fill='#EA580C' opacity='0.2'/><text x='20' y='55' font-size='14' font-weight='bold' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#EA580C'>2. 智能生成周报</text><text x='20' y='75' font-size='12' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#64748B'>结构化数据与摘要</text></g><g transform='translate(460, 70)'><rect width='160' height='100' rx='8' fill='#FFFFFF' stroke='#E2E8F0'/><path d='M20 20 h60 v12 h-60 z' fill='#16A34A' opacity='0.2'/><text x='20' y='55' font-size='14' font-weight='bold' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#16A34A'>3. 衍生幻灯片</text><text x='20' y='75' font-size='12' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#64748B'>内容一致的 5 页 Slides</text></g><path d='M200 120 L250 120' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4 4'/><path d='M410 120 L460 120' stroke='#94A3B8' stroke-width='2' stroke-dasharray='4 4'/><g transform='translate(40, 200)'><rect width='580' height='150' rx='8' fill='#FFFFFF' stroke='#E2E8F0'/><text x='30' y='35' font-size='15' font-weight='bold' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#9333EA'>关键信号与核心技巧</text><circle cx='40' cy='65' r='5' fill='#2563EB'/><text x='60' y='70' font-size='13' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#334155'>设定明确背景与领导关心指标，构建稳定的语气上下文</text><circle cx='40' cy='95' r='5' fill='#EA580C'/><text x='60' y='100' font-size='13' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#334155'>拆解为清晰的子任务（1/2步骤），避免任务混淆</text><circle cx='40' cy='125' r='5' fill='#16A34A'/><text x='60' y='130' font-size='13' font-family='-apple-system, &apos;Segoe UI&apos;, sans-serif' fill='#334155'>强调 Slides 内容必须完全来自已生成的周报</text></g></svg>