<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" style="background:#FAFAFA; border-radius:12px; font-family:-apple-system, 'Segoe UI', sans-serif;">
  <!-- 背景卡片 -->
  <rect x="30" y="30" width="280" height="340" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
  <rect x="350" y="30" width="280" height="340" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />

  <!-- 左侧：意向清单 (pyproject.toml) -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#EFF6FF" />
    <text x="20" y="30" fill="#1E40AF" font-size="16" font-weight="bold">pyproject.toml</text>
    <text x="20" y="75" fill="#374151" font-size="14" font-weight="bold">装修意向清单</text>
    <text x="20" y="105" fill="#6B7280" font-size="13">• 只要大类和需求</text>
    <text x="20" y="135" fill="#6B7280" font-size="13">• 不限定具体版本</text>
    
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="200" height="120" rx="6" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="15" y="30" fill="#2563EB" font-size="12" font-weight="bold">特点：灵活、动态</text>
      <text x="15" y="60" fill="#4B5563" font-size="12">每次重新解析依赖</text>
      <text x="15" y="85" fill="#4B5563" font-size="12">自动适配最新环境</text>
    </g>
  </g>

  <!-- 右侧：采购单/牢笼 (uv.lock) -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#FEF2F2" />
    <text x="20" y="30" fill="#991B1B" font-size="16" font-weight="bold">uv.lock (锁文件)</text>
    <text x="20" y="75" fill="#374151" font-size="14" font-weight="bold">精确采购单 / 牢笼</text>
    <text x="20" y="105" fill="#6B7280" font-size="13">• 钉死精确版本</text>
    <text x="20" y="135" fill="#6B7280" font-size="13">• 保证完全可复现</text>

    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="200" height="120" rx="6" fill="#FFFBEB" stroke="#FDE68A" />
      <text x="15" y="30" fill="#D97706" font-size="12" font-weight="bold">⚠️ 痛点：版本冲突</text>
      <text x="15" y="60" fill="#4B5563" font-size="12">Python 升级后失效</text>
      <text x="15" y="85" fill="#4B5563" font-size="12">重复尝试源码编译报错</text>
    </g>
  </g>

  <!-- 底部提示 -->
  <text x="330" y="15" fill="#9CA3AF" font-size="12" text-anchor="middle">依赖管理机制解析</text>
</svg>