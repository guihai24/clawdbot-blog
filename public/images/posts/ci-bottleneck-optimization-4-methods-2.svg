<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="40" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">基础设施与工具链性能优化方案</text><text x="40" y="68" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">三步落地高性能 CI/CD 流水线</text><rect x="40" y="88" width="580" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><text x="60" y="118" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1D4ED8">💡 团队实测效果：CI 耗时从 2m40s 缩减至 1m20s，提速 50%+</text><g transform="translate(40, 150)"><rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="30" r="16" fill="#2563EB" /><text x="30" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="60" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">升级跑者配置</text><text x="20" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569"><tspan x="20" dy="0">• 选择更高性能的</tspan><tspan x="20" dy="20">  CPU 与存储实例</tspan><tspan x="20" dy="20">• AWS EC2 或</tspan><tspan x="20" dy="20">  DigitalOcean 高配</tspan></text></g><path d="M 230 250 L 245 250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" /><polygon points="245,247 251,250 245,253" fill="#94A3B8" /><g transform="translate(240, 150)"><rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="30" r="16" fill="#EA580C" /><text x="30" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="60" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">开启缓存机制</text><text x="20" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569"><tspan x="20" dy="0">• 持久化存储依赖</tspan><tspan x="20" dy="20">• 缓存 node_modules</tspan><tspan x="20" dy="20">• 加快构建速度</tspan><tspan x="20" dy="20">  避免重复下载</tspan></text></g><path d="M 430 250 L 445 250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" /><polygon points="445,247 451,250 445,253" fill="#94A3B8" /><g transform="translate(440, 150)"><rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="30" r="16" fill="#16A34A" /><text x="30" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="60" y="35" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">自托管 Runner</text><text x="20" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569"><tspan x="20" dy="0">• 迁移至自托管</tspan><tspan x="20" dy="20">  runner 池</tspan><tspan x="20" dy="20">• 摆脱公有资源限制</tspan><tspan x="20" dy="20">• 显著提升并发效率</tspan></text></g></svg>