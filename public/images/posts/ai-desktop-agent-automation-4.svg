<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="40" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937">Agent 权限分档与安全边界</text><g transform="translate(40, 70)"><rect x="0" y="0" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="35" cy="32" r="16" fill="#EFF6FF"/><text x="35" y="37" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text><text x="70" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937">只读任务</text><text x="70" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">查看文件、提取信息、生成报告 (允许读取，禁止写入)</text><rect x="480" y="20" width="80" height="25" rx="4" fill="#EFF6FF"/><text x="520" y="36" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#2563EB" text-anchor="middle">安全</text></g><g transform="translate(40, 145)"><rect x="0" y="0" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="35" cy="32" r="16" fill="#F0FDF4"/><text x="35" y="37" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">2</text><text x="70" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937">可恢复写入</text><text x="70" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">复制文件、整理测试目录、生成新文件 (限副本或指定目录)</text><rect x="480" y="20" width="80" height="25" rx="4" fill="#F0FDF4"/><text x="520" y="36" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#16A34A" text-anchor="middle">受控</text></g><g transform="translate(40, 220)"><rect x="0" y="0" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="35" cy="32" r="16" fill="#FEF3C7"/><text x="35" y="37" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">3</text><text x="70" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937">外部提交</text><text x="70" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">填表不提交、生成不发布 (保存前暂停并等待人工确认)</text><rect x="480" y="20" width="80" height="25" rx="4" fill="#FEF3C7"/><text x="520" y="36" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#D97706" text-anchor="middle">需确认</text></g><g transform="translate(40, 295)"><rect x="0" y="0" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="35" cy="32" r="16" fill="#FEF2F2"/><text x="35" y="37" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">4</text><text x="70" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937">不可逆动作</text><text x="70" y="48" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">删除、发送、发布、付款 (不自动授权，人工完成)</text><rect x="480" y="20" width="80" height="25" rx="4" fill="#FEF2F2"/><text x="520" y="36" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#DC2626" text-anchor="middle">禁止自动</text></g></svg>