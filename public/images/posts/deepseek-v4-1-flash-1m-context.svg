<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" style="background-color: #FAFAFA; border-radius: 12px;"><style>.title { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; fill: #1E293B; }.label { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }.subtext { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 11px; fill: #64748B; }.card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03)); }.badge-blue { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1; rx: 4px; }.badge-green { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1; rx: 4px; }.badge-orange { fill: #FFF7ED; stroke: #EA580C; stroke-width: 1; rx: 4px; }.badge-purple { fill: #FAF5FF; stroke: #9333EA; stroke-width: 1; rx: 4px; }</style><text x="330" y="35" text-anchor="middle" class="title">DeepSeek-V4.1-Flash 开发者核心优化图解</text><rect x="30" y="60" width="280" height="145" class="card" /><rect x="45" y="75" width="90" height="22" class="badge-blue" /><text x="90" y="90" text-anchor="middle" class="label" style="fill: #2563EB; font-size: 11px;">CED 架构</text><text x="45" y="120" class="label">Encoder (20层) + Decoder (20层)</text><text x="45" y="145" class="subtext">• Prefill 激活参数降至 8B</text><text x="45" y="165" class="subtext">• 大文件 Prompt 算力占用直接减半</text><text x="45" y="185" class="subtext">• 最后一层 Hidden State 算 Global KV</text><rect x="350" y="60" width="280" height="145" class="card" /><rect x="365" y="75" width="110" height="22" class="badge-green" /><text x="420" y="90" text-anchor="middle" class="label" style="fill: #16A34A; font-size: 11px;">FP4 KV + Replay</text><text x="365" y="120" class="label">FP4 量化与 DRAM 缓存池</text><text x="365" y="145" class="subtext">• 主 KV 体积约等于 FP8 的一半</text><text x="365" y="165" class="subtext">• 仅 890 bytes/token (V1的1/437)</text><text x="365" y="185" class="subtext">• Miss 时仅需有界回放 128 tokens</text><rect x="30" y="225" width="280" height="145" class="card" /><rect x="45" y="240" width="120" height="22" class="badge-orange" /><text x="105" y="255" text-anchor="middle" class="label" style="fill: #EA580C; font-size: 11px;">CSA2 + 跨层复用</text><text x="45" y="285" class="label">Full / Reindex / Reuse 模式</text><text x="45" y="310" class="subtext">• 分层复用 Main KV 与 Top-K 索引</text><text x="45" y="330" class="subtext">• 配合 Hierarchical Sparse Indexer</text><text x="45" y="350" class="subtext">• 解耦「层数 × 序列长度」显存计算</text><rect x="350" y="225" width="280" height="145" class="card" style="stroke: #9333EA; stroke-width: 1.5;" /><rect x="365" y="240" width="100" height="22" class="badge-purple" /><text x="415" y="255" text-anchor="middle" class="label" style="fill: #9333EA; font-size: 11px;">开发者落地收益</text><text x="365" y="285" class="label" style="fill: #9333EA;">平民化 1M Context 体验</text><text x="365" y="310" class="subtext">• MIT 开源协议 + 完整 API 支持</text><text x="365" y="330" class="subtext">• 兼容 vLLM / SGLang / Transformers</text><text x="365" y="350" class="subtext">• 个人及小团队硬件预算内可跑</text><path d="M 310 132 L 350 132" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" /><path d="M 170 205 L 170 225" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" /><path d="M 490 205 L 490 225" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" /><path d="M 310 297 L 350 297" stroke="#9333EA" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5" /></svg>