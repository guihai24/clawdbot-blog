<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="330" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">竞争单位：从「页面」变成「字段」</text>

  
  <rect x="36" y="66" width="278" height="282" rx="12" fill="#FFFFFF" stroke="#DBEAFE" filter="url(#sh)" />
  <rect x="115" y="84" width="120" height="32" rx="16" fill="#2563EB" />
  <text x="175" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SEO</text>

  <g font-size="12.5">
    <text x="56" y="156" fill="#94A3B8">争夺目标</text>
    <text x="130" y="156" fill="#1E293B" font-weight="600">排序位置</text>

    <text x="56" y="200" fill="#94A3B8">竞争单位</text>
    <text x="130" y="200" fill="#1E293B" font-weight="600">页面</text>

    <text x="56" y="244" fill="#94A3B8">内容被读</text>
    <text x="130" y="244" fill="#1E293B" font-weight="600">叙事顺序</text>

    <text x="56" y="288" fill="#94A3B8">用户行为</text>
    <text x="130" y="288" fill="#1E293B" font-weight="600">停留、被说服</text>
  </g>
  <line x1="56" y1="312" x2="294" y2="312" stroke="#E2E8F0" stroke-dasharray="4 4" />
  <text x="56" y="332" font-size="11.5" fill="#64748B">靠视觉、文案、品牌叙事取胜</text>

  
  <rect x="346" y="66" width="278" height="282" rx="12" fill="#FFFFFF" stroke="#FFEDD5" filter="url(#sh)" />
  <rect x="425" y="84" width="120" height="32" rx="16" fill="#EA580C" />
  <text x="485" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">B2A</text>

  <g font-size="12.5">
    <text x="366" y="156" fill="#94A3B8">争夺目标</text>
    <text x="440" y="156" fill="#1E293B" font-weight="600">候选记录</text>

    <text x="366" y="200" fill="#94A3B8">竞争单位</text>
    <text x="440" y="200" fill="#1E293B" font-weight="600">字段</text>

    <text x="366" y="244" fill="#94A3B8">内容被读</text>
    <text x="440" y="244" fill="#1E293B" font-weight="600">指定字段</text>

    <text x="366" y="288" fill="#94A3B8">Agent 行为</text>
    <text x="440" y="288" fill="#1E293B" font-weight="600">抽取、压成一行</text>
  </g>
  <line x1="366" y1="312" x2="604" y2="312" stroke="#E2E8F0" stroke-dasharray="4 4" />
  <text x="366" y="332" font-size="11.5" fill="#64748B">价格 / 规格 / 配送写清楚即可胜出</text>

  
  <line x1="330" y1="76" x2="330" y2="338" stroke="#CBD5E1" stroke-dasharray="5 6" />
  <circle cx="330" cy="207" r="15" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="330" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748B">vs</text>

  
  <rect x="36" y="360" width="588" height="30" rx="8" fill="#F0FDF4" stroke="#BBF7D0" />
  <text x="330" y="380" text-anchor="middle" font-size="12.5" fill="#15803D" font-weight="600">比的不再是谁更像品牌，而是谁更像一张可被引用的数据表</text>
</svg>