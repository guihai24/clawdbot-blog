<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><style> .bg { fill: #FAFAFA; rx: 12; } .card { fill: #FFFFFF; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); rx: 8; } .title { font-family: -apple-system, 'Segoe UI', sans-serif; font-weight: 700; font-size: 16px; } .desc { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4B5563; } .tag { font-family: -apple-system, 'Segoe UI', sans-serif; font-weight: 600; font-size: 12px; } </style><rect width='660' height='400' class='bg'/><text x='330' y='45' text-anchor='middle' class='title' font-size='20' fill='#1F2937'>E2E 测试维护痛点：传统选择器 vs AI 意图驱动</text><g transform='translate(40, 75)'><rect width='270' height='290' class='card'/><path d='M0 8a8 8 0 0 1 8-8h254a8 8 0 0 1 8 8v45H0V8z' fill='#FEF2F2'/><text x='20' y='36' class='title' fill='#DC2626'>传统选择器测试</text><g transform='translate(20, 75)'><circle cx='12' cy='12' r='6' fill='#EF4444'/><text x='30' y='16' class='desc'>依赖 #id / .class 绑定</text><circle cx='12' cy='52' r='6' fill='#EF4444'/><text x='30' y='56' class='desc'>UI 变动即导致测试崩溃</text><circle cx='12' cy='92' r='6' fill='#EF4444'/><text x='30' y='96' class='desc'>Loading / 动画易致超时</text><circle cx='12' cy='132' r='6' fill='#EF4444'/><text x='30' y='136' class='desc'>排查耗时：复盘 Trace 录像</text><rect x='0' y='170' width='230' height='32' rx='4' fill='#FEE2E2'/><text x='15' y='191' class='tag' fill='#B91C1C'>维护成本：极高（养不起）</text></g></g><g transform='translate(350, 75)'><rect width='270' height='290' class='card'/><path d='M0 8a8 8 0 0 1 8-8h254a8 8 0 0 1 8 8v45H0V8z' fill='#F0FDF4'/><text x='20' y='36' class='title' fill='#16A34A'>Momentic 意图测试</text><g transform='translate(20, 75)'><circle cx='12' cy='12' r='6' fill='#22C55E'/><text x='30' y='16' class='desc'>绑定真人操作“意图”</text><circle cx='12' cy='52' r='6' fill='#22C55E'/><text x='30' y='56' class='desc'>视觉识别，不惧组件重构</text><circle cx='12' cy='92' r='6' fill='#22C55E'/><text x='30' y='96' class='desc'>自动适应网络与慢接口</text><circle cx='12' cy='132' r='6' fill='#22C55E'/><text x='30' y='136' class='desc'>省时省力：告别脆弱断言</text><rect x='0' y='170' width='230' height='32' rx='4' fill='#DCFCE7'/><text x='15' y='191' class='tag' fill='#15803D'>维护成本：趋近于零</text></g></g></svg>