<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="45" font-size="22" font-weight="bold" text-anchor="middle" fill="#1E293B">死循环的两种结局：安静失败 vs 吵醒失败</text><rect x="45" y="80" width="265" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" /><text x="177.5" y="125" font-size="18" font-weight="bold" fill="#EA580C" text-anchor="middle">安静失败（静默陷阱）</text><text x="177.5" y="165" font-size="14" fill="#475569" text-anchor="middle">模型：Claude / DeepSeek / Gemini</text><text x="177.5" y="205" font-size="14" fill="#475569" text-anchor="middle">表现：运行5-6次后平稳退出</text><text x="177.5" y="245" font-size="14" fill="#475569" text-anchor="middle">结果：语气平静、格式规整</text><text x="177.5" y="295" font-size="15" fill="#DC2626" text-anchor="middle" font-weight="bold">隐患：以为任务完成，不报警！</text><rect x="350" y="80" width="265" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" /><text x="482.5" y="125" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">吵醒失败（显性失控）</text><text x="482.5" y="165" font-size="14" fill="#475569" text-anchor="middle">模型：Mistral / GPT / Grok</text><text x="482.5" y="205" font-size="14" fill="#475569" text-anchor="middle">表现：顶到 40 步上限 / 极高调用</text><text x="482.5" y="245" font-size="14" fill="#475569" text-anchor="middle">结果：账单刺眼、日志异常</text><text x="482.5" y="295" font-size="15" fill="#16A34A" text-anchor="middle" font-weight="bold">优势：账单和异常会叫醒你！</text></g></svg>