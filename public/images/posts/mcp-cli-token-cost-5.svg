eight="bold" fill="#C2410C">成本大幅削减</text><text x="90" y="225" text-anchor="middle" font-size="11" fill="#F97316">$0.05 -> $0.019</text></g><g transform="translate(450, 75)"><rect width="180" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><path d="M 90 20 L 90 50" stroke="#16A34A" stroke-width="2" stroke-dasharray="4" /><circle cx="90" cy="35" r="16" fill="#DCFCE7" /><text x="90" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#16A34A">3</text><text x="90" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Tool Search</text><text x="90" y="110" text-anchor="middle" font-size="12" fill="#4B5563">延迟加载工具定义</text><text x="90" y="135" text-anchor="middle" font-size="12" fill="#4B5563">适合长轮次复杂任务</text><rect x="20" y="180" width="140" height="60" rx="6" fill="#F0FDF4" /><text x="90" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803D">大模型效果极佳</text><text x="90" y="225" text-anchor="middle" font-size="11" fill="#22C55E">按需检索与匹配</text></g></g></svg>