<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><defs><filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000000' flood-opacity='0.06'/></filter></defs><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-family='-apple-system, sans-serif' font-size='20' font-weight='bold' fill='#1F2937' text-anchor='middle'>AI 视觉模型 → 3D 打印制造模型转换关卡</text><rect x='40' y='80' width='180' height='270' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><path d='M130 110 L130 150 M110 130 L150 130' stroke='#EA580C' stroke-width='4' stroke-linecap='round'/><circle cx='130' cy='130' r='35' fill='#FFF7ED'/><text x='130' y='190' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#EA580C' text-anchor='middle'>Kimi 产出模型</text><text x='130' y='220' font-family='-apple-system, sans-serif' font-size='13' fill='#4B5563' text-anchor='middle'>• 纯视觉外观</text><text x='130' y='245' font-family='-apple-system, sans-serif' font-size='13' fill='#4B5563' text-anchor='middle'>• 面片拼合</text><text x='130' y='270' font-family='-apple-system, sans-serif' font-size='13' fill='#4B5563' text-anchor='middle'>• 无壁厚/未封闭</text><line x1='220' y1='215' x2='255' y2='215' stroke='#9CA3AF' stroke-width='2' stroke-dasharray='4,4'/><polygon points='255,210 265,215 255,220' fill='#9CA3AF'/><rect x='275' y='80' width='345' height='120' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='305' cy='140' r='18' fill='#FEF2F2'/><text x='305' y='145' font-family='-apple-system, sans-serif' font-size='14' font-weight='bold' fill='#DC2626' text-anchor='middle'>1</text><text x='345' y='125' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#1F2937'>第一道坎：水密/流形 (Manifold)</text><text x='345' y='150' font-family='-apple-system, sans-serif' font-size='13' fill='#4B5563'>模型必须是完整封闭壳，无破洞、无重合面</text><text x='345' y='172' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>检查法线方向，确保外表面朝外</text><rect x='275' y='220' width='345' height='120' rx='8' fill='#FFFFFF' filter='url(#shadow)'/><circle cx='305' cy='280' r='18' fill='#FEF2F2'/><text x='305' y='285' font-family='-apple-system, sans-serif' font-size='14' font-weight='bold' fill='#DC2626' text-anchor='middle'>2</text><text x='345' y='265' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#1F2937'>第二道坎：壁厚 (Solidify)</text><text x='345' y='290' font-family='-apple-system, sans-serif' font-size='13' fill='#4B5563'>使用 Blender 加厚工具生成实体</text><text x='345' y='312' font-family='-apple-system, sans-serif' font-size='12' fill='#6B7280'>桌面级 FDM 打印一般需 1.2mm 以上</text></svg>