<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" fill="#FAFAFA" rx="12"/><text x="330" y="36" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">1M 上下文落地策略：应用场景与硬件选择</text><rect x="30" y="65" width="285" height="305" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1.5" style="filter:drop-shadow(0px 2px 4px rgba(0,0,0,0.03))"/><rect x="30" y="65" width="285" height="36" fill="#2563EB" rx="10"/><rect x="30" y="91" width="285" height="10" fill="#2563EB"/><text x="172" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">场景策略：按需全开 vs 缓存分块</text><rect x="45" y="115" width="255" height="70" fill="#EFF6FF" rx="8" stroke="#BFDBFE" stroke-width="1"/><text x="57" y="137" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">法务/长文档分析</text><text x="57" y="156" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#3B82F6">· 策略：单次 1M Prefill 吞整本</text><text x="57" y="172" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#3B82F6">· 模式：后续在 Decode 窗口中滚动</text><rect x="45" y="195" width="255" height="70" fill="#F0FDF4" rx="8" stroke="#BBF7D0" stroke-width="1"/><text x="57" y="217" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#166534">代码库助手 / QA 知识库</text><text x="57" y="236" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16A34A">· 策略：日常 128K~256K 配合缓存</text><text x="57" y="252" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16A34A">· 模式：按需加载模块，精细化建模</text><rect x="45" y="275" width="255" height="80" fill="#FEF3C7" rx="8" stroke="#FDE68A" stroke-width="1"/><text x="57" y="297" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#92400E">核心建议 (独立开发者/小团队)</text><text x="57" y="318" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#D97706">不必追求全员 1M，优先用 256K/512K</text><text x="57" y="334" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#D97706">保证同一个模型在必要时可拉长即可</text><rect x="345" y="65" width="285" height="305" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1.5" style="filter:drop-shadow(0px 2px 4px rgba(0,0,0,0.03))"/><rect x="345" y="65" width="285" height="36" fill="#EA580C" rx="10"/><rect x="345" y="91" width="285" height="10" fill="#EA580C"/><text x="487" y="88" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">硬件门槛：显存与卡数评估</text><rect x="360" y="115" width="255" height="110" fill="#FFF7ED" rx="8" stroke="#FFEDD5" stroke-width="1"/><text x="372" y="137" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#C2410C">实验 / Demo 级配置</text><text x="372" y="158" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#EA580C">· 硬件：4×48GB A6000 或 4×40GB A100</text><text x="372" y="176" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#EA580C">· 能力：1M Prefill + 低并发 Decode</text><text x="372" y="194" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#EA580C">· 特点：Batch Size 较小，适合验证</text><rect x="360" y="235" width="255" height="120" fill="#FAF5FF" rx="8" stroke="#E9D5FF" stroke-width="1"/><text x="372" y="257" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#6B21A8">生产 / 内部工具级配置</text><text x="372" y="278" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9333EA">· 硬件：8×80GB H100 或 8×80GB A100</text><text x="372" y="296" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9333EA">· 能力：支持有限并发的长上下文服务</text><text x="372" y="314" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9333EA">· 优化：FP4 KV + MoE 激活优化 (8B/16B)</text><line x1="315" y1="217" x2="345" y2="217" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/></svg>