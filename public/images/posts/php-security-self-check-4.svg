<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/></filter></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">老网站安全假象与 PHP2Shell 风险</text><rect x="45" y="80" width="255" height="270" rx="12" fill="#FFFFFF" filter="url(#shadow)"/><rect x="45" y="80" width="255" height="6" fill="#16A34A"/><text x="75" y="120" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1F2937">表面现象 (假象)</text><circle cx="70" cy="160" r="4" fill="#16A34A"/><text x="90" y="165" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">运行十几年没出过事</text><circle cx="70" cy="200" r="4" fill="#16A34A"/><text x="90" y="205" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">前台访问、订单正常</text><circle cx="70" cy="240" r="4" fill="#16A34A"/><text x="90" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">后台无人维护与修改</text><circle cx="70" cy="280" r="4" fill="#16A34A"/><text x="90" y="285" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">站长主观感觉很安全</text><rect x="360" y="80" width="255" height="270" rx="12" fill="#FFFFFF" filter="url(#shadow)"/><rect x="360" y="80" width="255" height="6" fill="#EA580C"/><text x="390" y="120" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1F2937">底层危机 (现实)</text><circle cx="385" cy="160" r="4" fill="#EA580C"/><text x="405" y="165" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">PHP 引擎底层存在缺陷</text><circle cx="385" cy="200" r="4" fill="#EA580C"/><text x="405" y="205" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">PHP2Shell 切入点隐蔽</text><circle cx="385" cy="240" r="4" fill="#EA580C"/><text x="405" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">AI 时代攻击成本大幅下降</text><circle cx="385" cy="280" r="4" fill="#EA580C"/><text x="405" y="285" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4B5563">缺乏版本与补丁验证机制</text><path d="M310 215 L350 215" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4"/><circle cx="330" cy="215" r="12" fill="#FEF3C7"/><text x="330" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#D97706" text-anchor="middle">VS</text></svg>