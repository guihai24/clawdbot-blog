<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><rect width='660' height='400' rx='12' fill='#FAFAFA'/><g transform='translate(40, 40)'><rect x='0' y='30' width='160' height='120' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='2'/><text x='80' y='75' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#1E293B' text-anchor='middle'>老旧 PHP 网站</text><text x='80' y='105' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B' text-anchor='middle'>长期无人维护</text><text x='80' y='125' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B' text-anchor='middle'>版本停滞不前</text><path d='M160 90 L230 90' stroke='#EA580C' stroke-width='3' stroke-dasharray='6,6'/><polygon points='230,85 240,90 230,95' fill='#EA580C'/><rect x='240' y='10' width='180' height='160' rx='8' fill='#FFFFFF' stroke='#EF4444' stroke-width='2'/><text x='330' y='50' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#DC2626' text-anchor='middle'>PHP2Shell 缺陷</text><text x='330' y='85' font-family='-apple-system, sans-serif' font-size='13' fill='#475569' text-anchor='middle'>底层引擎逻辑漏洞</text><text x='330' y='110' font-family='-apple-system, sans-serif' font-size='13' fill='#475569' text-anchor='middle'>AI 加速漏洞挖掘</text><text x='330' y='135' font-family='-apple-system, sans-serif' font-size='13' fill='#475569' text-anchor='middle'>攻击成本大幅降低</text><path d='M420 90 L490 90' stroke='#2563EB' stroke-width='3' stroke-dasharray='6,6'/><polygon points='490,85 500,90 490,95' fill='#2563EB'/><rect x='500' y='30' width='100' height='120' rx='8' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='2'/><text x='550' y='75' font-family='-apple-system, sans-serif' font-size='16' font-weight='bold' fill='#1E293B' text-anchor='middle'>高危暴露</text><text x='550' y='105' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B' text-anchor='middle'>静默运行中</text><text x='550' y='125' font-family='-apple-system, sans-serif' font-size='13' fill='#64748B' text-anchor='middle'>随时被攻破</text><rect x='0' y='230' width='600' height='110' rx='8' fill='#F1F5F9'/><text x='300' y='265' font-family='-apple-system, sans-serif' font-size='15' font-weight='bold' fill='#0F172A' text-anchor='middle'>安全警示：没出事 ≠ 很安全</text><text x='300' y='295' font-family='-apple-system, sans-serif' font-size='13' fill='#475569' text-anchor='middle'>环境陈旧的网站面对新一代安全威胁时，往往缺乏基本的抵抗能力。</text></g></svg>