<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="sh" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" /></filter></defs><rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1E293B">你描述的是印象，AI 需要的是决策</text><text x="56" y="76" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B">你以为在描述</text><text x="386" y="76" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2563EB">AI 真正需要知道的</text><g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12"><rect x="40" y="96" width="250" height="30" rx="8" fill="#FFFFFF" filter="url(#sh)" /><text x="56" y="115" fill="#475569">语气像朋友</text><rect x="40" y="134" width="250" height="30" rx="8" fill="#FFFFFF" filter="url(#sh)" /><text x="56" y="153" fill="#475569">不要太长</text><rect x="40" y="172" width="250" height="30" rx="8" fill="#FFFFFF" filter="url(#sh)" /><text x="56" y="191" fill="#475569">有个人观点</text><rect x="40" y="210" width="250" height="30" rx="8" fill="#FFFFFF" filter="url(#sh)" /><text x="56" y="229" fill="#475569">少点 AI 味</text><rect x="40" y="248" width="250" height="30" rx="8" fill="#FFFFFF" filter="url(#sh)" /><text x="56" y="267" fill="#475569">写得像我</text><rect x="370" y="96" width="250" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" /><text x="386" y="115" fill="#1D4ED8">何时可以吐槽，何时必须收住</text><rect x="370" y="134" width="250" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" /><text x="386" y="153" fill="#1D4ED8">每段几句，哪里该留白</text><rect x="370" y="172" width="250" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" /><text x="386" y="191" fill="#1D4ED8">哪敢下判断，哪承认不确定</text><rect x="370" y="210" width="250" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" /><text x="386" y="229" fill="#1D4ED8">哪些套话与转折必须禁用</text><rect x="370" y="248" width="250" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" /><text x="386" y="267" fill="#1D4ED8">先写什么，后写什么</text></g><g stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3"><line x1="296" y1="111" x2="356" y2="111" /><line x1="296" y1="149" x2="356" y2="149" /><line x1="296" y1="187" x2="356" y2="187" /><line x1="296" y1="225" x2="356" y2="225" /><line x1="296" y1="263" x2="356" y2="263" /></g><g fill="#94A3B8"><polygon points="356,106 356,116 364,111" /><polygon points="356,144 356,154 364,149" /><polygon points="356,182 356,192 364,187" /><polygon points="356,220 356,230 364,225" /><polygon points="356,258 356,268 364,263" /></g><rect x="40" y="300" width="580" height="60" rx="10" fill="#FFF7ED" stroke="#FED7AA" /><text x="330" y="327" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#9A3412">风格提示词只能规定边界，不能复制判断力</text><text x="330" y="347" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#C2410C">旧文里藏着你没意识到、却反复坚持过的规则</text></svg>