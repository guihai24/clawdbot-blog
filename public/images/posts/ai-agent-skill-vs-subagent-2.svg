<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#FAFAFA" rx="12"/>
  
  <!-- 标题 -->
  <text x="330" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1F2937">Skills vs SubAgents：核心概念对比</text>
  
  <!-- Agent Loop 中心卡片 -->
  <rect x="210" y="60" width="240" height="70" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="85" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2563EB">Agent Loop</text>
  <text x="330" y="105" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280">理解 → 决策 → 调用 → 循环</text>
  
  <!-- Skill 卡片 -->
  <rect x="30" y="170" width="190" height="110" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#16A34A" stroke-width="2"/>
  <rect x="30" y="170" width="190" height="32" rx="12" fill="#16A34A"/>
  <rect x="30" y="186" width="190" height="16" fill="#16A34A"/>
  <text x="125" y="191" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Skill（技能）</text>
  <text x="45" y="218" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 结构化文字 + 示例</text>
  <text x="45" y="236" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 加载到主 Agent 上下文</text>
  <text x="45" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 单 Agent 内运行</text>
  
  <!-- SubAgent 卡片 -->
  <rect x="440" y="170" width="190" height="110" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#9333EA" stroke-width="2"/>
  <rect x="440" y="170" width="190" height="32" rx="12" fill="#9333EA"/>
  <rect x="440" y="186" width="190" height="16" fill="#9333EA"/>
  <text x="535" y="191" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">SubAgent（子智能体）</text>
  <text x="455" y="218" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 独立 Agent，完整 loop</text>
  <text x="455" y="236" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 有自己的上下文和工具</text>
  <text x="455" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#374151">• 通过工具调用触发</text>
  
  <!-- Handoff 箭头 -->
  <path d="M 220 225 Q 330 250 440 225" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text x="330" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EA580C">Handoff 交接</text>
  
  <!-- 连线：Skill 到 Agent Loop -->
  <line x1="120" y1="170" x2="260" y2="130" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 连线：SubAgent 到 Agent Loop -->
  <line x1="540" y1="170" x2="400" y2="130" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- 底部建议卡片 -->
  <rect x="100" y="310" width="460" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="120" y="334" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#92400E">💡 Anthropic 建议</text>
  <text x="120" y="354" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#78350F">连续对话内尽量用 Skill，避免 Handoff；让知识留在同一 Agent 上下文</text>
  
</svg>