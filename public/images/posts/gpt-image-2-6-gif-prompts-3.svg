<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">动图制作省钱与优化顺序</text><g transform="translate(40, 75)"><rect width="580" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="45" cy="40" r="20" fill="#2563EB"/><text x="45" y="46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="85" y="33" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">先写死帧数</text><text x="85" y="57" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">帧数越少越稳，减少生成失败概率</text></g><path d="M 330 155 L 330 185" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(40, 185)"><rect width="580" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="45" cy="40" r="20" fill="#EA580C"/><text x="45" y="46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="85" y="33" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">定死首尾姿态</text><text x="85" y="57" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">确保首尾衔接，明确最后一帧落点</text></g><path d="M 330 265 L 330 295" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(40, 295)"><rect width="580" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="45" cy="40" r="20" fill="#16A34A"/><text x="45" y="46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="85" y="33" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">最后调风格词</text><text x="85" y="57" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">风格词放最后，避免全局重做</text></g></svg>