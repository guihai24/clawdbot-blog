<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/></marker></defs><g transform="translate(30, 160)" filter="url(#shadow)"><rect width="130" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect width="130" height="6" rx="3" fill="#2563EB"/><text x="65" y="38" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">客户端请求</text><text x="65" y="58" fill="#64748B" font-size="11" text-anchor="middle">统一模型 ID</text></g><g transform="translate(240, 150)" filter="url(#shadow)"><rect width="140" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect width="140" height="6" rx="3" fill="#9333EA"/><text x="70" y="35" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">OpenRouter</text><text x="70" y="55" fill="#9333EA" font-size="12" font-weight="500" text-anchor="middle">动态路由层</text><text x="70" y="78" fill="#94A3B8" font-size="10" text-anchor="middle">随机/负载均衡分发</text></g><path d="M 160 200 L 230 200" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><g transform="translate(470, 40)" filter="url(#shadow)"><rect width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect width="160" height="6" rx="3" fill="#16A34A"/><text x="80" y="30" fill="#1E293B" font-size="13" font-weight="600" text-anchor="middle">提供商 A</text><text x="80" y="50" fill="#475569" font-size="11" text-anchor="middle">默认参数 + 截断 Prompt</text><rect x="20" y="62" width="120" height="18" rx="4" fill="#DCFCE7"/><text x="80" y="75" fill="#15803D" font-size="10" font-weight="500" text-anchor="middle">输出：精简/严格</text></g><g transform="translate(470, 155)" filter="url(#shadow)"><rect width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect width="160" height="6" rx="3" fill="#EA580C"/><text x="80" y="30" fill="#1E293B" font-size="13" font-weight="600" text-anchor="middle">提供商 B</text><text x="80" y="50" fill="#475569" font-size="11" text-anchor="middle">注入系统指令 + 调整温度</text><rect x="20" y="62" width="120" height="18" rx="4" fill="#FFEDD5"/><text x="80" y="75" fill="#C2410C" font-size="10" font-weight="500" text-anchor="middle">输出：发散/详细</text></g><g transform="translate(470, 270)" filter="url(#shadow)"><rect width="160" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect width="160" height="6" rx="3" fill="#D97706"/><text x="80" y="30" fill="#1E293B" font-size="13" font-weight="600" text-anchor="middle">提供商 C</text><text x="80" y="50" fill="#475569" font-size="11" text-anchor="middle">特定推理参数/无 Vision</text><rect x="20" y="62" width="120" height="18" rx="4" fill="#FEF3C7"/><text x="80" y="75" fill="#B45309" font-size="10" font-weight="500" text-anchor="middle">输出：功能受限/异化</text></g><path d="M 380 180 Q 425 85 458 85" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M 380 200 L 458 200" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M 380 220 Q 425 315 458 315" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></svg>