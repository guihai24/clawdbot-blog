<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">授权之前，先过这三道检查</text><g transform="translate(40, 70)"><rect width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="85" cy="45" r="20" fill="#E0F2FE"/><text x="85" y="52" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text><text x="85" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">只连一张卡</text><text x="20" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563"><tspan x="20" dy="0">• 避免绑定全部家当</tspan><tspan x="20" dy="22">• 测试核心功能</tspan><tspan x="20" dy="22">• 跑顺提问方式</tspan><tspan x="20" dy="22">• 随后按需扩大</tspan></text></g><g transform="translate(245, 70)"><rect width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="85" cy="45" r="20" fill="#FFEDD5"/><text x="85" y="52" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#EA580C" text-anchor="middle">2</text><text x="85" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">排查授权页面</text><text x="20" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563"><tspan x="20" dy="0">• 确认权限只读</tspan><tspan x="20" dy="22">• 检查密码流向</tspan><tspan x="20" dy="22">• 寻找断开入口</tspan><tspan x="20" dy="22">• 关注历史销毁</tspan></text></g><g transform="translate(450, 70)"><rect width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><circle cx="85" cy="45" r="20" fill="#DCFCE7"/><text x="85" y="52" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">3</text><text x="85" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">首月人工对照</text><text x="20" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563"><tspan x="20" dy="0">• 翻阅真实流水</tspan><tspan x="20" dy="22">• 核对分类准确</tspan><tspan x="20" dy="22">• 揪出错分漏分</tspan><tspan x="20" dy="22">• 校准信任边界</tspan></text></g></svg>