<svg viewBox='0 0 660 400' xmlns='http://www.w3.org/2000/svg'> <rect width='100%' height='100%' fill='#FAFAFA' rx='12'/> <text x='330' y='35' font-family='-appleSystem, Segoe UI, sans-serif' font-size='18' text-anchor='middle' fill='#1F2937'>目标七问框架</text> <g transform='translate(50, 60)'> <!-- 目的 --> <rect x='0' y='0' width='120' height='50' fill='#2563EB' rx='8' stroke='#2563EB' stroke-width='2'/> <text x='60' y='30' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>目的</text> <text x='60' y='45' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>岔路原则</text> <!-- 完成态 --> <rect x='130' y='0' width='120' height='50' fill='#EA580C' rx='8' stroke='#EA580C' stroke-width='2'/> <text x='190' y='30' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>完成态</text> <text x='190' y='45' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>可验证终点</text> <!-- 证据 --> <rect x='260' y='0' width='120' height='50' fill='#16A34A' rx='8' stroke='#16A34A' stroke-width='2'/> <text x='320' y='30' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>证据</text> <text x='320' y='45' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>验收标准</text> <!-- 反作弊 --> <rect x='390' y='0' width='120' height='50' fill='#9333EA' rx='8' stroke='#9333EA' stroke-width='2'/> <text x='450' y='30' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>反作弊</text> <text x='450' y='45' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>禁止捷径</text> <!-- 边界 --> <rect x='520' y='0' width='120' height='50' fill='#D97706' rx='8' stroke='#D97706' stroke-width='2'/> <text x='580' y='30' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>边界</text> <text x='580' y='45' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>范围限制</text> <!-- 连线 --> <line x1='120' y1='25' x2='130' y2='25' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/> <line x1='250' y1='25' x2='260' y2='25' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/> <line x1='380' y1='25' x2='390' y2='25' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/> <line x1='510' y1='25' x2='520' y2='25' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/> <!-- 取舍 --> <rect x='130' y='80' width='120' height='50' fill='#8B5CF6' rx='8' stroke='#8B5CF6' stroke-width='2'/> <text x='190' y='105' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>取舍</text> <text x='190' y='120' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>优先级决策</text> <!-- 未知 --> <rect x='260' y='80' width='120' height='50' fill='#EC4899' rx='8' stroke='#EC4899' stroke-width='2'/> <text x='320' y='105' font-family='-appleSystem, Segoe UI, sans-serif' font-size='12' text-anchor='middle' fill='#FFFFFF'>未知</text> <text x='320' y='120' font-family='-appleSystem, Segole UI, sans-serif' font-size='10' text-anchor='middle' fill='#FFFFFF'>应对策略</text> <!-- 连接线到取舍和未知 --> <line x1='190' y1='50' x2='190' y2='80' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/> <line x1='320' y1='50' x2='320' y2='80' stroke='#6B7280' stroke-dasharray='5,5' stroke-width='1.5'/></g></svg>