<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="40" y="45" font-size="18" font-weight="bold" fill="#1E293B">为什么只设步数上限不够？四个核心漏点</text><g transform="translate(40, 70)"><rect x="0" y="0" width="275" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="35" r="12" fill="#EA580C" opacity="0.1" /><text x="30" y="39" font-size="12" font-weight="bold" fill="#EA580C" text-anchor="middle">1</text><text x="55" y="40" font-size="14" font-weight="bold" fill="#1E293B">允许跑到最贵那一步</text><text x="25" y="75" font-size="12" fill="#64748B">上限越宽，一路烧到上下文最长</text><text x="25" y="95" font-size="12" fill="#64748B">的第40轮，单轮输入成本翻倍。</text></g><g transform="translate(345, 70)"><rect x="0" y="0" width="275" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="35" r="12" fill="#2563EB" opacity="0.1" /><text x="30" y="39" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">2</text><text x="55" y="40" font-size="14" font-weight="bold" fill="#1E293B">触发时调用照样执行</text><text x="25" y="75" font-size="12" fill="#64748B">上限触发时，模型已请求的那次</text><text x="25" y="95" font-size="12" fill="#64748B">调用SDK仍会跑完，实际超支。</text></g><g transform="translate(40, 220)"><rect x="0" y="0" width="275" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="35" r="12" fill="#D97706" opacity="0.1" /><text x="30" y="39" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">3</text><text x="55" y="40" font-size="14" font-weight="bold" fill="#1E293B">分不清重试与死循环</text><text x="25" y="75" font-size="12" fill="#64748B">网络抖动重试和同一个坏工具</text><text x="25" y="95" font-size="12" fill="#64748B">死循环40次在上限眼里长一样。</text></g><g transform="translate(345, 220)"><rect x="0" y="0" width="275" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><circle cx="30" cy="35" r="12" fill="#9333EA" opacity="0.1" /><text x="30" y="39" font-size="12" font-weight="bold" fill="#9333EA" text-anchor="middle">4</text><text x="55" y="40" font-size="14" font-weight="bold" fill="#1E293B">只管孤立的单个会话</text><text x="25" y="75" font-size="12" fill="#64748B">多任务并行时各烧各的红线，</text><text x="25" y="95" font-size="12" fill="#64748B">满屏错误堆积彻底废掉上下文。</text></g></g></svg>