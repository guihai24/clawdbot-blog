<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="40" y="50" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937">为什么更便宜的模型，跑任务反而更贵？</text><text x="40" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">单价降了，但模型更“勤奋”，消耗的 Token 总量反而上升</text><g transform="translate(40, 105)"><rect width="275" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="0" y="0" width="275" height="40" rx="8" fill="#EFF6FF" /><text x="20" y="26" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB">Fable 5.1</text><text x="20" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">输入单价：$10 / 百万</text><text x="20" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">输出单价：$50 / 百万</text><text x="20" y="145" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">测试用例：较少（标准流程）</text><line x1="20" y1="170" x2="255" y2="170" stroke="#F3F4F6" stroke-width="1" /><text x="20" y="200" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1F2937">任务总成本：$67.16</text></g><g transform="translate(345, 105)"><rect width="275" height="240" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2" /><rect x="0" y="0" width="275" height="40" rx="8" fill="#FFF7ED" /><text x="20" y="26" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#EA580C">Fable 5.2（更勤奋）</text><text x="20" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">输入单价：$8 / 百万 (-20%)</text><text x="20" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">输出单价：$40 / 百万 (-20%)</text><text x="20" y="145" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">测试用例：成百上千 + SubAgent</text><line x1="20" y1="170" x2="255" y2="170" stroke="#F3F4F6" stroke-width="1" /><text x="20" y="200" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#EA580C">任务总成本：$88.15 (↑)</text></g></svg>