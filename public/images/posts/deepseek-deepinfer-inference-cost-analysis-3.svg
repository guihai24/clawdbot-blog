<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><defs><linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FAFAFA"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/></marker></defs><rect width="660" height="400" rx="12" fill="url(#bg-grad)"/><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">独立开发者 AI 降本三步法</text><g transform="translate(40, 80)"><rect width="170" height="270" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><path d="M 0 8 A 8 8 0 0 1 8 0 L 162 0 A 8 8 0 0 1 170 8 L 170 45 L 0 45 Z" fill="#2563EB"/><text x="85" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第一步：缓存优化</text><text x="15" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#334155">启用前缀缓存</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 适用 vLLM / SGLang</text><text x="15" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 固定系统提示词</text><text x="15" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 命中服务端缓存</text><text x="15" y="185" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#2563EB">效果：减少重复计算</text></g><g transform="translate(245, 80)"><rect width="170" height="270" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><path d="M 0 8 A 8 8 0 0 1 8 0 L 162 0 A 8 8 0 0 1 170 8 L 170 45 L 0 45 Z" fill="#D97706"/><text x="85" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第二步：监控耗时</text><text x="15" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#334155">把控关键指标</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• Prefill 输入预处理</text><text x="15" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• Decode 逐Token生成</text><text x="15" y="160" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 定位上下文过重或</text><text x="15" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">  并发调度瓶颈</text><text x="15" y="215" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#D97706">效果：精准对症下药</text></g><g transform="translate(450, 80)"><rect width="170" height="270" rx="8" fill="#FFFFFF" filter="url(#shadow)"/><path d="M 0 8 A 8 8 0 0 1 8 0 L 162 0 A 8 8 0 0 1 170 8 L 170 45 L 0 45 Z" fill="#16A34A"/><text x="85" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第三步：混合部署</text><text x="15" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#334155">务实架构策略</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 核心大模型走托管</text><text x="15" y="125" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">  API保证稳定性</text><text x="15" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 垂直场景小模型</text><text x="15" y="175" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">  云主机轻量部署</text><text x="15" y="215" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#16A34A">效果：平衡成本效率</text></g></svg>