<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g transform="translate(40, 30)"><text x="0" y="24" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">Claude 适用场景与效率提升对比</text><g transform="translate(0, 50)"><rect x="0" y="0" width="270" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="20" y="20" width="12" height="12" rx="3" fill="#2563EB" /><text x="42" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2563EB">适配度极高 (Docs / Slides)</text><text x="20" y="60" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 周期性文本 + 固定结构 (周报/OKR)</text><text x="20" y="90" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 项目总结与复盘 (Postmortem)</text><text x="20" y="120" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 轻量演示文档 (5-10页业务汇报)</text><rect x="20" y="160" width="230" height="1" fill="#F1F5F9" /><text x="20" y="190" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#64748B">核心原则：</text><text x="20" y="215" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">逻辑重要、视觉花活不重要时</text><text x="20" y="235" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">全权交给 Claude 处理。</text></g><g transform="translate(310, 50)"><rect x="0" y="0" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="20" y="20" width="12" height="12" rx="3" fill="#16A34A" /><text x="42" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#16A34A">省时效果：从 1 小时缩短至 25 分钟</text><line x1="20" y1="55" x2="250" y2="55" stroke="#E2E8F0" stroke-dasharray="4" /><text x="20" y="80" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">原流程：1小时（构思+写+搬运）</text><text x="20" y="105" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#16A34A">现流程：25分钟（数据+润色+微调）</text></g><g transform="translate(310, 200)"><rect x="0" y="0" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="20" y="20" width="12" height="12" rx="3" fill="#EA580C" /><text x="42" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#EA580C">不适合场景 (需人工收尾)</text><text x="20" y="65" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 正式合同 / 需法务严审文书</text><text x="20" y="95" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 视觉细节极重要的 Keynote</text></g></g></svg>