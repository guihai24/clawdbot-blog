ns-serif" font-size="13" font-weight="bold" fill="#16A34A">1. 触发时机 (Trigger)</text><text x="35" y="97" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">明确什么时候应该调用此技能</text><rect x="20" y="125" width="250" height="60" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" /><text x="35" y="147" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#D97706">2. 输入要求 (Input)</text><text x="35" y="167" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">执行前必须拿到的参数与规则</text><rect x="20" y="195" width="250" height="60" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" /><text x="35" y="217" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9333EA">3. 输出标准 (Output)</text><text x="35" y="237" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">定义怎样才算完成并产出结果</text></g></svg>