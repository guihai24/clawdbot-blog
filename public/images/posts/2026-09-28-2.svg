<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">GLM-5.2 运行步骤指南</text><g transform="translate(40, 70)"><rect x="0" y="0" width="170" height="95" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="170" height="12" rx="6" fill="#2563EB" /><text x="15" y="35" font-size="14" font-weight="bold" fill="#1E293B">1. 获取程序</text><text x="15" y="60" font-size="12" fill="#64748B">GitHub 下载最新</text><text x="15" y="78" font-size="12" fill="#64748B">Release 预编译包</text></g><line x1="210" y1="117" x2="245" y2="117" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4" /><polygon points="245,113 253,117 245,121" fill="#2563EB" /><g transform="translate(245, 70)"><rect x="0" y="0" width="170" height="95" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="170" height="12" rx="6" fill="#EA580C" /><text x="15" y="35" font-size="14" font-weight="bold" fill="#1E293B">2. 准备模型</text><text x="15" y="60" font-size="12" fill="#64748B">下载 int4 量化版</text><text x="15" y="78" font-size="12" fill="#64748B">存入 models/ 目录</text></g><line x1="415" y1="117" x2="450" y2="117" stroke="#EA580C" stroke-width="2" stroke-dasharray="4,4" /><polygon points="450,113 458,117 450,121" fill="#EA580C" /><g transform="translate(450, 70)"><rect x="0" y="0" width="170" height="95" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="0" width="170" height="12" rx="6" fill="#16A34A" /><text x="15" y="35" font-size="14" font-weight="bold" fill="#1E293B">3. 命令行启动</text><text x="15" y="60" font-size="12" fill="#64748B">coli chat --model</text><text x="15" y="78" font-size="12" fill="#64748B">纯CPU + SSD 运行</text></g><g transform="translate(40, 205)"><line x1="125" y1="0" x2="125" y2="35" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,4" /><polygon points="121,35 125,43 129,35" fill="#16A34A" /></g><g transform="translate(235, 205)"><rect x="0" y="35" width="385" height="125" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="0" y="35" width="385" height="12" rx="6" fill="#9333EA" /><text x="20" y="70" font-size="14" font-weight="bold" fill="#1E293B">4. Web Dashboard 监控与可视化</text><text x="20" y="98" font-size="12" fill="#64748B">• 实时查看 token 生成速度与存储层耗时</text><text x="20" y="120" font-size="12" fill="#64748B">• 监控多达 19456 个专家的分布与调用热度</text><text x="20" y="142" font-size="12" fill="#64748B">• 硬件门槛低：最低 16GB RAM，推荐 24GB 起步</text></g></g></svg>