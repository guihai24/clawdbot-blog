<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="32" y="40" font-size="18" font-weight="700" fill="#111827">浏览器 Agent 落地：先选对任务</text><text x="32" y="60" font-size="11.5" fill="#6B7280">把它当成「带刹车的网页脚本」，而不是万能数字员工</text><rect x="32" y="76" width="63" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" /><text x="63.5" y="95" font-size="12.5" fill="#1D4ED8" text-anchor="middle">流程短</text><rect x="105" y="76" width="76" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" /><text x="143" y="95" font-size="12.5" fill="#1D4ED8" text-anchor="middle">状态清楚</text><rect x="191" y="76" width="63" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" /><text x="222.5" y="95" font-size="12.5" fill="#1D4ED8" text-anchor="middle">可回滚</text><text x="276" y="95" font-size="11.5" fill="#9CA3AF">← 三个筛选条件同时满足再动手</text><text x="36" y="130" font-size="11.5" font-weight="600" fill="#9CA3AF">典型场景</text><rect x="36" y="140" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="50" cy="160" r="4" fill="#2563EB" /><text x="50" y="186" font-size="12" font-weight="600" fill="#111827">后台筛选</text><text x="50" y="204" font-size="11" fill="#6B7280">导出 CSV</text><rect x="156" y="140" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="170" cy="160" r="4" fill="#9333EA" /><text x="170" y="186" font-size="12" font-weight="600" fill="#111827">多平台巡检</text><text x="170" y="204" font-size="11" fill="#6B7280">查消息异常</text><rect x="276" y="140" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="290" cy="160" r="4" fill="#16A34A" /><text x="290" y="186" font-size="12" font-weight="600" fill="#111827">表单录入</text><text x="290" y="204" font-size="11" fill="#6B7280">同步内部系统</text><rect x="396" y="140" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="410" cy="160" r="4" fill="#EA580C" /><text x="410" y="186" font-size="12" font-weight="600" fill="#111827">老系统补位</text><text x="410" y="204" font-size="11" fill="#6B7280">无 API 少量操作</text><rect x="516" y="140" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="530" cy="160" r="4" fill="#D97706" /><text x="530" y="186" font-size="12" font-weight="600" fill="#111827">MVP 演示</text><text x="530" y="204" font-size="11" fill="#6B7280">早期产品原型</text><text x="36" y="250" font-size="11.5" font-weight="600" fill="#9CA3AF">方案怎么选</text><rect x="36" y="258" width="282" height="80" rx="10" fill="#F0FDF4" stroke="#BBF7D0" /><text x="56" y="288" font-size="14" font-weight="700" fill="#16A34A">有稳定 API</text><text x="56" y="310" font-size="11.5" fill="#4B5563">走正门 · 首选方案，稳定且好维护</text><text x="56" y="326" font-size="11" fill="#9CA3AF">别用浏览器 Agent 硬扛</text><rect x="342" y="258" width="282" height="80" rx="10" fill="#FFF7ED" stroke="#FED7AA" /><text x="362" y="288" font-size="14" font-weight="700" fill="#EA580C">浏览器 Agent</text><text x="362" y="310" font-size="11.5" fill="#4B5563">翻窗户 · 开发成本低，适合补位</text><text x="362" y="326" font-size="11" fill="#9CA3AF">门锁一换、页面一变就要返工</text><rect x="36" y="348" width="588" height="40" rx="10" fill="#FFFBEB" stroke="#FDE68A" /><text x="52" y="373" font-size="11.5" fill="#92400E">成本权衡：截图慢且吃 token，DOM 快但噪声多 —— 别忘了算上失败重试与人工兜底的时间。</text></svg>