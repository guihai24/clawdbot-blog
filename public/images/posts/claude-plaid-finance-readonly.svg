<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">记账工具与 AI 消费分析的维度对比</text><rect x="40" y="80" width="265" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="40" y="80" width="265" height="45" rx="8" fill="#EFF6FF" /><text x="172" y="108" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">📊 传统记账 App</text><text x="65" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">核心能力：告诉你「花在哪」</text><text x="65" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 提供客观数据与账单分类</text><text x="65" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 使用饼图/柱状图展示</text><text x="65" y="240" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 局限：缺乏深度推理与归因</text><rect x="355" y="80" width="265" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><rect x="355" y="80" width="265" height="45" rx="8" fill="#FDF4FF" /><text x="487" y="108" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#9333EA" text-anchor="middle">🤖 AI / Claude</text><text x="380" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">核心能力：探讨「为什么」</text><text x="380" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 深入消费结构与心理归因</text><text x="380" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 支持连续追问与省钱建议</text><text x="380" y="240" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">• 局限：归因可能存在幻觉风险</text><rect x="40" y="335" width="5