<svg viewBox='0 0 660 400' xmlns='http://www.w3.org/2000/svg'> <rect width='660' height='400' rx='12' fill='#FAFAFA' /> <text x='330' y='40' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='20' text-anchor='middle' fill='#2563EB'>Opus 5 vs Fable 5: 编码效率与成本对比</text> <!-- 左侧：Opus 5 优势 --> <g transform='translate(80, 70)'> <rect x='0' y='0' width='240' height='280' rx='12' fill='white' stroke='#2563EB' stroke-width='2' /> <text x='120' y='30' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='16' text-anchor='middle' fill='#2563EB'>Opus 5 优势</text> <!-- 性能指标 --> <rect x='20' y='60' width='200' height='50' rx='8' fill='#EFF6FF' /> <text x='120' y='85' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#2563EB'>Frontier-Bench</text> <text x='120' y='105' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' font-weight='bold' fill='#EA580C'>×2.4x Opus 4.8</text> <!-- 正确率 --> <rect x='20' y='120' width='200' height='50' rx='8' fill='#EFF6FF' /> <text x='120' y='145' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#2563EB'>Terminal-Bench</text> <text x='120' y='165' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' font-weight='bold' fill='#16A34A'>89% 正确率 (持平)</text> <!-- 成本优势 --> <rect x='20' y='180' width='200' height='50' rx='8' fill='#EFF6FF' /> <text x='120' y='205' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#2563EB'>成本效益</text> <text x='120' y='225' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' font-weight='bold' fill='#D9770C'>~50% 成本降低</text> <!-- 稳定性 --> <rect x='20' y='240' width='200' height='40' rx='8' fill='#EFF6FF' /> <text x='120' y='265' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='13' fill='#2563EB'>Agent 任务波动 ↓22%</text> </g> <!-- 右侧：适用场景 --> <g transform='translate(340, 70)'> <rect x='0' y='0' width='240' height='280' rx='12' fill='white' stroke='#9333EA' stroke-width='2' /> <text x='120' y='30' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='16' text-anchor='middle' fill='#9333EA'>推荐应用场景</text> <!-- 场景1 --> <circle cx='40' cy='80' r='12' fill='#2563EB' /> <line x1='52' y1='80' x2='80' y2='80' stroke='#9CA3AF' stroke-dasharray='4,4' /> <text x='90' y='85' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#1F2937'>复杂代码生成</text> <!-- 场景2 --> <circle cx='40' cy='120' r='12' fill='#2563EB' /> <line x1='52' y1='120' x2='80' y2='120' stroke='#9CA3AF' stroke-dasharray='4,4' /> <text x='90' y='125' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#1F2937'>Agent 调试与根因分析</text> <!-- 场景3 --> <circle cx='40' cy='160' r='12' fill='#2563EB' /> <line x1='52' y1='160' x2='80' y2='160' stroke='#9CA3AF' stroke-dasharray='4,4' /> <text x='90' y='165' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#1F2937'>CI/CD 自动化脚本</text> <!-- 场景4 --> <circle cx='40' cy='200' r='12' fill='#2563EB' /> <line x1='52' y1='200' x2='80' y2='200' stroke='#9CA3AF' stroke-dasharray='4,4' /> <text x='90' y='205' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='14' fill='#1F2937'>多步骤 Agent 流程</text> <!-- 总结框 --> <rect x='20' y='240' width='200' height='30' rx='6' fill='#EEF2FF' stroke='#9333EA' stroke-width='1' /> <text x='120' y='260' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='13' text-anchor='middle' fill='#9333EA' font-weight='bold'>直接换就对！</text> </g> <!-- 中间连接箭头 --> <defs> <marker id='arrowhead' markerWidth='10' markerHeight='7' refX='9' refY='3.5' orient='auto'> <polygon points='0 0, 10 3.5, 0 7' fill='#6B7280' /> </marker> </defs> <line x1='320' y1='150' x2='340' y2='150' stroke='#6B7280' stroke-width='2' marker-end='url(#arrowhead)' stroke-dasharray='6,4' /> <text x='330' y='140' font-family='-apple-system, \'Segoe UI\', sans-serif' font-size='12' text-anchor='middle' fill='#6B7280'>优化选择</text></svg>