<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 400' width='100%' height='100%'><style>text { font-family: -apple-system, 'Segoe UI', sans-serif; }</style><rect width='660' height='400' rx='12' fill='#FAFAFA'/><text x='330' y='45' font-size='20' font-weight='bold' text-anchor='middle' fill='#1E293B'>1M 上下文：优势与隐藏成本</text><g transform='translate(40, 80)'><rect width='265' height='260' rx='10' fill='#FFFFFF' stroke='#E2E8F0'/><rect x='20' y='20' width='225' height='40' rx='6' fill='#EFF6FF'/><text x='132' y='45' font-size='16' font-weight='bold' fill='#2563EB' text-anchor='middle'>核心优势（免去筛选）</text><text x='30' y='95' font-size='14' fill='#334155'>• 无需挑选单个代码文件</text><text x='30' y='130' font-size='14' fill='#334155'>• 架构图/白板图直接输入</text><text x='30' y='165' font-size='14' fill='#334155'>• 胜任长周期专业任务</text><text x='30' y='200' font-size='14' fill='#334155'>• AutomationBench 表现强</text></g><g transform='translate(355, 80)'><rect width='265' height='260' rx='10' fill='#FFFFFF' stroke='#E2E8F0'/><rect x='20' y='20' width='225' height='40' rx='6' fill='#FFF7ED'/><text x='132' y='45' font-size='16' font-weight='bold' fill='#EA580C' text-anchor='middle'>隐藏代价（真实痛点）</text><text x='30' y='95' font-size='14' fill='#334155'>• Token 账单暴涨</text><text x='30' y='130' font-size='14' fill='#334155'>• 厂商跑分仅作参考</text><text x='30' y='165' font-size='14' fill='#334155'>• 测试条件与提示词未公开</text><text x='30' y='200' font-size='14' fill='#334155'>• 1M 不是免费自助餐</text></g></svg>