<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748B" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="34" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1E293B">AI 加速代码产出，交付却卡在审查与返工</text><rect x="24" y="54" width="612" height="102" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/><text x="42" y="77" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#475569">代码产出端</text><rect x="42" y="90" width="172" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB"/><text x="128" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1D4ED8">AI 批量生成代码</text><text x="128" y="127" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">数百行 · 多任务并行</text><path d="M222 114 H257" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/><rect x="266" y="90" width="154" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB"/><text x="343" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1D4ED8">PR 数量激增</text><text x="343" y="127" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">合并量约为 4 倍</text><path d="M428 114 H462" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/><rect x="471" y="90" width="145" height="48" rx="8" fill="#FFEDD5" stroke="#EA580C"/><text x="543" y="110" text-anchor="middle" font-family="-apple-sy