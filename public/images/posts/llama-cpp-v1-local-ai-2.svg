<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><style>.title { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; fill: #1E293B; } .subtitle { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 12px; fill: #64748B; } .card-title { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: bold; fill: #0F172A; } .card-text { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 11px; fill: #475569; }</style><rect width="660" height="400" rx="12" fill="#FAFAFA" /><rect x="30" y="30" width="600" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><text x="50" y="65" class="title">本地大模型内存需求与平台差异剖析</text><text x="50" y="85" class="subtitle">内存消耗 = 模型权重 + KV Cache (上下文) + 系统余量</text><rect x="50" y="110" width="175" height="110" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><rect x="65" y="125" width="24" height="24" rx="4" fill="#2563EB" /><text x="73" y="141" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold">1</text><text x="100" y="141" class="card-title">模型权重</text><text x="65" y="165" class="card-text">参数量 × 每参数字节</text><text x="65" y="183" class="card-text">Q4_K_M: ~0.55B / Q8: ~1B</text><text x="65" y="201" class="card-text">决定模型能否装下</text><rect x="242" y="110" width="175" height="110" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" /><rect x="257" y="125" width="24" height="24" rx="4" fill="#EA580C" /><text x="265" y="141" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold">2</text><text x="292" y="141" class="card-title">KV Cache</text><text x="257" y="165" class="card-text">对话上下文缓存</text><text x="257" y="183" class="card-text">上下文越长消耗越大</text><text x="257" y="201" class="card-text">常因长文档而爆内存</text><rect x="434" y="110" width="175" height="110" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" /><rect x="449" y="125" width="24" height="24" rx="4" fill="#16A34A" /><text x="457" y="141" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold">3</text><text x="484" y="141" class="card-title">系统余量</text><text x="449" y="165" class="card-text">操作系统及其他应用</text><text x="449" y="183" class="card-text">保证系统不卡顿</text><text x="449" y="201" class="card-text">预留安全空间</text><rect x="50" y="235" width="559" height="115" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><text x="70" y="260" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">硬件分界线：平台机制对比</text><rect x="70" y="275" width="260" height="60" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="85" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">Mac 统一内存架构</text><text x="85" y="315" class="card-text" font-size="11.34">CPU/GPU 共享内存，总量大且灵活，看总内存</text><rect x="345" y="275" width="244" height="60" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="360" y="295" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#EA580C">Windows 独显架构</text><text x="360" y="315" class="card-text" font-size="12.6">受显存硬限制，超显存退化CPU速度骤降</text></svg>