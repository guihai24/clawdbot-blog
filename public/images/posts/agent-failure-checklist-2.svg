<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <rect width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1F2937">Agent 交付前自检清单 · 6 步</text>
  <text x="30" y="50" font-size="11.5" fill="#6B7280">不依赖具体模型，可直接放进 README 或任务末尾</text>

  
  <g filter="url(#sh)">
    <rect x="30" y="62" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <rect x="340" y="62" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
  </g>
  <circle cx="60" cy="96" r="15" fill="#2563EB" />
  <text x="60" y="101" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="86" y="96" font-size="13.5" font-weight="600" fill="#1F2937">复述任务边界</text>
  <text x="86" y="116" font-size="11" fill="#6B7280">允许改哪些文件、模块</text>
  <text x="86" y="134" font-size="11" fill="#6B7280">禁止哪些操作（提交 / 开 PR）</text>

  <circle cx="370" cy="96" r="15" fill="#2563EB" />
  <text x="370" y="101" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="396" y="96" font-size="13.5" font-weight="600" fill="#1F2937">写出验收标准</text>
  <text x="396" y="116" font-size="11" fill="#6B7280">用一句用户可观察的话描述</text>
  <text x="396" y="134" font-size="11" fill="#6B7280">不是测试通过，是执行 X 看到 Y</text>

  
  <g filter="url(#sh)">
    <rect x="30" y="170" width="290" height="96" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" />
    <rect x="340" y="170" width="290" height="96" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" />
  </g>
  <circle cx="60" cy="204" r="15" fill="#EA580C" />
  <text x="60" y="209" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="86" y="204" font-size="13.5" font-weight="600" fill="#9A3412">说明验证覆盖了什么</text>
  <text x="86" y="224" font-size="11" fill="#B45309">跑了哪些验证、各覆盖哪条路径</text>
  <text x="86" y="242" font-size="11" fill="#B45309">哪些路径没有被覆盖</text>

  <circle cx="370" cy="204" r="15" fill="#EA580C" />
  <text x="370" y="209" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="396" y="204" font-size="13.5" font-weight="600" fill="#9A3412">回到原始失败场景</text>
  <text x="396" y="224" font-size="11" fill="#B45309">按最初复现步骤重走一遍</text>
  <text x="396" y="242" font-size="11" fill="#B45309">走不了就说明缺什么环境</text>

  
  <g filter="url(#sh)">
    <rect x="30" y="278" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <rect x="340" y="278" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
  </g>
  <circle cx="60" cy="312" r="15" fill="#16A34A" />
  <text x="60" y="317" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="86" y="312" font-size="13.5" font-weight="600" fill="#1F2937">检查副作用</text>
  <text x="86" y="332" font-size="11" fill="#6B7280">是否改动了没要求的范围</text>
  <text x="86" y="350" font-size="11" fill="#6B7280">是否新增全局规则与依赖</text>

  <circle cx="370" cy="312" r="15" fill="#9333EA" />
  <text x="370" y="317" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="396" y="312" font-size="13.5" font-weight="600" fill="#1F2937">报告结果格式</text>
  <text x="396" y="332" font-size="11" fill="#6B7280">已完成 / 验证方式</text>
  <text x="396" y="350" font-size="11" fill="#6B7280">未验证 / 需要我确认</text>
</svg>