<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="-apple-system,'Segoe UI',sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#FAFAFA"/>

  <!-- title -->
  <text x="330" y="44" font-size="20" font-weight="700" fill="#1C1917" text-anchor="middle">证明价值的老闸口与新闸口</text>
  <text x="330" y="70" font-size="12" fill="#78716C" text-anchor="middle">「做出来」不再稀缺之后，看什么变了</text>

  <!-- before card -->
  <g filter="url(#shadow)">
    <rect x="48" y="96" width="264" height="236" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
  </g>
  <rect x="48" y="96" width="264" height="34" rx="12" fill="#78716C"/>
  <rect x="48" y="116" width="264" height="14" fill="#78716C"/>
  <text x="180" y="118" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">老闸口：证明「可靠」</text>
  <g font-size="13" fill="#44403C">
    <circle cx="76" cy="160" r="4" fill="#78716C"/>
    <text x="90" y="164">手撕代码：45 分钟能不能做出来</text>
    <circle cx="76" cy="208" r="4" fill="#78716C"/>
    <text x="90" y="212">年资积累：框架和库摸爬滚打几年</text>
    <circle cx="76" cy="256" r="4" fill="#78716C"/>
    <text x="90" y="260">晋升台阶：走到什么级别才算数</text>
  </g>
  <text x="180" y="306" font-size="11" fill="#78716C" text-anchor="middle">共同前提：做东西很贵，所以要预先筛人</text>

  <!-- arrow between -->
  <g stroke="#EA580C" stroke-width="2" fill="none">
    <line x1="322" y1="214" x2="338" y2="214"/>
    <polyline points="334,210 338,214 334,218"/>
  </g>

  <!-- after card -->
  <g filter="url(#shadow)">
    <rect x="348" y="96" width="264" height="236" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
  </g>
  <rect x="348" y="96" width="264" height="34" rx="12" fill="#2563EB"/>
  <rect x="348" y="116" width="264" height="14" fill="#2563EB"/>
  <text x="480" y="118" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">新闸口：证明「判断」</text>
  <g font-size="13" fill="#44403C">
    <circle cx="376" cy="160" r="4" fill="#2563EB"/>
    <text x="390" y="164">周末 demo：能不能跑起来</text>
    <circle cx="376" cy="208" r="4" fill="#2563EB"/>
    <text x="390" y="212">判断力：选哪个、为什么选它</text>
    <circle cx="376" cy="256" r="4" fill="#2563EB"/>
    <text x="390" y="260">敢开口：带给了谁、下一步要什么</text>
  </g>
  <text x="480" y="306" font-size="11" fill="#78716C" text-anchor="middle">共同前提：做东西不贵了，要看你选对了没有</text>

  <!-- footnote -->
  <line x1="48" y1="352" x2="612" y2="352" stroke="#E7E5E4" stroke-width="1"/>
  <text x="330" y="378" font-size="12" fill="#EA580C" font-weight="600" text-anchor="middle">稀缺的不再是「能不能做」，是「选没选对 + 带没带给对的人」</text>
</svg>
