<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" style="background-color: #FAFAFA; border-radius: 12px; font-family: -apple-system, 'Segoe UI', sans-serif;"><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/></marker></defs><rect width="660" height="400" rx="12" fill="#FAFAFA"/><text x="330" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">窗口切换的心智负担对比</text><g transform="translate(40, 80)"><rect width="265" height="280" rx="12" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="265" height="8" rx="4" fill="#EA580C"/><text x="24" y="42" font-size="16" font-weight="600" fill="#EA580C">传统 ⌘Tab 翻找</text><text x="24" y="68" font-size="12" fill="#64748B">痛点：高心智负担、视觉匹配</text><g transform="translate(24, 90)"><rect width="217" height="46" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/><text x="16" y="28" font-size="13" font-weight="500" fill="#9A3412">1. 按 7 下定位图标</text></g><g transform="translate(24, 146)"><rect width="217" height="46" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/><text x="16" y="28" font-size="13" font-weight="500" fill="#9A3412">2. 盯着光标反复确认</text></g><g transform="translate(24, 202)"><rect width="217" height="52" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/><text x="16" y="22" font-size="13" font-weight="600" fill="#991B1B">结果：速度快但很累</text><text x="16" y="40" font-size="11" fill="#B91C1C">每次都要重新做视觉匹配</text></g></g><g transform="translate(355, 80)"><rect width="265" height="280" rx="12" fill="#FFFFFF" filter="url(#shadow)"/><rect x="0" y="0" width="265" height="8" rx="4" fill="#16A34A"/><text x="24" y="42" font-size="16" font-weight="600" fill="#16A34A">首字母直达 (AbcTab)</text><text x="24" y="68" font-size="12" fill="#64748B">核心：肌肉记忆、不用看</text><g transform="translate(24, 90)"><rect width="217" height="46" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/><text x="16" y="28" font-size="13" font-weight="500" fill="#166534">1. 脑中已有键名映射</text></g><g transform="translate(24, 146)"><rect width="217" height="46" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/><text x="16" y="28" font-size="13" font-weight="500" fill="#166534">2. 直觉按键 (如 'W' 微信)</text></g><g transform="translate(24, 202)"><rect width="217" height="52" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/><text x="16" y="22" font-size="13" font-weight="600" fill="#166534">结果：真正的高效</text><text x="16" y="40" font-size="11" fill="#15803D">消灭中间确认的成本</text></g></g></svg>