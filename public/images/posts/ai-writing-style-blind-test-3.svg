<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="660" height="400" rx="12" fill="#FAFAFA" />

  <text x="24" y="38" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1E293B">旧文盲测法：什么时候用，什么时候别用</text>
  <text x="24" y="56" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">先看样本，再看用途，最后看它到底解决哪一层</text>

  
  <rect x="24" y="70" width="300" height="172" rx="12" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="24" y="70" width="300" height="172" rx="12" fill="none" stroke="#DCFCE7" />
  <rect x="24" y="70" width="5" height="172" rx="2.5" fill="#16A34A" />
  <rect x="44" y="86" width="66" height="22" rx="11" fill="#DCFCE7" />
  <text x="77" y="101" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#15803D">适 合</text>

  <text x="44" y="134" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#334155">已有内容，且读者认可其中一些</text>
  <text x="44" y="158" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#334155">但说不清自己为什么写得好</text>
  <text x="44" y="188" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">技术博客 · 行业分析 · 周报 · 产品文档</text>
  <text x="44" y="212" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">固定栏目 · 固定读者 · 固定表达方式</text>
  <text x="44" y="232" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">稳定优先于文采</text>

  
  <rect x="348" y="70" width="288" height="82" rx="12" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="348" y="70" width="288" height="82" rx="12" fill="none" stroke="#FFEDD5" />
  <rect x="348" y="70" width="5" height="82" rx="2.5" fill="#EA580C" />
  <text x="368" y="94" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#C2410C">① 还没形成稳定样本</text>
  <text x="368" y="116" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">不到十篇，或题材、语气、结构差很远</text>
  <text x="368" y="136" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">盲测结果会很散 —— 先多写，别急着调 skill</text>

  
  <rect x="348" y="160" width="288" height="82" rx="12" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="348" y="160" width="288" height="82" rx="12" fill="none" stroke="#FFEDD5" />
  <rect x="348" y="160" width="5" height="82" rx="2.5" fill="#EA580C" />
  <text x="368" y="184" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#C2410C">② 要事实准确，而不是像你</text>
  <text x="368" y="206" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">法律解释 · 财务报告 · 事故复盘</text>
  <text x="368" y="226" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">文风要服务于信息边界</text>

  
  <rect x="24" y="258" width="612" height="118" rx="12" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="24" y="258" width="612" height="118" rx="12" fill="none" stroke="#F3E8FF" />
  <rect x="24" y="258" width="5" height="118" rx="2.5" fill="#9333EA" />

  <text x="44" y="284" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7E22CE">边界：文风 skill 不会替你产生观点</text>

  <text x="44" y="312" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">brief 里没有判断和取舍，只有一堆资料，</text>
  <text x="44" y="332" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">AI 再像你，也只是用你的语气把没想清楚的东西摊开。</text>

  <rect x="44" y="344" width="176" height="20" rx="10" fill="#F3E8FF" />
  <text x="132" y="358" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#7E22CE">解决的是表达层</text>
  <line x1="232" y1="354" x2="262" y2="354" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4" />
  <rect x="272" y="344" width="176" height="20" rx="10" fill="#FFEDD5" />
  <text x="360" y="358" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C2410C">不是思考层</text>

  <text x="466" y="358" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#94A3B8">压不出东西 → 问题在 brief</text>
</svg>