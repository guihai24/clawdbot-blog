<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">CLI、Skill 与 MCP 选型对比</text><g transform="translate(30, 75)"><rect width="180" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="0" y="0" width="180" height="40" rx="8" fill="#EFF6FF" /><text x="90" y="26" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">CLI</text><text x="20" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">核心特点:</text><text x="20" y="95" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">模型原生认识</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">无需额外说明书</text><text x="20" y="155" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">Token 成本:</text><text x="20" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#16A34A">极低 (最省)</text><text x="20" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">适用场景:</text><text x="20" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">标准通用命令 (如 gh/git)</text></g><g transform="translate(240, 75)"><rect width="180" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="0" y="0" width="180" height="40" rx="8" fill="#F3E8FF" /><text x="90" y="26" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#9333EA" text-anchor="middle">Skill</text><text x="20" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">核心特点:</text><text x="20" y="95" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">按需读取 SKILL.md</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">动态补全说明书</text><text x="20" y="155" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">Token 成本:</text><text x="20" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#D97706">中等 (留在上下文中)</text><text x="20" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">适用场景:</text><text x="20" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">私有/自定义运维命令</text></g><g transform="translate(450, 75)"><rect width="180" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><rect x="0" y="0" width="180" height="40" rx="8" fill="#ECFDF5" /><text x="90" y="26" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">MCP</text><text x="20" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">核心特点:</text><text x="20" y="95" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">标准接口与协议</text><text x="20" y="115" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">统一发现与权限</text><text x="20" y="155" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">Token 成本:</text><text x="20" y="180" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#EA580C">较高 (多服务协同)</text><text x="20" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4B5563">适用场景:</text><text x="20" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">多服务集成、多Agent复用</text></g></svg>