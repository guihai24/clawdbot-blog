<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><g font-family="-apple-system, 'Segoe UI', sans-serif"><text x="330" y="45" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">什么时候该换，什么时候别换？</text><rect x="50" y="80" width="260" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB" /><text x="180" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563EB">Opus 5.5 (复杂高阶场景)</text><circle cx="80" cy="155" r="4" fill="#2563EB" /><text x="95" y="160" font-size="14" fill="#4B5563">大型架构重构</text><circle cx="80" cy="195" r="4" fill="#2563EB" /><text x="95" y="200" font-size="14" fill="#4B5563">多轮推理 Agent 工作</text><circle cx="80" cy="235" r="4" fill="#2563EB" /><text x="95" y="240" font-size="14" fill="#4B5563">需要“仔细斟酌”的场景</text><rect x="75" y="270" width="210" height="55" rx="6" fill="#EFF6FF" /><text x="180" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#1D4ED8">保持高能力与深度</text><text x="180" y="315" font-size="12" text-anchor="middle" fill="#3B82F6">适合攻坚任务</text><rect x="350" y="80" width="260" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB" /><text x="480" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#EA580C">Sonnet 5.5 (日常高效场景)</text><circle cx="380" cy="155" r="4" fill="#EA580C" /><text x="395" y="160" font-size="14" fill="#4B5563">常规 Bug 修复</text><circle cx="380" cy="195" r="4" fill="#EA580C" /><text x="395" y="200" font-size="14" fill="#4B5563">文档撰写与 UI 重构</text><circle cx="380" cy="235" r="4" fill="#EA580C" /><text x="395" y="240" font-size="14" fill="#4B5563">灵活的努力级别设置</text><rect x="375" y="270" width="210" height="55" rx="6" fill="#FFF7ED" /><text x="480" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2410C">够用且更省 (高效)</text><text x="480" y="315" font-size="12" text-anchor="middle" fill="#F97316">适合高频日常 Coding</text></g></svg>