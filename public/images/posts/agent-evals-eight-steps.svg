<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF" />
    </marker>
  </defs>
  <rect width="660" height="400" rx="12" fill="#FAFAFA" />
  <text x="330" y="38" text-anchor="middle" font-size="17" font-weight="600" fill="#1F2937">Demo 能做到一次，不等于产品能做到一类</text>

  <rect x="30" y="60" width="270" height="162" rx="10" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="30" y="60" width="270" height="4" rx="2" fill="#2563EB" />
  <text x="48" y="92" font-size="14" font-weight="600" fill="#2563EB">单次 Demo 验证</text>
  <circle cx="52" cy="118" r="3" fill="#2563EB" />
  <text x="66" y="122" font-size="12.5" fill="#374151">一个问题，看一个答案</text>
  <circle cx="52" cy="146" r="3" fill="#2563EB" />
  <text x="66" y="150" font-size="12.5" fill="#374151">恰好命中脚本里的成功路径</text>
  <circle cx="52" cy="174" r="3" fill="#2563EB" />
  <text x="66" y="178" font-size="12.5" fill="#374151">只看最后一句话对不对</text>
  <text x="48" y="204" font-size="11.5" fill="#9CA3AF">验证的是「能不能做到一次」</text>

  <line x1="308" y1="141" x2="352" y2="141" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)" />

  <rect x="360" y="60" width="270" height="162" rx="10" fill="#FFFFFF" filter="url(#sh)" />
  <rect x="360" y="60" width="270" height="4" rx="2" fill="#EA580C" />
  <text x="378" y="92" font-size="14" font-weight="600" fill="#EA580C">线上产品评测</text>
  <circle cx="382" cy="118" r="3" fill="#EA580C" />
  <text x="396" y="122" font-size="12.5" fill="#374151">一类任务里的多轮状态</text>
  <circle cx="382" cy="146" r="3" fill="#EA580C" />
  <text x="396" y="150" font-size="12.5" fill="#374151">上下文 · 工具 · 交接 · 收口</text>
  <circle cx="382" cy="174" r="3" fill="#EA580C" />
  <text x="396" y="178" font-size="12.5" fill="#374151">看成功率与任务边界判断</text>
  <text x="378" y="204" font-size="11.5" fill="#9CA3AF">关注的是「有多常做到」</text>

  <text x="30" y="252" font-size="13" font-weight="600" fill="#9333EA">三句话，考的是同一件事：Agent 知道哪里该停下来问人</text>

  <rect x="30" y="266" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E9D5FF" filter="url(#sh)" />
  <text x="44" y="288" font-size="12" fill="#4B5563">我上周搬走了，</text>
  <text x="44" y="307" font-size="12" fill="#4B5563">那个东西别寄老地方。</text>

  <rect x="235" y="266" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E9D5FF" filter="url(#sh)" />
  <text x="249" y="288" font-size="12" fill="#4B5563">地址先别改，</text>
  <text x="249" y="307" font-size="12" fill="#4B5563">万一今天发货呢？</text>

  <rect x="440" y="266" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E9D5FF" filter="url(#sh)" />
  <text x="454" y="288" font-size="12" fill="#4B5563">我改完地址，</text>
  <text x="454" y="307" font-size="12" fill="#4B5563">运费是不是也算错了？</text>

  <rect x="30" y="338" width="600" height="42" rx="10" fill="#F3E8FF" stroke="#D8B4FE" />
  <text x="330" y="365" text-anchor="middle" font-size="13.5" font-weight="600" fill="#7E22CE">评测不是上线前补的文档，而是把产品风险提前变成题目</text>
</svg>