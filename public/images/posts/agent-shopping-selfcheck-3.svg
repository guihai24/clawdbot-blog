<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="-apple-system, 'Segoe UI', sans-serif"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08" /></filter></defs><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="32" y="36" font-size="17" font-weight="700" fill="#111827">五道闸：你的页面过得了几道？</text><text x="32" y="52" font-size="11" fill="#9CA3AF">买家与 Agent 都会逐条校验</text><g filter="url(#s)"><rect x="32" y="64" width="596" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="58" cy="86" r="13" fill="#DBEAFE" /><text x="58" y="91" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">1</text><text x="82" y="83" font-size="13.5" font-weight="700" fill="#111827">价格能被读出来</text><text x="82" y="99" font-size="11" fill="#6B7280">价格做成图片 / 登录才显示 / 只写「起价」</text></g><g filter="url(#s)"><rect x="32" y="116" width="596" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="58" cy="138" r="13" fill="#FFEDD5" /><text x="58" y="143" font-size="13" font-weight="700" fill="#EA580C" text-anchor="middle">2</text><text x="82" y="135" font-size="13.5" font-weight="700" fill="#111827">规格能跨店比较</text><text x="82" y="151" font-size="11" fill="#6B7280">只有「大份」「一套」，缺克数、片数与单价</text></g><g filter="url(#s)"><rect x="32" y="168" width="596" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="58" cy="190" r="13" fill="#DCFCE7" /><text x="58" y="195" font-size="13" font-weight="700" fill="#16A34A" text-anchor="middle">3</text><text x="82" y="187" font-size="13.5" font-weight="700" fill="#111827">库存和到货明确</text><text x="82" y="203" font-size="11" fill="#6B7280">「现货充足」「下单后尽快发」＝没有承诺</text></g><g filter="url(#s)"><rect x="32" y="220" width="596" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="58" cy="242" r="13" fill="#F3E8FF" /><text x="58" y="247" font-size="13" font-weight="700" fill="#9333EA" text-anchor="middle">4</text><text x="82" y="239" font-size="13.5" font-weight="700" fill="#111827">不问人就能下单</text><text x="82" y="255" font-size="11" fill="#6B7280">只给「联系客服询价」「批量优惠私聊」</text></g><g filter="url(#s)"><rect x="32" y="272" width="596" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" /><circle cx="58" cy="294" r="13" fill="#FEF3C7" /><text x="58" y="299" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">5</text><text x="82" y="291" font-size="13.5" font-weight="700" fill="#111827">身份能对上号</text><text x="82" y="307" font-size="11" fill="#6B7280">同货三种叫法、标题堆词，两次抓取认成两个商品</text></g><rect x="32" y="328" width="596" height="52" rx="10" fill="#FFF7ED" stroke="#FED7AA" /><text x="52" y="351" font-size="13" font-weight="700" fill="#EA580C">⚠ 别急着上工具</text><text x="52" y="369" font-size="11" fill="#9A3412">先修最贵的闸：没有文本价格 —— 改文案和图片位置就能过，不用改代码</text></svg>