<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" style="background-color: #FAFAFA; border-radius: 12px;"><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/></filter></defs><text x="330" y="36" text-anchor="middle" fill="#1E293B" font-size="18" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif">reasoning_effort 在不同后端的实现陷阱</text><rect x="230" y="60" width="200" height="40" rx="8" fill="#2563EB" filter="url(#shadow)"/><text x="330" y="85" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600" font-family="-apple-system, 'Segoe UI', sans-serif">请求: reasoning_effort</text><path d="M 330 100 L 110 150 M 330 100 L 330 150 M 330 100 L 550 150" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/><g transform="translate(20, 150)"><rect x="0" y="0" width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><rect x="0" y="0" width="180" height="32" rx="8" fill="#EA580C" opacity="0.1"/><text x="90" y="21" text-anchor="middle" fill="#EA580C" font-size="13" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif">后端 A：直接忽略</text><text x="15" y="55" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 参数生效：否 (忽略)</text><text x="15" y="80" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 推理深度：固定默认</text><text x="15" y="105" fill="#DC2626" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', sans-serif">• 计费：溢价照收</text></g><g transform="translate(240, 150)"><rect x="0" y="0" width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><rect x="0" y="0" width="180" height="32" rx="8" fill="#9333EA" opacity="0.1"/><text x="90" y="21" text-anchor="middle" fill="#9333EA" font-size="13" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif">后端 B：映射 Token 上限</text><text x="15" y="55" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 参数生效：调整 Token</text><text x="15" y="80" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 推理深度：随档位变化</text><text x="15" y="105" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 计费：按实际 Token</text></g><g transform="translate(460, 150)"><rect x="0" y="0" width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><rect x="0" y="0" width="180" height="32" rx="8" fill="#D97706" opacity="0.1"/><text x="90" y="21" text-anchor="middle" fill="#D97706" font-size="13" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif">后端 C：微调 Prompt/温度</text><text x="15" y="55" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 参数生效：伪变控</text><text x="15" y="80" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 推理深度：质量极不稳定</text><text x="15" y="105" fill="#475569" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">• 计费：按档位固定收</text></g><rect x="50" y="310" width="560" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/><text x="330" y="335" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="-apple-system, 'Segoe UI', sans-serif">对 Agent 系统的最终影响</text><text x="330" y="355" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="-apple-system, 'Segoe UI', sans-serif">出现「不可预测黑箱」：耗时/深度漂移，自动修错与工具链逻辑失效</text></svg>