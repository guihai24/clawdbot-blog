<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" style="background-color: #FAFAFA; border-radius: 12px;"><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/></marker></defs><text x="330" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#1E293B">AGENTS.md 治理决策框架</text><g transform="translate(25, 60)"><rect width="180" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><path d="M 0 10 C 0 4.477 4.477 0 10 0 L 170 0 C 175.523 0 180 4.477 180 10 L 180 40 L 0 40 Z" fill="#2563EB"/><text x="90" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">STEP 1: 体检打分</text><text x="15" y="68" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">计算负担分（0-3分）</text><text x="15" y="94" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">1. 上下文超预算？</text><text x="15" y="116" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">2. 包含过时提示咒语？</text><text x="15" y="138" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">3. 超过半年未动？</text><rect x="15" y="160" width="150" height="1" fill="#E2E8F0"/><rect x="15" y="180" width="150" height="100" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><text x="90" y="205" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">高危判定</text><text x="90" y="230" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1E40AF">得分 ≥ 3 分</text><text x="90" y="255" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#2563EB">优先进入重构队列</text></g><path d="M 205 210 L 233 210" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><g transform="translate(240, 60)"><rect width="180" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><path d="M 0 10 C 0 4.477 4.477 0 10 0 L 170 0 C 175.523 0 180 4.477 180 10 L 180 40 L 0 40 Z" fill="#EA580C"/><text x="90" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">STEP 2: 裸奔实验</text><text x="15" y="68" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">A/B 对照测试</text><rect x="15" y="82" width="150" height="36" rx="4" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/><text x="23" y="104" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#C2410C"><tspan font-weight="bold">A版：</tspan>保留完整原提示</text><rect x="15" y="126" width="150" height="36" rx="4" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/><text x="23" y="148" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#C2410C"><tspan font-weight="bold">B版：</tspan>只留核心+换Astra</text><text x="15" y="185" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">核心观察指标</text><text x="15" y="210" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">• 任务成功率</text><text x="15" y="230" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">• Token 与调用效率</text><text x="15" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">• 方案质量与多样性</text><rect x="15" y="264" width="150" height="22" rx="4" fill="#FFEDD5"/><text x="90" y="279" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#EA580C">B ≥ A 则原文件判定为累赘</text></g><path d="M 420 210 L 448 210" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><g transform="translate(455, 60)"><rect width="180" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/><path d="M 0 10 C 0 4.477 4.477 0 10 0 L 170 0 C 175.523 0 180 4.477 180 10 L 180 40 L 0 40 Z" fill="#9333EA"/><text x="90" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">STEP 3: 确定去向</text><g transform="translate(12, 55)"><rect width="156" height="65" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="10" y="22" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">删除 (Delete)</text><text x="10" y="42" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#7F1D1D">纯流程式 / 纯咒语型说明</text></g><g transform="translate(12, 130)"><rect width="156" height="75" rx="6" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1"/><text x="10" y="22" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9333EA">缩写为技能卡</text><text x="10" y="42" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#581C87">保留高价值项目/业务规则</text><text x="10" y="58" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#7E22CE">压缩至 200–400 token</text></g><g transform="translate(12, 215)"><rect width="156" height="65" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/><text x="10" y="22" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#16A34A">保留全文 (Keep)</text><text x="10" y="42" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#14532D">涉及安全、合规、财务等</text><text x="10" y="56" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#14532D">需强约束行为的 Agent</text></g></g></svg>