<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA" /><text x="330" y="45" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">TokenEconomizer 三大核心机制</text><g transform="translate(40, 75)"><rect x="0" y="0" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.05))" /><rect x="0" y="0" width="170" height="40" rx="8" fill="#2563EB" /><text x="85" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. 微技能沉淀</text><text x="15" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 一行式项目笔记</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 跨会话反复确认</text><text x="15" y="130" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 动态版本控制</text><text x="15" y="160" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 有证据才上架</text><text x="15" y="190" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 冲突自动撤销</text><rect x="25" y="225" width="120" height="30" rx="4" fill="#EFF6FF" /><text x="85" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#2563EB" text-anchor="middle">解决经验过期问题</text></g><g transform="translate(245, 75)"><rect x="0" y="0" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.05))" /><rect x="0" y="0" width="170" height="40" rx="8" fill="#EA580C" /><text x="85" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. 工具智能裁剪</text><text x="15" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 分析历史使用率</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 移出从不用工具</text><text x="15" y="130" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 保留核心执行能力</text><text x="15" y="160" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 按需动态恢复</text><text x="15" y="190" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 节省每轮 Token</text><rect x="25" y="225" width="120" height="30" rx="4" fill="#FFF7ED" /><text x="85" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#EA580C" text-anchor="middle">精简上下文通讯录</text></g><g transform="translate(450, 75)"><rect x="0" y="0" width="170" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.05))" /><rect x="0" y="0" width="170" height="40" rx="8" fill="#16A34A" /><text x="85" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. 失败循环干预</text><text x="15" y="70" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 监测重复撞墙</text><text x="15" y="100" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 评判模型来诊断</text><text x="15" y="130" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 提供简短提示</text><text x="15" y="160" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 引导 Agent 换路</text><text x="15" y="190" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">• 失败时通知人工</text><rect x="25" y="225" width="120" height="30" rx="4" fill="#F0FDF4" /><text x="85" y="245" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16A34A" text-anchor="middle">克制而安全的边界</text></g></svg>