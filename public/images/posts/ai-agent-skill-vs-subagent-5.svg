<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400">
  <rect width="660" height="400" fill="#FAFAFA" rx="12"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="330" y="32" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1E293B">SubAgent 适用场景</text>
  <!-- 主Agent卡片 -->
  <rect x="230" y="55" width="200" height="50" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="78" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2563EB">主 Agent</text>
  <text x="330" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">统筹调度 · 最终交付</text>
  <!-- 箭头到场景1 -->
  <line x1="280" y1="105" x2="140" y2="145" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 箭头到场景2 -->
  <line x1="380" y1="105" x2="520" y2="145" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 场景1卡片 -->
  <rect x="30" y="150" width="240" height="130" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="160" width="4" height="30" rx="2" fill="#16A34A"/>
  <text x="55" y="178" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#16A34A">场景1：深度研究</text>
  <text x="55" y="196" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 搜索 + 阅读大量文档</text>
  <text x="55" y="214" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 写代码 · 探索数据模型</text>
  <text x="55" y="232" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 多分支 · 反复试错</text>
  <rect x="40" y="245" width="220" height="28" rx="6" fill="#F0FDF4"/>
  <text x="150" y="264" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#16A34A">→ 只返回压缩结论</text>
  <!-- 场景2卡片 -->
  <rect x="390" y="150" width="240" height="130" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="160" width="4" height="30" rx="2" fill="#EA580C"/>
  <text x="415" y="178" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#EA580C">场景2：合规域Agent</text>
  <text x="415" y="196" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 处方审方 · 合规问答</text>
  <text x="415" y="214" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 独立审计日志 · 风控系统</text>
  <text x="415" y="232" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">• 责任归属明确</text>
  <rect x="400" y="245" width="220" height="28" rx="6" fill="#FFF7ED"/>
  <text x="510" y="264" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EA580C">→ 必须 Hand-off</text>
  <!-- Hand-off vs Delegation 对比区 -->
  <rect x="80" y="300" width="500" height="85" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="320" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1E293B">Hand-off vs Delegation</text>
  <line x1="330" y1="328" x2="330" y2="375" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="100" y="335" width="210" height="55" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="205" y="353" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#16A34A">✓ Hand-off</text>
  <text x="205" y="370" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#64748B">完整接管对话</text>
  <text x="205" y="383" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#64748B">责任清晰</text>
  <rect x="350" y="335" width="210" height="55" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="455" y="353" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#DC2626">✗ Delegation</text>
  <text x="455" y="370" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#64748B">多轮拼接 · 责任模糊</text>
  <text x="455" y="383" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#64748B">合规风险高</text>
</svg>