<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 400" width="100%" height="100%"><rect width="660" height="400" rx="12" fill="#FAFAFA"/><style>.title { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; fill: #1E293B; }.text-main { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #334155; }.text-sub { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 11px; fill: #64748B; }.badge { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; }</style><rect x="20" y="20" width="620" height="360" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="40" y="50" class="title">GPT-6 Astra: 从“外部拆解”到“内循环自主执行”</text><rect x="40" y="75" width="270" height="280" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><rect x="55" y="90" width="80" height="24" rx="12" fill="#EA580C"/><text x="95" y="106" class="badge" text-anchor="middle">传统 Workflow</text><rect x="55" y="130" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 4"/><text x="65" y="148" class="text-main" font-weight="bold">外部长 CoT Prompt</text><text x="65" y="164" class="text-sub">“手把手代替思考”提示词工程</text><rect x="55" y="190" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 4"/><text x="65" y="208" class="text-main" font-weight="bold">多 Agent 协作框架</text><text x="65" y="226" class="text-sub">复杂的工具序列与规划器</text><rect x="55" y="250" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 4"/><text x="65" y="268" class="text-main" font-weight="bold">透明推理过程</text><text x="65" y="286" class="text-sub">依赖中间 Step-by-step 文本</text><path d="M 325 215 L 335 215" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><rect x="350" y="75" width="270" height="280" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><rect x="365" y="90" width="100" height="24" rx="12" fill="#2563EB"/><text x="415" y="106" class="badge" text-anchor="middle">GPT-6 Astra Paradigm</text><rect x="365" y="130" width="240" height="105" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="375" y="150" class="title" font-size="14" fill="#1E40AF">模型内循环 (Looped)</text><path d="M 380 180 C 380 160, 430 160, 430 180 C 430 200, 380 200, 380 180" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/><polygon points="383,172 380,180 388,178" fill="#2563EB"/><text x="445" y="175" class="text-main" font-weight="bold">Recurrent Depth</text><text x="445" y="190" class="text-sub">同一输入反复打磨</text><text x="445" y="205" class="text-sub" fill="#9333EA">隐藏推理链 (内部化)</text><rect x="365" y="250" width="240" height="85" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/><text x="375" y="270" class="title" font-size="14" fill="#15803D">开发者角色变化</text><text x="375" y="292" class="text-main">• 核心工作：<tspan font-weight="bold" fill="#16A34A">观测与纠偏</tspan></text><text x="375" y="312" class="text-main">• 自动化操作：<tspan font-weight="bold" fill="#16A34A">Computer Use Session</tspan></text></svg>