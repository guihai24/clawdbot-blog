<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  <!-- Left Accent Line -->
  <rect x="50" y="40" width="4" height="220" rx="2" fill="url(#accentGrad)" />

  <!-- Text Layer -->
  <text x="70" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FAFAF9">
    <tspan x="70" dy="0">llama.cpp 1.0：本地 AI 的</tspan>
    <tspan x="70" dy="28">门槛，其实不在显卡</tspan>
  </text>

  <text x="70" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A8A29E">
    llama.cpp v1.0.0 是本地跑模型的首个稳定大版本。
  </text>

  <!-- Tag Capsules -->
  <g transform="translate(70, 240)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">上手指南</text>

    <!-- Tag 2 -->
    <rect x="90" y="0" width="75" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="127" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">llama.cpp</text>

    <!-- Tag 3 -->
    <rect x="175" y="0" width="70" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="210" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">本地AI</text>
  </g>

  <!-- Decorative Elements -->
  <g transform="translate(520, 190)" opacity="0.25">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="none" stroke="#EA580C" stroke-width="2" />
    <path d="M 20 20 L 12 30 L 20 40" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60 20 L 68 30 L 60 40" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="45" y1="18" x2="35" y2="42" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Color Bar -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>