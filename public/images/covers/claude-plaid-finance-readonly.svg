<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 散点纹理图案 -->
    <pattern id="dotTexture" x="0" y="0" width="2<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#D6A456" opacity="0.06" />
      <circle cx="13" cy="12" r="0.8" fill="#D6A456" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGradient)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2" fill="url(#accentGradient)" />

  <!-- 3. 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题：2行，每行控制在20个字以内，font-size=22px，行间距 dy=28 -->
    <text x="0" y="90" fill="#FEFCE8" font-size="22px" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <tspan x="0" dy="0">Claude 能读你两年银行流水，</tspan>
      <tspan x="0" dy="28">却动不了一分钱</tspan>
    </text>

    <!-- 副标题：font-size=13px，紧跟标题下方 -->
    <text x="0" y="158" fill="#D6A456" font-size="13px" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      Claude 通过 Plaid 接上银行账户后，能按类别拆开你的月度支出、回答「
    </text>

    <!-- 标签胶囊：y ≈ 240-260，宽 70-90px，高 24px -->
    <g transform="translate(0, 226)">
      <!-- 标签1 -->
      <rect x="0" y="0" width="82" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
      <text x="41" y="16" fill="#FDE68A" font-size="11px" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">搞钱实操</text>

      <!-- 标签2 -->
      <rect x="94" y="0" width="76" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
      <text x="132" y="16" fill="#FDE68A" font-size="11px" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI理财</text>

      <!-- 标签3 -->
      <rect x="182" y="0" width="76" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
      <text x="220" y="16" fill="#FDE68A" font-size="11px" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Claude</text>
    </g>
  </g>

  <!-- 4. 装饰元素（右下角，x >= 480, y >= 180） -->
  <g transform="translate(520, 195)" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25">
    <!-- 简笔线条风格图标：安全盾牌与账单折线组合 -->
    <path d="M35 5 L60 15 V35 C60 50 48 62 35 68 C22 62 10 50 10 35 V15 Z" />
    <polyline points="22 35 29 42 48 24" />
  </g>

  <!-- 5. 底部色条：y=293，高 7px，横贯全宽 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGradient)" />
</svg>