<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线与底部条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 背景不规则散点纹理 -->
    <pattern id="dotTexture" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="15" cy="11" r="1.2" fill="#D6D3D1" opacity="0.05" />
      <circle cx="8" cy="19" r="0.8" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2.25" fill="url(#accentGrad)" />

  <!-- 3. 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (最多20个字每行，共2行) -->
    <text x="0" y="92" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
      <tspan x="0" dy="0">别把Claude当聊天框：关掉电脑</tspan>
      <tspan x="0" dy="30">PPT也能做完</tspan>
    </text>

    <!-- 副标题 -->
    <text x="0" y="165" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      Claude 把 Cowork、聊天、Docs、Slides、Design 全塞
    </text>

    <!-- 标签胶囊 (y ≈ 240-260) -->
    <g transform="translate(0, 230)">
      <!-- 标签 1 -->
      <rect x="0" y="0" width="82" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="41" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">上手指南</text>

      <!-- 标签 2 -->
      <rect x="94" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="132" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Claude</text>

      <!-- 标签 3 -->
      <rect x="182" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="220" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">效率工具</text>
    </g>
  </g>

  <!-- 4. 装饰元素 (仅在右下角 x >= 480, y >= 180) -->
  <g transform="translate(515, 185)" opacity="0.25">
    <!-- 文档/幻灯片简笔几何图形组合 -->
    <rect x="0" y="10" width="45" height="55" rx="3" fill="none" stroke="#EA580C" stroke-width="2" />
    <line x1="8" y1="24" x2="30" y2="24" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="36" x2="37" y2="36" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="48" x2="22" y2="48" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />

    <rect x="35" y="0" width="55" height="42" rx="3" fill="none" stroke="#F59E0B" stroke-width="2" />
    <circle cx="48" cy="16" r="5" fill="none" stroke="#F59E0B" stroke-width="2" />
    <line x1="58" y1="14" x2="78" y2="14" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="28" x2="78" y2="28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

    <!-- 运行标志点缀 -->
    <circle cx="95" cy="55" r="4" fill="#EA580C" />
    <path d="M 82 55 L 88 55" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>