<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 散点颗粒纹理图案 -->
    <pattern id="noise-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="18" cy="24" r="1.5" fill="#D6D3D1" opacity="0.06" />
      <circle cx="33" cy="12" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="12" cy="35" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="28" cy="38" r="1.2" fill="#D6D3D1" opacity="0.06" />
      <circle cx="37" cy="28" r="0.8" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bg-grad)" />
  <rect width="660" height="300" fill="url(#noise-pattern)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4" height="210" rx="2" fill="url(#accent-grad)" />

  <!-- 3. 文字层 -->
  <text fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="22">
    <tspan x="70" y="75">GPT-6 Astra 不只更聪明：looped</tspan>
    <tspan x="70" dy="28">transformer 时代，技术人要重</tspan>
    <tspan x="70" dy="28">构哪几类工作流</tspan>
  </text>

  <text x="70" y="172" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="400" font-size="13">
    GPT-6 Astra 在数学、编码和电脑操作上的表现已经压过上一代模型，但真正
  </text>

  <!-- 标签胶囊 -->
  <!-- 标签 1 -->
  <rect x="70" y="215" width="130" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="135" y="231" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" text-anchor="middle">looped transformer</text>

  <!-- 标签 2 -->
  <rect x="208" y="215" width="90" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="253" y="231" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" text-anchor="middle">工作流重构</text>

  <!-- 标签 3 -->
  <rect x="306" y="215" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="344" y="231" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" text-anchor="middle">上手指南</text>

  <!-- 4. 右下角角落装饰元素 (x >= 480, y >= 180) -->
  <g transform="translate(530, 200)" opacity="0.25">
    <!-- 循环深度/Looped Transformer 概念图 (嵌套循环圆弧与内部节点) -->
    <path d="M 0 -32 A 32 32 0 1 1 -22.6 22.6" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -22.6 22.6 L -28 16 M -22.6 22.6 L -16 18" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 0 20 A 20 20 0 1 1 14.1 -14.1" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />
    <path d="M 14.1 -14.1 L 18 -8 M 14.1 -14.1 L 8 -12" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 内部核心节点 -->
    <circle cx="0" cy="0" r="5" fill="#EA580C" />
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accent-grad)" />
</svg>