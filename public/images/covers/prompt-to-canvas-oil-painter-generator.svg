<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <!-- 定义样式和滤镜 -->
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 颗粒感纹理 -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="13" cy="11" r="1.2" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  <!-- 左侧强调线 -->
  <rect x="50" y="45" width="4" height="210" rx="2" fill="url(#accentGrad)" />

  <!-- 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (最多20个汉字每行，font-size=22px，行间距 dy=28) -->
    <text x="0" y="85" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22px" font-weight="bold">
      <tspan x="0" dy="0">一句Prompt让AI写出油画生成器：</tspan>
      <tspan x="0" dy="28">零外部依赖的Canvas玩法</tspan>
    </text>

    <!-- 副标题 (font-size=13px，紧跟标题下方) -->
    <text x="0" y="148" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px">
      怎么用一句 Prompt 让大模型直接吐出一个能把照片变成油画的网页互动工具？
    </text>

    <!-- 标签胶囊 (y ≈ 240-260，宽 70-90px，高 24px) -->
    <g transform="translate(0, 235)">
      <!-- 标签 1 -->
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="38" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">上手指南</text>

      <!-- 标签 2 -->
      <rect x="86" y="0" width="64" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="118" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">Canvas</text>

      <!-- 标签 3 -->
      <rect x="160" y="0" width="64" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="192" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">Prompt</text>
    </g>
  </g>

  <!-- 装饰元素 (仅在右下角 x ≥ 480, y ≥ 180 区域内，简笔线条风格，opacity 0.15-0.3) -->
  <g transform="translate(520, 185)" opacity="0.25">
    <!-- 画框 / Canvas 几何图标 -->
    <rect x="0" y="0" width="80" height="60" rx="4" fill="none" stroke="#F59E0B" stroke-width="2" />
    <path d="M 12 45 L 30 25 L 48 40 L 60 28 L 68 45 Z" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="24" cy="20" r="6" fill="none" stroke="#F59E0B" stroke-width="1.5" />
    <!-- 代码/笔刷点缀线条 -->
    <path d="M -15 20 L -5 30 L -15 40" fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 95 20 L 85 30 L 95 40" fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 底部色条 (y=293，高 7px，横贯全宽) -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>