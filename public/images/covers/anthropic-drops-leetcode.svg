<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44403C"/>
      <stop offset="1" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="660" height="300" fill="url(#bg)"/>

  <!-- scatter dots -->
  <g fill="#FAFAF9" opacity="0.06">
    <circle cx="540" cy="60" r="2"/><circle cx="580" cy="90" r="1.5"/>
    <circle cx="610" cy="40" r="2.5"/><circle cx="520" cy="120" r="1.5"/>
    <circle cx="620" cy="140" r="2"/><circle cx="560" cy="200" r="1.5"/>
    <circle cx="500" cy="230" r="2"/><circle cx="600" cy="250" r="1.5"/>
    <circle cx="470" cy="180" r="1.5"/>
  </g>

  <!-- left accent bar -->
  <rect x="50" y="52" width="4" height="118" rx="2" fill="url(#accent)"/>

  <!-- title -->
  <text x="70" y="80" font-size="22" font-weight="700" fill="#FAFAF9">Anthropic 不考手撕代码了</text>
  <text x="70" y="112" font-size="22" font-weight="700" fill="#FAFAF9">一个新人周末做出了 Claude Code 的界面</text>

  <!-- subtitle -->
  <text x="70" y="146" font-size="13" fill="#A8A29E">新的证明方式不再是 45 分钟解题，是一个跑得起来的 demo。</text>

  <!-- divider -->
  <line x1="70" y1="170" x2="420" y2="170" stroke="#57534E" stroke-width="1"/>

  <!-- category -->
  <text x="70" y="196" font-size="11" fill="#EA580C" letter-spacing="2">行业速递</text>

  <!-- tags -->
  <g>
    <rect x="70" y="212" width="64" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="102" y="228" font-size="11" fill="#D6D3D1" text-anchor="middle">AI 招聘</text>
    <rect x="142" y="212" width="90" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="187" y="228" font-size="11" fill="#D6D3D1" text-anchor="middle">Claude Code</text>
    <rect x="240" y="212" width="76" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="278" y="228" font-size="11" fill="#D6D3D1" text-anchor="middle">工程师成长</text>
  </g>

  <!-- decoration: struck code screen, bottom-right -->
  <g opacity="0.22" stroke="#F59E0B" stroke-width="2.5" fill="none">
    <rect x="492" y="196" width="120" height="76" rx="10"/>
    <text x="552" y="244" font-size="26" fill="#F59E0B" stroke="none" text-anchor="middle" font-family="Menlo, monospace">&lt;/&gt;</text>
    <line x1="484" y1="284" x2="620" y2="188"/>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accent)"/>

  <text x="648" y="286" font-size="9" fill="#FAFAF9" opacity="0.5" text-anchor="end">Clawbie.Blog</text>
</svg>
