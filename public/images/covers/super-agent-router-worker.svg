<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线及底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 散点纹理图案 -->
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="12" cy="15" r="1.2" fill="#D6D3D1" opacity="0.06" />
      <circle cx="17" cy="8" r="0.8" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 (x=50, 宽 4px) -->
  <rect x="50" y="45" width="4" height="210" rx="2" fill="url(#accentGrad)" />

  <!-- 3. 文字层 (x=70 开始) -->
  <g transform="translate(70, 0)">
    <!-- 标题 (font-size=22px 粗体, 2行, dy=28) -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22px" font-weight="bold" fill="#FAFAF9">
      <tspan x="0" dy="0">同时开 10 个 AI 任务也不乱：</tspan>
      <tspan x="0" dy="28">一个对话管所有 Agent</tspan>
    </text>

    <!-- 副标题 (font-size=13px, 一行, 紧跟标题下方) -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px" fill="#A8A29E">
      AI 会话开到第 6 个窗口你就盯不住了——真正的瓶颈不是模型能力，是你的注意力
    </text>

    <!-- 标签胶囊 (y ≈ 240-260，宽 70-90px，高 24px) -->
    <g transform="translate(0, 230)">
      <!-- 标签 1: 上手指南 -->
      <g transform="translate(0, 0)">
        <rect width="78" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="39" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">上手指南</text>
      </g>
      <!-- 标签 2: Agent -->
      <g transform="translate(86, 0)">
        <rect width="70" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="35" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">Agent</text>
      </g>
      <!-- 标签 3: 架构设计 -->
      <g transform="translate(164, 0)">
        <rect width="78" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="39" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">架构设计</text>
      </g>
    </g>
  </g>

  <!-- 4. 装饰元素 (右下角 x ≥ 480, y ≥ 180 区域内，简笔线条风格，opacity 0.2) -->
  <g transform="translate(515, 195)" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25">
    <!-- 主脑/节点中心 -->
    <circle cx="45" cy="40" r="14" />
    <circle cx="45" cy="40" r="4" fill="#EA580C" />
    <!-- 周围分发节点 (Worker 矩阵) -->
    <circle cx="15" cy="15" r="8" />
    <circle cx="75" cy="15" r="8" />
    <circle cx="15" cy="65" r="8" />
    <circle cx="75" cy="65" r="8" />
    <!-- 连接线 -->
    <line x1="33" y1="30" x2="21" y2="21" />
    <line x1="57" y1="30" x2="69" y2="21" />
    <line x1="33" y1="50" x2="21" y2="59" />
    <line x1="57" y1="50" x2="69" y2="59" />
  </g>

  <!-- 5. 底部色条 (y=293，高 7px，横贯全宽) -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>