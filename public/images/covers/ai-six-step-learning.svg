<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="accentGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 背景层 -->
  <rect x="0" y="0" width="660" height="300" fill="url(#bgGrad)"/>

  <!-- 纸张颗粒纹理 -->
  <g fill="#D6D3D1" opacity="0.06">
    <circle cx="90" cy="40" r="1.6"/>
    <circle cx="150" cy="72" r="1.1"/>
    <circle cx="214" cy="30" r="1.8"/>
    <circle cx="282" cy="56" r="1.2"/>
    <circle cx="344" cy="24" r="1.5"/>
    <circle cx="404" cy="62" r="1.0"/>
    <circle cx="462" cy="34" r="1.7"/>
    <circle cx="522" cy="70" r="1.3"/>
    <circle cx="582" cy="38" r="1.6"/>
    <circle cx="632" cy="82" r="1.1"/>
    <circle cx="70" cy="182" r="1.4"/>
    <circle cx="132" cy="222" r="1.0"/>
    <circle cx="202" cy="168" r="1.8"/>
    <circle cx="262" cy="212" r="1.2"/>
    <circle cx="322" cy="188" r="1.5"/>
    <circle cx="382" cy="232" r="1.1"/>
    <circle cx="442" cy="174" r="1.7"/>
    <circle cx="502" cy="216" r="1.2"/>
    <circle cx="562" cy="184" r="1.4"/>
    <circle cx="622" cy="242" r="1.6"/>
    <circle cx="112" cy="112" r="1.3"/>
    <circle cx="252" cy="100" r="1.5"/>
    <circle cx="432" cy="122" r="1.1"/>
    <circle cx="592" cy="132" r="1.4"/>
    <circle cx="82" cy="272" r="1.2"/>
    <circle cx="302" cy="278" r="1.6"/>
    <circle cx="482" cy="272" r="1.1"/>
  </g>

  <!-- 左侧强调线 -->
  <rect x="50" y="40" width="5" height="210" rx="2.5" fill="url(#accentGrad)"/>

  <!-- 标题 -->
  <text font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FAFAF9">
    <tspan x="70" y="102">用 AI 六步读懂陌生领域</tspan>
    <tspan x="70" y="130">三天后还能讲出来</tspan>
  </text>

  <!-- 副标题 -->
  <text x="70" y="164" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#A8A29E">卡住你的不是资料太少，是模型一次给得太多</text>

  <!-- 标签胶囊 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#D6D3D1">
    <rect x="70" y="238" width="88" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="114" y="254" text-anchor="middle">六步学习法</text>

    <rect x="168" y="238" width="76" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="206" y="254" text-anchor="middle">理解产物</text>

    <rect x="254" y="238" width="76" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="292" y="254" text-anchor="middle">上手指南</text>
  </g>

  <!-- 右下角装饰：六级台阶 -->
  <g fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <path d="M500,262 L520,262 L520,248 L540,248 L540,234 L560,234 L560,220 L580,220 L580,206 L600,206 L600,192 L620,192"/>
    <circle cx="620" cy="192" r="4"/>
  </g>
  <g fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <circle cx="500" cy="262" r="3.5"/>
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGradH)"/>
</svg>