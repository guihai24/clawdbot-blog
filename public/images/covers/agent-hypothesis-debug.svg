<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grain" width="97" height="89" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="9" r="1.2" fill="#D6D3D1"/>
      <circle cx="34" cy="27" r="1.6" fill="#D6D3D1"/>
      <circle cx="62" cy="12" r="1.1" fill="#D6D3D1"/>
      <circle cx="84" cy="41" r="1.7" fill="#D6D3D1"/>
      <circle cx="19" cy="52" r="1.4" fill="#D6D3D1"/>
      <circle cx="47" cy="66" r="1.2" fill="#D6D3D1"/>
      <circle cx="72" cy="78" r="1.5" fill="#D6D3D1"/>
      <circle cx="91" cy="63" r="1.1" fill="#D6D3D1"/>
      <circle cx="5" cy="78" r="1.3" fill="#D6D3D1"/>
      <circle cx="55" cy="44" r="1" fill="#D6D3D1"/>
      <circle cx="29" cy="85" r="1.4" fill="#D6D3D1"/>
      <circle cx="78" cy="16" r="1" fill="#D6D3D1"/>
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)"/>
  <rect width="660" height="300" fill="url(#grain)" opacity="0.06"/>

  <!-- 左侧强调线 -->
  <rect x="50" y="62" width="5" height="182" rx="2.5" fill="url(#accentGrad)"/>

  <!-- 文字层 -->
  <text font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FAFAF9">
    <tspan x="70" y="106">AI调试老跑偏？</tspan>
    <tspan x="70" y="134">用假设实验法救回来</tspan>
  </text>

  <text x="70" y="168" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#A8A29E">把发现写进 MD，用假设—实验—验证循环推进排查</text>

  <!-- 标签胶囊 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#D6D3D1">
    <rect x="70" y="237" width="92" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="116" y="253" text-anchor="middle">假设实验法</text>

    <rect x="172" y="237" width="86" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="215" y="253" text-anchor="middle">MD 笔记</text>

    <rect x="268" y="237" width="86" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="311" y="253" text-anchor="middle">排查模板</text>
  </g>

  <!-- 右下角装饰：假设—实验—验证 循环 -->
  <g opacity="0.2" fill="none" stroke="#F59E0B" stroke-width="2">
    <circle cx="560" cy="196" r="7"/>
    <circle cx="597" cy="258" r="7"/>
    <circle cx="523" cy="258" r="7"/>
    <path d="M566 203 L590 249" stroke-linecap="round"/>
    <path d="M589 262 C 570 270 552 270 533 263" stroke-linecap="round"/>
    <path d="M530 251 L520 257" stroke-linecap="round"/>
    <path d="M524 246 L519 256 L529 258" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity="0.18" fill="none" stroke="#A8A29E" stroke-width="1.6">
    <circle cx="616" cy="204" r="16"/>
    <path d="M604 216 L592 230" stroke-linecap="round"/>
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#barGrad)"/>
</svg>