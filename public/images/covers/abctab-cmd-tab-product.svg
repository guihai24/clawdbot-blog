<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 颗粒感纹理 -->
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6A456" opacity="0.06" />
      <circle cx="13" cy="11" r="1" fill="#D6A456" opacity="0.04" />
      <circle cx="8" cy="17" r="0.8" fill="#D6A456" opacity="0.05" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="55" width="4" height="190" rx="2" fill="url(#accentGrad)" />

  <!-- 3. 文字层 -->
  <!-- 标题 (font-size=22px, dy=28) -->
  <text x="75" y="95" fill="#FEFCE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold">
    <tspan x="75" dy="0">⌘Tab 太慢这件小事，</tspan>
    <tspan x="75" dy="28">有人做成了付费软件</tspan>
  </text>

  <!-- 副标题 (font-size=13px) -->
  <text x="75" y="166" fill="#D6A456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    ⌘Tab 一格格翻窗口的摩擦小到没人提，却能做成收费软件。
  </text>

  <!-- 标签胶囊 (y ≈ 215-240) -->
  <g transform="translate(75, 212)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
    <!-- 标签 1 -->
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
    <text x="38" y="16" fill="#FDE68A" text-anchor="middle">搞钱实操</text>

    <!-- 标签 2 -->
    <rect x="86" y="0" width="86" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
    <text x="129" y="16" fill="#FDE68A" text-anchor="middle">效率工具</text>

    <!-- 标签 3 -->
    <rect x="182" y="0" width="76" height="24" rx="12" fill="#92400E" fill-opacity="0.4" />
    <text x="220" y="16" fill="#FDE68A" text-anchor="middle">产品灵感</text>
  </g>

  <!-- 4. 装饰元素 (右下角 x ≥ 480, y ≥ 180) -->
  <g transform="translate(540, 195)" opacity="0.25">
    <!-- 键盘按键与快捷键符号线条 -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <text x="24" y="31" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⌘</text>
    
    <!-- 向右箭头 -->
    <path d="M 58 24 L 78 24 M 70 16 L 78 24 L 70 32" fill="none" stroke="#D6A456" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 字母按键 -->
    <rect x="88" y="0" width="48" height="48" rx="8" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <text x="112" y="31" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">A</text>
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>