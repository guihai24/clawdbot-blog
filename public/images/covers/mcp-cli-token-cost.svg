<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F4A3C"/>
      <stop offset="100%" stop-color="#1A2218"/>
    </linearGradient>
    
    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B9A6D"/>
      <stop offset="100%" stop-color="#6B7A4E"/>
    </linearGradient>

    <!-- 标签胶囊背景色 -->
    <linearGradient id="tagBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A664F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5A664F" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 散点颗粒纹理图案 -->
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#A8B89A" opacity="0.06"/>
      <circle cx="12" cy="14" r="0.8" fill="#A8B89A" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)"/>
  <rect width="660" height="300" fill="url(#dotTexture)"/>

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2.25" fill="url(#accentGrad)"/>

  <!-- 3. 文字层 (从 x=70 开始) -->
  <!-- 标题：font-size=22px 粗体，2行，dy=28 -->
  <text x="70" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#F0F4EC">
    <tspan x="70" dy="0">MCP 同一任务烧 5.9 万 Token，</tspan>
    <tspan x="70" dy="32">CLI 只花 1400</tspan>
  </text>

  <!-- 副标题：font-size=13px，一行，紧跟标题下方 -->
  <text x="70" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A8B89A">
    MCP 同一任务烧 59,417 个 Token，CLI 只需 1,421 个。
  </text>

  <!-- 标签胶囊：在封面底部区域 y ≈ 240-260，宽 70-90px，高 24px，圆角 -->
  <!-- 标签 1: 行业速递 -->
  <rect x="70" y="237" width="76" height="24" rx="12" fill="#5A664F" fill-opacity="0.4"/>
  <text x="108" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#D4DEC8" text-anchor="middle">行业速递</text>

  <!-- 标签 2: MCP -->
  <rect x="156" y="237" width="56" height="24" rx="12" fill="#5A664F" fill-opacity="0.4"/>
  <text x="184" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#D4DEC8" text-anchor="middle">MCP</text>

  <!-- 标签 3: Token 优化 -->
  <rect x="222" y="237" width="84" height="24" rx="12" fill="#5A664F" fill-opacity="0.4"/>
  <text x="264" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#D4DEC8" text-anchor="middle">Token 优化</text>

  <!-- 4. 装饰元素 (只能放在右下角，x ≥ 480, y ≥ 180 的区域内，简笔线条风格，opacity 0.15-0.3) -->
  <g transform="translate(520, 195)" stroke="#A8B89A" stroke-width="2" fill="none" opacity="0.22" stroke-linecap="round" stroke-linejoin="round">
    <!-- 柱状图简笔图标 -->
    <rect x="0" y="25" width="12" height="35" rx="2"/>
    <rect x="20" y="10" width="12" height="50" rx="2"/>
    <rect x="40" y="35" width="12" height="25" rx="2"/>
    <line x1="-5" y1="60" x2="55" y2="60" stroke-width="1.5"/>
  </g>

  <!-- 5. 底部色条：y=293，高 7px，横贯全宽 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)"/>
</svg>