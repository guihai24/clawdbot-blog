<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <!-- 定义区 -->
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 纸张颗粒感纹理 -->
    <pattern id="noise" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="70" cy="40" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="40" cy="80" r="1.2" fill="#D6D3D1" opacity="0.06" />
      <circle cx="90" cy="90" r="0.8" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#noise)" />

  <!-- 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2" fill="url(#accentGrad)" />

  <!-- 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (最多2行，font-size=22px, dy=28) -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FAFAF9">
      <tspan x="0" dy="0">断网也能让 AI 改代码？</tspan>
      <tspan x="0" dy="28">关键不在模型，在你的硬盘</tspan>
    </text>

    <!-- 副标题 -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8A29E">
      当工程师把 OpenCode、Ollama 和 Qwen 装进笔记本拔掉网线...
    </text>

    <!-- 标签胶囊区域 (y ≈ 240-260) -->
    <g transform="translate(0, 222)">
      <!-- 标签 1: 上手指南 -->
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">上手指南</text>

      <!-- 标签 2: 离线AI -->
      <rect x="90" y="0" width="75" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="127.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">离线AI</text>

      <!-- 标签 3: 本地部署 -->
      <rect x="175" y="0" width="75" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="212.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">本地部署</text>
    </g>
  </g>

  <!-- 装饰元素（严格限制在右下角 x ≥ 480, y ≥ 180） -->
  <g transform="translate(510, 195)" opacity="0.25">
    <!-- 简笔线条风格：笔记本/硬盘几何图形与代码符号 -->
    <rect x="0" y="5" width="70" height="50" rx="4" fill="none" stroke="#EA580C" stroke-width="2" />
    <line x1="10" y1="20" x2="35" y2="20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="30" x2="50" y2="30" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="40" x2="25" y2="40" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
    <!-- 磁盘指示灯点 -->
    <circle cx="58" cy="20" r="3" fill="#EA580C" />
    <circle cx="58" cy="30" r="3" fill="#A8A29E" opacity="0.5" />
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>