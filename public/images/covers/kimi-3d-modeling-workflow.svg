<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="13" cy="12" r="1.2" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  
  <rect x="50" y="45" width="4.5" height="195" rx="2.25" fill="url(#accentGrad)" />

  
  <g transform="translate(72, 0)">
    
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19.8" font-weight="bold" fill="#FAFAF9">
      <tspan x="0" dy="0">Kimi 3D 教程没讲透的三道坎：</tspan>
      <tspan x="0" dy="30">不会 Blender 的人最容易踩</tspan>
    </text>

    
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A8A29E">
      Kimi K3.1 Pro 官方 3D 教程把流程走通了，但从「能生成」到「能交付」...
    </text>

    
    <g transform="translate(0, 218)">
      
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">上手指南</text>

      
      <rect x="86" y="0" width="68" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="120" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">Kimi 3D</text>

      
      <rect x="164" y="0" width="60" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="194" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">Blender</text>
    </g>
  </g>

  
  <g transform="translate(520, 185)" opacity="0.25">
    
    <path d="M40 10 L75 30 L75 70 L40 90 L5 70 L5 30 Z" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" />
    <path d="M40 10 L40 50 L75 70" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M40 50 L5 70" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="40" cy="50" r="3" fill="#FAFAF9" />
  </g>

  
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>