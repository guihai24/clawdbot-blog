<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <!-- 定义样式和纹理 -->
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 背景散点纹理图案 -->
    <pattern id="dotTexture" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#D6A456" opacity="0.06" />
      <circle cx="20" cy="18" r="1.5" fill="#D6A456" opacity="0.06" />
      <circle cx="12" cy="25" r="0.8" fill="#D6A456" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGradient)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2" fill="url(#accentGradient)" />

  <!-- 3. 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (多行，每行控制字数) -->
    <text x="0" y="85" fill="#FEFCE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="22px">
      <tspan x="0" dy="0">Kimi K3.1 Pro 开放权重：</tspan>
      <tspan x="0" dy="28">100万上下文如何用来做复杂业务自动化</tspan>
    </text>

    <!-- 副标题 -->
    <text x="0" y="155" fill="#D6A456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px">
      月之暗面发布的 Kimi K3.1 Pro 带来了 100 万 token 上下文与开放权重
    </text>

    <!-- 标签胶囊 (y ≈ 240-260) -->
    <g transform="translate(0, 222)">
      <!-- 标签 1: 搞钱实操 -->
      <g transform="translate(0, 0)">
        <rect width="80" height="24" rx="12" fill="#92400E" fill-opacity="0.4" stroke="#D6A456" stroke-opacity="0.3" stroke-width="1" />
        <text x="40" y="16" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">搞钱实操</text>
      </g>

      <!-- 标签 2: 业务自动化 -->
      <g transform="translate(90, 0)">
        <rect width="90" height="24" rx="12" fill="#92400E" fill-opacity="0.4" stroke="#D6A456" stroke-opacity="0.3" stroke-width="1" />
        <text x="45" y="16" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">业务自动化</text>
      </g>

      <!-- 标签 3: AI大模型 -->
      <g transform="translate(190, 0)">
        <rect width="80" height="24" rx="12" fill="#92400E" fill-opacity="0.4" stroke="#D6A456" stroke-opacity="0.3" stroke-width="1" />
        <text x="40" y="16" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">长文本推理</text>
      </g>
    </g>
  </g>

  <!-- 4. 装饰元素 (仅在右下角 x ≥ 480, y ≥ 180 区域) -->
  <g transform="translate(540, 195)" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- 抽象的自动化与长文本连接线条与节点图标 -->
    <circle cx="35" cy="35" r="30" stroke-dasharray="4 4" />
    <circle cx="35" cy="35" r="12" fill="#D6A456" fill-opacity="0.15" />
    <path d="M5 35 L15 35" />
    <path d="M55 35 L65 35" />
    <path d="M35 5 L35 15" />
    <path d="M35 55 L35 65" />
    <circle cx="35" cy="35" r="3" fill="#F59E0B" />
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGradient)" />
</svg>