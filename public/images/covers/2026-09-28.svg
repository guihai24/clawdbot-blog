<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="12" cy="8" r="0.8" fill="#D6D3D1" opacity="0.05" />
      <circle cx="7" cy="15" r="1.2" fill="#D6D3D1" opacity="0.04" />
      <circle cx="17" cy="17" r="0.9" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  
  <rect x="50" y="45" width="4.5" height="210" rx="2" fill="url(#accentGrad)" />

  
  <text x="70" y="80" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17.82" font-weight="bold">
    <tspan x="70" dy="0">普通笔记本跑744B GLM？Colibrì</tspan>
    <tspan x="70" dy="28">用SSD当显存，24GB内存也能跑</tspan>
  </text>

  
  <text x="70" y="148" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px">
    744B参数模型在家用机运行，用SSD扩展显存玩转MoE推理
  </text>

  
  
  <g transform="translate(70, 238)">
    <rect width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">上手指南</text>
  </g>

  
  <g transform="translate(160, 238)">
    <rect width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">模型推理</text>
  </g>

  
  <g transform="translate(250, 238)">
    <rect width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">SSD缓存</text>
  </g>

  
  <g transform="translate(530, 195)" stroke="#EA580C" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round" stroke-linejoin="round">
    
    <rect x="0" y="10" width="55" height="40" rx="6" />
    <circle cx="15" cy="30" r="4" />
    <line x1="28" y1="22" x2="45" y2="22" />
    <line x1="28" y1="38" x2="45" y2="38" />
    
    
    <path d="M 55 30 L 75 30 L 75 50" />
    <circle cx="75" cy="50" r="3" fill="#EA580C" />
