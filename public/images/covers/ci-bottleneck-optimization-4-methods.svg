<svg width="660" height="300" viewBox="0 0 660 300" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D6D3D1" opacity="0.06" />
      <circle cx="14" cy="14" r="1.2" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dots)" />

  <!-- 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="175" rx="2" fill="url(#accentGrad)" />

  <!-- 文字层 -->
  <text x="75" y="78" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22">
    <tspan x="75" dy="0">代码生成速度翻倍后 CI 成瓶颈？</tspan>
    <tspan x="75" dy="28">5 分钟 PR 等待的 4 大优化打法</tspan>
  </text>

  <text x="75" y="148" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
    AI Agent 把代码写得飞快，CI 验证却成了瓶颈？Linear 工程师把
  </text>

  <!-- 标签胶囊区 (y ≈ 240-260) -->
  <g transform="translate(75, 238)">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="38" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">上手指南</text>

    <rect x="88" y="0" width="70" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="123" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">CI优化</text>

    <rect x="170" y="0" width="82" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="211" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">AI工程化</text>
  </g>

  <!-- 装饰元素 (x ≥ 480, y ≥ 180) -->
  <g transform="translate(535, 205)" opacity="0.25">
    <path d="M 0 30 L 25 5 L 50 30 L 25 55 Z" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="25" cy="30" r="10" fill="none" stroke="#F59E0B" stroke-width="2" />
    <line x1="25" y1="-8" x2="25" y2="2" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
    <line x1="58" y1="30" x2="48" y2="30" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
    <line x1="25" y1="58" x2="25" y2="68" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>