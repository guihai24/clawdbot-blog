<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 散点纹理图案 -->
    <pattern id="dotTexture" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="20" cy="15" r="1.5" fill="#D6D3D1" opacity="0.06" />
      <circle cx="12" cy="25" r="1" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2.25" fill="url(#accentGrad)" />

  <!-- 3. 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (最多每行20个汉字，两行，font-size=22px，行间距 dy=28) -->
    <text x="0" y="95" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="22px">
      <tspan x="0" dy="0">Claude Sonnet 5.5 来了，</tspan>
      <tspan x="0" dy="28">速度快 30% 成本降 30%，你还用 Opus 吗？</tspan>
    </text>

    <!-- 副标题 (font-size=13px，一行，紧跟标题下方) -->
    <text x="0" y="166" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px">
      Anthropic 发布 Claude Sonnet 5.5，速度快 30% 成本降 30%
    </text>

    <!-- 标签胶囊 (y ≈ 240-260) -->
    <g transform="translate(0, 238)">
      <!-- 标签 1: 独立开发 -->
      <g transform="translate(0, 0)">
        <rect width="78" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="39" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">独立开发</text>
      </g>
      <!-- 标签 2: 模型对比 -->
      <g transform="translate(86, 0)">
        <rect width="78" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="39" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">模型对比</text>
      </g>
      <!-- 标签 3: 上手指南 -->
      <g transform="translate(172, 0)">
        <rect width="78" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
        <text x="39" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">上手指南</text>
      </g>
    </g>
  </g>

  <!-- 4. 装饰元素 (只能放在右下角，x ≥ 480, y ≥ 180 的区域内，简笔线条风格，opacity 0.2) -->
  <g transform="translate(520, 195)" stroke="#EA580C" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- 闪电/速度图标 -->
    <path d="M 35 5 L 15 32 L 30 32 L 15 55 L 45 25 L 28 25 Z" />
    <!-- 附加几何小装饰 -->
    <circle cx="75" cy="15" r="12" stroke-dasharray="3 3" />
    <path d="M 65 45 L 85 45 M 75 35 L 75 55" />
  </g>

  <!-- 5. 底部色条 (y=293，高 7px，横贯全宽) -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>