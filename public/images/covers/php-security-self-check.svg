<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 散点纹理 -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="13" cy="12" r="1.2" fill="#D6D3D1" opacity="0.05" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="55" width="4.5" height="185" rx="2" fill="url(#accentGrad)" />

  <!-- 3. 文字层 -->
  <!-- 标题 (x=70, 最多2行，每行约20字以内) -->
  <text x="70" y="95" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold">
    <tspan x="70" dy="0">PHP 漏洞自查：老网站没出事，</tspan>
    <tspan x="70" dy="30">不代表它安全</tspan>
  </text>

  <!-- 副标题 -->
  <text x="70" y="165" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
    使用 Codex 检查工具排查风险，建立可反复执行的安全维护流程
  </text>

  <!-- 标签胶囊 (y ≈ 235-260) -->
  <!-- 标签 1: 漏洞自查 -->
  <rect x="70" y="235" width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="110" y="251" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">漏洞自查</text>

  <!-- 标签 2: 网站安全 -->
  <rect x="158" y="235" width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="198" y="251" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">网站安全</text>

  <!-- 标签 3: 上手指南 -->
  <rect x="246" y="235" width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
  <text x="286" y="251" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">上手指南</text>

  <!-- 4. 装饰元素 (仅在右下角 x ≥ 480, y ≥ 180) -->
  <g transform="translate(540, 195)" opacity="0.25">
    <!-- 盾牌外框 -->
    <path d="M 30 5 L 55 15 C 55 35 45 50 30 60 C 15 50 5 35 5 15 Z" fill="none" stroke="#EA580C" stroke-width="3" stroke-linejoin="round" />
    <!-- 内部安全勾 -->
    <path d="M 18 30 L 26 38 L 42 20" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 辅助几何点缀 -->
    <circle cx="30" cy="-5" r="2" fill="#D6D3D1" />
    <circle cx="-10" cy="20" r="1.5" fill="#D6D3D1" />
    <circle cx="70" cy="40" r="2" fill="#D6D3D1" />
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>