<svg width="660" height="300" viewBox="0 0 660 300" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 纸张颗粒感纹理 -->
    <pattern id="dotTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="13" cy="11" r="1.2" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotTexture)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="45" width="4" height="210" rx="2" fill="url(#accentGrad)" />

  <!-- 3. 文字层 (x=70 开始) -->
  <!-- 标题：22px 粗体，2-3行，每行最多20个汉字，行间距 dy=28 -->
  <text x="70" y="95" fill="#FAFAF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold">
    <tspan x="70" dy="0">AI 接管桌面后：我能少做</tspan>
    <tspan x="70" dy="28">哪些重复工作</tspan>
  </text>

  <!-- 副标题：13px，紧跟标题下方 -->
  <text x="70" y="165" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
    AI Agent 开始用鼠标、键盘和终端操作桌面后，普通人可以把哪些重复工作交给
  </text>

  <!-- 标签胶囊：y ≈ 240-260，宽 70-90px，高 24px，圆角 -->
  <!-- 标签 1：上手指南 -->
  <g transform="translate(70, 238)">
    <rect width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">上手指南</text>
  </g>

  <!-- 标签 2：AI Agent -->
  <g transform="translate(160, 238)">
    <rect width="80" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="40" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">AI Agent</text>
  </g>

  <!-- 标签 3：桌面自动化 -->
  <g transform="translate(250, 238)">
    <rect width="84" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
    <text x="42" y="16" fill="#D6D3D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">桌面自动化</text>
  </g>

  <!-- 4. 装饰元素 (只能放在右下角，x >= 480, y >= 180 区域内) -->
  <g transform="translate(525, 205)" opacity="0.25" stroke="#EA580C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 简笔线条风格：电脑/终端窗口图标与指针 -->
    <rect x="-10" y="-10" width="70" height="48" rx="6" />
    <line x1="-10" y1="6" x2="60" y2="6" />
    <circle cx="2" cy="-2" r="1.5" fill="#EA580C" />
    <circle cx="7" cy="-2" r="1.5" fill="#EA580C" />
    <circle cx="12" cy="-2" r="1.5" fill="#EA580C" />
    <!-- 鼠标指针简笔线条 -->
    <path d="M 35 15 L 45 40 L 50 32 L 58 32 Z" fill="#EA580C" fill-opacity="0.2" />
  </g>

  <!-- 5. 底部色条：y=293，高 7px，横贯全宽 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>