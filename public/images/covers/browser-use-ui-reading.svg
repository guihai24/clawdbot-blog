  <!-- 左侧强调线 -->
  <rect x="50" y="58" width="5" height="204" rx="2.5" fill="url(#accGrad)"/>

  <!-- 标题 -->
  <text x="70" y="98" fill="#FAFAF9" font-size="22" font-weight="700" letter-spacing="0.5">
    <tspan x="70" dy="0">AI 操作网页总翻车？</tspan>
    <tspan x="70" dy="28">先懂界面读取</tspan>
  </text>

  <!-- 副标题 -->
  <text x="70" y="160" fill="#A8A29E" font-size="13" letter-spacing="0.3">拆解截图、DOM、无障碍树三种读取方式</text>

  <!-- 标签胶囊 -->
  <g>
    <rect x="70" y="234" width="72" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="106" y="250" fill="#D6D3D1" font-size="12" text-anchor="middle">截图</text>

    <rect x="152" y="234" width="68" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="186" y="250" fill="#D6D3D1" font-size="12" text-anchor="middle">DOM</text>

    <rect x="230" y="234" width="96" height="24" rx="12" fill="#57534E" opacity="0.4"/>
    <text x="278" y="250" fill="#D6D3D1" font-size="12" text-anchor="middle">无障碍树</text>
  </g>

  <!-- 右下角装饰：浏览器窗口与节点 -->
  <g stroke="#EA580C" fill="none" opacity="0.25" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="512" y="176" width="86" height="66" rx="8"/>
    <line x1="512" y1="196" x2="598" y2="196"/>
    <circle cx="523" cy="186" r="2.4"/>
    <circle cx="533" cy="186" r="2.4"/>
    <circle cx="543" cy="186" r="2.4"/>
    <line x1="524" y1="210" x2="572" y2="210"/>
    <line x1="524" y1="220" x2="552" y2="220"/>
    <line x1="524" y1="230" x2="562" y2="230"/>
  </g>
  <g opacity="0.22" fill="#F59E0B">
    <path d="M584 214 L584 240 L591 234 L596 245 L601 243 L596 232 L605 231 Z"/>
  </g>
  <g stroke="#D6D3D1" fill="none" opacity="0.15" stroke-width="1.4">
    <circle cx="482" cy="228" r="9"/>
    <circle cx="482" cy="204" r="6"/>
    <line x1="482" y1="210" x2="482" y2="219"/>
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#barGrad)"/>
