    <circle cx="372" cy="30" r="1.7"/>
    <circle cx="430" cy="72" r="1"/>
    <circle cx="486" cy="28" r="1.4"/>
    <circle cx="540" cy="60" r="1.2"/>
    <circle cx="602" cy="34" r="1.6"/>
    <circle cx="626" cy="92" r="1.1"/>
    <circle cx="30" cy="150" r="1.3"/>
    <circle cx="88" cy="196" r="1"/>
    <circle cx="164" cy="164" r="1.5"/>
    <circle cx="232" cy="206" r="1.2"/>
    <circle cx="300" cy="172" r="1.6"/>
    <circle cx="364" cy="212" r="1"/>
    <circle cx="428" cy="164" r="1.3"/>
    <circle cx="494" cy="206" r="1.5"/>
    <circle cx="556" cy="168" r="1.1"/>
    <circle cx="618" cy="212" r="1.4"/>
    <circle cx="120" cy="272" r="1.2"/>
    <circle cx="196" cy="288" r="1"/>
    <circle cx="268" cy="266" r="1.5"/>
    <circle cx="342" cy="286" r="1.1"/>
    <circle cx="414" cy="270" r="1.3"/>
    <circle cx="548" cy="282" r="1.2"/>
    <circle cx="612" cy="264" r="1.6"/>
    <circle cx="66" cy="112" r="1.1"/>
    <circle cx="584" cy="126" r="1.3"/>
