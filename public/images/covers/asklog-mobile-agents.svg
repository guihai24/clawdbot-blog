<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <!-- 定义渐变与纹理 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="13" cy="13" r="1" fill="#D6D3D1" opacity="0.06" />
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  <!-- 左侧强调线 -->
  <rect x="50" y="45" width="4.5" height="210" rx="2" fill="url(#accentGrad)" />

  <!-- 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FAFAF9">
      <tspan x="0" dy="0">AI 编程助手别放着跑：</tspan>
      <tspan x="0" dy="28">手机审批才是关键</tspan>
    </text>

    <!-- 副标题 -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8A29E">
      AI 编程任务多开时，如何用手机随时决策与审批代码
    </text>

    <!-- 标签胶囊容器 (y ≈ 210-234) -->
    <g transform="translate(0, 210)">
      <!-- 标签 1 -->
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">上手指南</text>

      <!-- 标签 2 -->
      <rect x="84" y="0" width="70" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="119" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">asklog</text>

      <!-- 标签 3 -->
      <rect x="162" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="200" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D6D3D1" text-anchor="middle">移动审批</text>
    </g>
  </g>

  <!-- 装饰元素 (右下角 x ≥ 480, y ≥ 180) -->
  <g transform="translate(520, 185)" opacity="0.25">
    <!-- 手机外框 -->
    <rect x="25" y="0" width="40" height="75" rx="6" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <!-- 手机屏幕内容线 -->
    <line x1="33" y1="14" x2="57" y2="14" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="33" y1="24" x2="51" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <!-- 审批对勾按钮 -->
    <circle cx="45" cy="48" r="10" fill="#EA580C" />
    <polyline points="40,48 43,51 51,43" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 手机底部指示条 -->
    <line x1="40" y1="69" x2="50" y2="69" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />

    <!-- 散落的代码/任务几何符号 -->
    <polyline points="5,25 0,32 5,39" fill="none" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="85,25 90,32 85,39" fill="none" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>