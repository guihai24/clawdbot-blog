<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 强调线和底部色条渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 纸张颗粒感纹理 -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D6D3D1" opacity="0.06" />
      <circle cx="12" cy="14" r="1.2" fill="#D6D3D1" opacity="0.05" />
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="660" height="300" fill="url(#bgGrad)" />
  <rect width="660" height="300" fill="url(#dotPattern)" />

  <!-- 2. 左侧强调线 -->
  <rect x="50" y="40" width="4" height="220" rx="2" fill="url(#accentGrad)" />

  <!-- 3. 文字层 -->
  <g transform="translate(70, 0)">
    <!-- 标题 (多行，每行不超过20个字) -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22px" font-weight="bold" fill="#FAFAF9">
      <tspan x="0" dy="0">Python 依赖报错别急着重装，</tspan>
      <tspan x="0" dy="28">问题可能藏在 uv.lock 里</tspan>
    </text>

    <!-- 副标题 -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px" fill="#A8A29E">
      代码没改、依赖没动，Python 项目突然跑不起来？问题出在锁文件
    </text>

    <!-- 标签胶囊 (y ≈ 230-250) -->
    <g transform="translate(0, 215)">
      <!-- 标签 1 -->
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">上手指南</text>

      <!-- 标签 2 -->
      <rect x="86" y="0" width="76" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="124" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">Python</text>

      <!-- 标签 3 -->
      <rect x="172" y="0" width="70" height="24" rx="12" fill="#57534E" fill-opacity="0.4" />
      <text x="207" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#D6D3D1" text-anchor="middle">uv.lock</text>
    </g>
  </g>

  <!-- 4. 装饰元素 (仅在右下角 x ≥ 480, y ≥ 180 区域) -->
  <g transform="translate(530, 195)" opacity="0.25">
    <!-- 锁与依赖的简笔几何组合 -->
    <rect x="10" y="15" width="50" height="40" rx="6" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <path d="M 22 15 V 9 C 22 4, 38 4, 38 9 V 15" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="35" cy="32" r="4" fill="#EA580C" />
    <path d="M 35 36 V 42" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <!-- 旋转齿轮装饰点缀 -->
    <path d="M 75 10 L 78 13 M 85 20 L 88 23 M 75 23 L 78 20 M 85 13 L 88 10" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 5. 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGrad)" />
</svg>