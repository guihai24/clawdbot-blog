<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    
    <!-- 强调线渐变 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <!-- 纹理噪点 -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- 背景层 -->
  <rect width="660" height="300" fill="url(#bgGradient)"/>
  
  <!-- 不规则散点纹理（模拟纸张颗粒感） -->
  <g opacity="0.06" filter="url(#noiseFilter)">
    <circle cx="100" cy="50" r="3" fill="#D6A456"/>
    <circle cx="200" cy="80" r="2" fill="#D6A456"/>
    <circle cx="350" cy="120" r="4" fill="#D6A456"/>
    <circle cx="500" cy="60" r="2" fill="#D6A456"/>
    <circle cx="150" cy="200" r="3" fill="#D6A456"/>
    <circle cx="400" cy="250" r="2" fill="#D6A456"/>
    <circle cx="550" cy="180" r="3" fill="#D6A456"/>
    <circle cx="250" cy="150" r="2" fill="#D6A456"/>
    <circle cx="300" cy="50" r="3" fill="#D6A456"/>
    <circle cx="450" cy="100" r="2" fill="#D6A456"/>
  </g>
  
  <!-- 左侧强调线 -->
  <line x1="50" y1="0" x2="50" y2="280" stroke="url(#accentGradient)" stroke-width="5"/>
  
  <!-- 底部色条 -->
  <rect x="0" y="293" width="660" height="7" fill="url(#accentGradient)"/>
  
  <!-- 文字层 -->
  <text x="70" y="100" fill="#FEFCE8" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <tspan x="70" dy="0">AI Agent搞钱指南：</tspan>
    <tspan x="70" dy="28">别让它在错误的方向上</tspan>
    <tspan x="70" dy="28">狂奔八个小时</tspan>
  </text>
  
  <text x="70" y="140" fill="#D6A456" font-family="Arial, sans-serif" font-size="13">
    AI Agent 可以自己连续工作几个小时甚至几天，但如果目标模糊，它就会在错误
  </text>
  
  <!-- 标签胶囊 -->
  <!-- 标签1：目标七问 -->
  <g transform="translate(70, 240)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="#92400E" opacity="0.4"/>
    <text x="42" y="16" fill="#FDE68A" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">目标七问</text>
  </g>
  
  <!-- 标签2：Leader.skill -->
  <g transform="translate(165, 240)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#92400E" opacity="0.4"/>
    <text x="40" y="16" fill="#FDE68A" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">Leader.skill</text>
  </g>
  
  <!-- 标签3：搞钱实操 -->
  <g transform="translate(255, 240)">
    <rect x="0" y="0" width="75" height="24" rx="12" fill="#92400E" opacity="0.4"/>
    <text x="37.5" y="16" fill="#FDE68A" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">搞钱实操</text>
  </g>
  
  <!-- 装饰元素（右下角，x ≥ 480, y ≥ 180） -->
  <!-- 装饰1：小机器人图标（简笔线条风格） -->
  <g transform="translate(490, 190)" opacity="0.2">
    <path d="M 0 0 L 20 0 L 20 5 L 0 5 Z" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="10" cy="2" r="2" fill="#F59E0B" opacity="0.5"/>
    <path d="M 5 5 L 5 10 M 15 5 L 15 10" stroke="#F59E0B" stroke-width="1.5"/>
    <path d="M 3 10 L 17 10 L 15 15 M 5 15 L 7 10" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  
  <!-- 装饰2：齿轮图标 -->
  <g transform="translate(560, 210)" opacity="0.15">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#D6A456" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#D6A456"/>
    <path d="M 10 2 L 10 5" stroke="#D6A456" stroke-width="1"/>
    <path d="M 10 15 L 10 18" stroke="#D6A456" stroke-width="1"/>
    <path d="M 2 10 L 5 10" stroke="#D6A456" stroke-width="1"/>
    <path d="M 15 10 L 18 10" stroke="#D6A456" stroke-width="1"/>
  </g>
</svg>